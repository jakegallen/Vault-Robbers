  if(live){ adoptAccount(ch, live); return (ch==='evm')?String(live).toLowerCase():String(live); }
  // no live read this moment: use the bound (last-known live) address if we have one; else we cannot proceed safely.
  if(BOUND[ch]) return BOUND[ch];
  var e=new Error('Could not read your '+(ch==='evm'?'wallet':ch==='sol'?'Solana':'Bitcoin')+' account, reconnect to continue.'); e.walletDrift=true; throw e;
}
// Explicitly AUTHORIZE the EVM side of the connected wallet (a one-time eth_requestAccounts popup is fine AT CONNECT).
// This is the fix for "Phantom user sees only SOL": when the Solana side is connected but the dApp never requested
// EVM accounts, silent eth_accounts stays empty forever. Prefer Phantom's own EVM provider, else the stored wallet
// id's injected EVM, else the first discovered injected EVM. Returns the granted 0x address, or '' (never throws).
async function authorizeEvm(){
  var ok=function(a){ return a && /^0x[0-9a-fA-F]{40}$/.test(a) ? a : ''; };
  var W=window.EmblemWallet; var wid=connectedWalletId();
  var eip=null;
  // SCOPED to the CONNECTED wallet's EVM provider only: Phantom -> window.phantom.ethereum; any other -> findInjectedEvm(wid);
  // never discoverEvm()[0] (that could be a different brand). No cross-wallet reach.
  try{ if(wid==='phantom' && window.phantom && window.phantom.ethereum && window.phantom.ethereum.request) eip=window.phantom.ethereum; }catch(e){}
  try{ if(!eip && wid && W && W.findInjectedEvm) eip=W.findInjectedEvm(wid); }catch(e){}
  try{ if(!eip && W && W.evmEip1193) eip=W.evmEip1193; }catch(e){}   // the connector's pinned (connected) provider
  if(!eip||!eip.request) return '';
  try{ var accs=await eip.request({method:'eth_requestAccounts'}); if(accs&&ok(accs[0])) return accs[0]; }catch(e){}
  return '';
}
// Does the CONNECTED wallet have an EVM side? Every supported wallet (Phantom + all EVM brands) does, so this is true
// whenever a wallet is connected. Used to decide whether to offer the EVM-connect affordance.
function hasInjectedEvm(){
  var wid=connectedWalletId();
  try{ if(wid==='phantom') return !!(window.phantom && window.phantom.ethereum); }catch(e){}
  try{ var W=window.EmblemWallet; if(wid && W && W.findInjectedEvm) return !!W.findInjectedEvm(wid); }catch(e){}
  try{ if(!wid && window.ethereum) return true; }catch(e){}   // pre-connect: a single injected EVM exists
  return false;
}
function isBtcAddr(a){ return !!a && /^(bc1[a-z0-9]{8,87}|[13][a-km-zA-HJ-NP-Z1-9]{20,40})$/i.test(a); }
// SegWit v0 (P2WPKH) payment address only: bc1q... (NOT taproot bc1p..., NOT legacy 1.../3...). This is the
// spendable payment address mempool.space + Relay expect; taproot bc1p is Phantom's ordinals address.
function isSegwitPayAddr(a){ return !!a && /^bc1q[02-9ac-hj-np-z]{6,87}$/i.test(a); }
// Does THE CONNECTED WALLET have a Bitcoin side? Phantom -> window.phantom.bitcoin. Unisat/Xverse -> only if THAT is
// the wallet the user connected with. An EVM-only connected wallet (Rabby/MetaMask/Coinbase) has NO bitcoin provider,
// so this returns false and BTC is omitted (we never reach a different-brand BTC wallet).
function hasBtcProvider(){
  var wid=connectedWalletId();
  try{ if(wid==='phantom') return !!(window.phantom && window.phantom.bitcoin && window.phantom.bitcoin.requestAccounts); }catch(e){}
  try{ if(wid==='unisat') return !!window.unisat; }catch(e){}
  try{ if(wid==='xverse') return !!(window.XverseProviders||window.BitcoinProvider); }catch(e){}
  return false;   // EVM-only (or unknown) connected wallet -> no BTC side
}
// Pull Phantom's SegWit PAYMENT Bitcoin address from an accounts array of {address,addressType,purpose}. MUST be the
// bech32 SegWit payment address (bc1q...), NOT the taproot/ordinals one (bc1p...) and NOT legacy. Order:
// (1) purpose 'payment' AND bc1q SegWit, (2) any bc1q SegWit address, (3) a p2wpkh-typed address that is bc1q.
// We deliberately do NOT fall back to bc1p / legacy here (mempool.space + Relay expect the SegWit payment address).
function pickBtcPayment(acc){
  if(!Array.isArray(acc)) return '';
  var addrOf=function(e){ return (typeof e==='string')?e:(e&&(e.address||e.pubkey)); };
  var pay=acc.find(function(e){ return e && e.purpose==='payment' && isSegwitPayAddr(addrOf(e)); });
  if(pay) return addrOf(pay);
  var typed=acc.find(function(e){ return e && /p2wpkh/i.test(String(e.addressType||'')) && isSegwitPayAddr(addrOf(e)); });
  if(typed) return addrOf(typed);
  for(var i=0;i<acc.length;i++){ var ad=addrOf(acc[i]); if(isSegwitPayAddr(ad)) return ad; }   // any bc1q SegWit
  return '';
}
// Explicitly AUTHORIZE the Bitcoin side (a one-time popup is fine AT CONNECT / on an explicit opt-in, like EVM). Phantom
// exposes window.phantom.bitcoin.requestAccounts() -> [{address,addressType,purpose}]; we keep the 'payment' address.
// Also tries the connector's connectBtc. Caches into VSPAY.btcAddr. Returns the address, or '' (never throws).
// A STABLE identity for the currently-connected wallet, used to owner-stamp a cached BTC address so one wallet's bc1
// never bleeds into another. EVM-primary (stable across the connect->fetch transition where SOL may be captured a beat
// later), else SOL. Phantom's EVM+SOL are one wallet, so either uniquely identifies it.
function _vsWalletOwnerKey(){ try{ return (WALLET && /^0x[0-9a-fA-F]{40}$/.test(WALLET)) ? ('e:'+WALLET.toLowerCase()) : (VSPAY.solAddr?('s:'+VSPAY.solAddr):''); }catch(e){ return ''; } }
function _setBtcAddr(a){ if(isBtcAddr(a)){ VSPAY.btcAddr=a; VSPAY.btcOwner=_vsWalletOwnerKey(); try{ localStorage.setItem('vs_btc', a); localStorage.setItem('vs_btc_owner', VSPAY.btcOwner); }catch(e){} return a; } return ''; }
async function authorizeBtc(){
  var W=window.EmblemWallet; var wid=connectedWalletId();
  // SCOPED TO THE CONNECTED WALLET'S OWN BITCOIN SIDE ONLY. We NEVER prompt a different-brand BTC wallet. If the
  // connected wallet has no bitcoin side (EVM-only wallet), return '' immediately - BTC is omitted, and we do NOT
  // reuse any cached bc1 from a different wallet.
  if(wid!=='phantom' && wid!=='unisat' && wid!=='xverse') return '';
  if(wid==='phantom'){
    // Phantom bitcoin: request accounts (one prompt, same Phantom the user connected), keep the SegWit bc1q payment addr.
    try{ var pb=window.phantom && window.phantom.bitcoin;
      if(pb && pb.requestAccounts){ var acc=await pb.requestAccounts(); var ad=pickBtcPayment(acc); if(isSegwitPayAddr(ad)) return _setBtcAddr(ad); }
    }catch(e){}
    // fall back to what Phantom already gave the connector (same wallet), never another brand.
    try{ if(W && isBtcAddr(W.btcPaymentAddress)) return _setBtcAddr(W.btcPaymentAddress); if(W && isBtcAddr(W.btcAddress)) return _setBtcAddr(W.btcAddress); }catch(e){}
  } else if((wid==='unisat' || wid==='xverse') && W && W.connectBtc){
    // The user connected with a dedicated BTC wallet: use THAT one only. Unisat returns a taproot bc1p payment address
    // which the server + mempool read fine, so accept any valid BTC address here.
    try{ await W.connectBtc(wid); var a=(W.btcPaymentAddress||W.btcAddress);
      if(isSegwitPayAddr(a)) return _setBtcAddr(a);
      if(isBtcAddr(a)) return _setBtcAddr(a);
    }catch(e){}
  }
  // same-wallet cache only (no cross-wallet reach).
  try{ if(isBtcAddr(VSPAY.btcAddr)) return VSPAY.btcAddr; }catch(e){}
  return '';
}
// Pull the wallet's REAL holdings across ALL supported source chains + Solana from the server route (the browser
// can only read one EVM chain itself). Auto-connects Phantom's Solana side when present so a Phantom user's SOL
// shows without a manual step; captures the EVM address robustly (incl. Phantom's EVM) so an EVM-funded wallet
// always surfaces. Caches the result + the per-asset chain so the buy uses the SAME chain we display.
// Returns null ONLY on total failure (route unreachable) so the caller keeps the full fallback list.
async function fetchHeldPay(){
  try{
    // 1) EVM: the LIVE active account is the source of truth. Adopt it so the balance we query + show is strictly the
    // live account (never a stale cached one) and the session follows a switch that happened while the modal was closed.
    var evm=''; try{ evm=await captureEvmAddr(); }catch(e){ evm=''; }
    try{ if(evm) adoptAccount('evm', evm); }catch(e){}
    // 2) SOLANA: the LIVE pubkey (or the bound one) only - captureSolAddr no longer falls back to arbitrary caches, so a
    // prior account's pubkey can never be queried. Adopt it so display, balance and the SOL buy all use the same address.
    var solAddr=''; try{ solAddr=await captureSolAddr(); }catch(e){ solAddr=''; }
    try{ if(solAddr) adoptAccount('sol', solAddr); }catch(e){}
    // 3) CONSISTENCY: sync cross-wallet caches to the live wallet before reading BTC.
    _vsSyncWalletTo(evm, solAddr);
    // keep the cached SOL strictly equal to the live/bound address we just resolved (never a prior account's pubkey).
    VSPAY.solAddr = solAddr || '';
    // 4) BITCOIN: SILENT only (NEVER a cold popup here), and OWNER-GATED so a previous wallet's bc1 can never carry
    // over. A cached BTC (VSPAY.btcAddr / localStorage) is reused ONLY when its stamped owner == the current wallet.
    // The connector's btcPaymentAddress is trusted only if no different-owner cache contradicts it; otherwise we OMIT
    // BTC (no stale address, no nag) until the user explicitly authorizes BTC for THIS wallet.
    var curOwner=_vsWalletOwnerKey();
    var btcAddr='';
    // GATE: only read BTC at all if the CONNECTED wallet has a bitcoin side (Phantom / Unisat / Xverse). An EVM-only
    // wallet (Rabby/MetaMask/Coinbase) has no BTC side, so omit BTC and never reuse a cached bc1 from another wallet.
    if(hasBtcProvider()){
    // (a) in-memory cache for the SAME wallet
    try{ if(isBtcAddr(VSPAY.btcAddr) && VSPAY.btcOwner===curOwner) btcAddr=VSPAY.btcAddr; }catch(e){}
    // (b) persisted cache for the SAME wallet (owner key must match)
    if(!btcAddr){ try{ var lsb=localStorage.getItem('vs_btc'); var lso=localStorage.getItem('vs_btc_owner'); if(isBtcAddr(lsb) && lso===curOwner){ btcAddr=lsb; } }catch(e){} }
    // (c) connector's live BTC payment address (from a connectBtc this session). Accept it and (re)stamp it to the
    //     current wallet. The connector only holds a BTC address after an explicit connectBtc, so this is current-wallet.
    if(!btcAddr){ try{ var W2=window.EmblemWallet; if(W2){ var ca=(isBtcAddr(W2.btcPaymentAddress)?W2.btcPaymentAddress:(isBtcAddr(W2.btcAddress)?W2.btcAddress:'')); if(isBtcAddr(ca)) btcAddr=ca; } }catch(e){}
    }
    }   // end hasBtcProvider() gate
    if(!isBtcAddr(btcAddr)) btcAddr='';
    if(isBtcAddr(btcAddr)){ _setBtcAddr(btcAddr); }   // re-stamp to the CURRENT wallet owner (never the prior one)
    else { VSPAY.btcAddr=''; }   // no BTC for this wallet -> omit it (do not reuse a prior wallet's address)
    if(!evm && !solAddr && !btcAddr) return null;
    // Flag the "SOL connected but EVM not authorized yet, while an injected EVM exists" case so the buy modal can
    // offer a one-tap "Connect your EVM wallet" affordance (the user holds EVM assets but we can't see them yet).
    VSPAY.evmMissing = (!evm && !!solAddr && hasInjectedEvm());
    // NO proactive BTC nag: BTC shows as a chip only when its address+balance are available from the connected wallet.
    // We never prompt "Connect your Bitcoin wallet" on modal open (removed per earlier instruction).
    VSPAY.btcMissing = false;
    var qs=[]; if(evm) qs.push('evm='+encodeURIComponent(evm)); if(solAddr) qs.push('sol='+encodeURIComponent(solAddr)); if(btcAddr) qs.push('btc='+encodeURIComponent(btcAddr));
    var r=await fetch('api/pay/balances?'+qs.join('&')).then(function(r){return r.json();}).catch(function(){return null;});
    if(!r||!r.ok||!Array.isArray(r.held)) return null;
    // Build key -> {amount, usd, chainId} and remember the chain each asset pays from. The server already applied the
    // FEASIBILITY GATE, so r.held contains ONLY assets the wallet can actually complete a $10 entry with; r.reason is
    // a one-line message when nothing qualifies (used to disable Buy In with a clear reason).
    var map={}; VSPAY.chainByKey={}; VSPAY.reason=(r.reason||null);
    // GAS PRE-FLIGHT: the server already reads the wallet's NATIVE Robinhood (4663) balance for its own gas feasibility
    // gate; it now echoes that USD value as rhNativeUsd. We cache it so the pay-any-token flow can verify the user can
    // actually SIGN the 4663 approve/buyIn BEFORE converting (and top up a tiny gas slice if short). null = unknown.
    VSPAY.rhNativeUsd = (r.rhNativeUsd!=null)?Number(r.rhNativeUsd):null;
    r.held.forEach(function(h){ if(!h||!h.key) return; map[h.key]={ amount:h.amount, usd:(h.usd!=null?h.usd:null), symbol:h.symbol, chainId:h.chainId };
      if(h.chainId) VSPAY.chainByKey[h.key]=h.chainId; });
    VSPAY.held=map;
    return map;
  }catch(e){ return null; }
}
// Clean USD label for the chips (no tilde): "$20.07", "$1,240". Empty when not priceable.
function fmtUsdClean(n){ if(!(n>0)) return ''; if(n>=1000) return '$'+Math.round(n).toLocaleString(); if(n>=100) return '$'+(Math.round(n*100)/100).toLocaleString(); return '$'+(Math.round(n*100)/100); }
// Chip meta is USD-ONLY now: the dollar value, no native amount. Null when the asset has no USD price (it gets hidden).
function heldMeta(h){ if(!h || h.usd==null || !(h.usd>0)) return null; return { val:fmtUsdClean(h.usd) }; }

// Disable the Buy In button with a one-line reason (nothing the wallet holds can fund a $10 entry). Re-enabled by a

function vsClearBuyGate(scope){ var btn=vsBuyBtn(scope); if(btn&&btn.getAttribute('data-vsgate')){ btn.removeAttribute('disabled'); btn.classList.remove('locked'); btn.removeAttribute('data-vsgate'); } }
// Render + wire a one-tap "Connect" affordance inside a scope, shown when the wallet has more sides to authorize than
// are currently read (EVM not authorized while an injected EVM exists, and/or a Bitcoin provider with no BTC address).
// Tapping it authorizes whatever is missing (one popup each) then re-runs the grid so those coins appear. true if shown.
function vsRenderEvmConnect(scope, onPick){

  // There is NO proactive BTC nag: BTC appears as a chip only when its address+balance come from the connected wallet.

function vsClearEvmConnect(scope){ var line=document.querySelector(scope+' #evmConnectLine'); if(line&&line.parentNode) line.parentNode.removeChild(line); }
// CLIENT THROTTLE: this is called from the main render loop (every ~1s state push) via the inline fill module, which
// otherwise re-reads /api/pay/balances + prices every tick for a single open buyer, burning the shared rate bucket.
// The actual pay-grid only needs to refresh on OPEN, on a QTY/TOKEN change, or on a wallet switch, not per tick. We
// skip a non-forced refresh when: the grid is already rendered AND the material signature (live EVM/SOL/BTC address +
// qty) is unchanged AND the last successful refresh was within the TTL. Explicit user-driven callers pass force=true
// (open / qty step / connect) so they still refresh immediately. This cuts a single buyer's call volume at the source.
var _PAYGRID_T={};   // scope -> {sig, ts}
function _payGridSig(){ try{ return (BOUND.evm||'')+'|'+(BOUND.sol||'')+'|'+(BOUND.btc||'')+'|'+(window.TICKETS!=null?TICKETS:(typeof TICKETS!=='undefined'?TICKETS:'')); }catch(e){ return String(Date.now()); } }
async function vsRefreshPayGrid(scope, onPick, force){
  if(!relayAvailable()) return;
  var grid=document.querySelector(scope+' #payGrid'); if(!grid) return;
  // Throttle non-forced (render-loop) refreshes: if the grid already shows chips and nothing material changed within
  // the last 15s, do not re-read balances/prices. A forced call (user action) always proceeds.
  try{
    var sig=_payGridSig(), now=Date.now(), st=_PAYGRID_T[scope];
    var rendered=!grid.classList.contains('loading') && grid.querySelector('.payopt');
    if(!force && rendered && st && st.sig===sig && (now-st.ts)<15000) return;
  }catch(e){}
  var held=await fetchHeldPay();
  grid.classList.remove('loading');
  if(!held){
    // Balance read failed: show a clear one-line fallback, NEVER the full static catalog of coins the wallet may not
    // hold. The buy stays available (a retry re-reads), so this is a soft, honest state rather than a false menu.
    grid.innerHTML='<span class="payrow-lead" style="grid-column:1/-1">could not read your wallet, tap Buy In to retry</span>';
    return;
  }
  // The server already applied the FEASIBILITY GATE: held contains ONLY assets a $10 entry can complete with.
  var show=PAY_SRCS.filter(function(o){ var h=held[o.key]; return !!h && h.usd!=null && Number(h.usd)>0; });
  if(!show.length){
    // Nothing the wallet holds can fund a $10 entry: do NOT leave a pickable-but-doomed state. Disable Buy In with
    // the server's one-line reason, and clear the grid so no dust chip is selectable.
    grid.innerHTML='<span class="payrow-lead" style="grid-column:1/-1">no coin with enough for a $'+ENTRY_USD+' entry</span>';
    // even with nothing feasible yet, if the EVM side is unauthorized offer the connect affordance (their EVM coins
    // may fund it once authorized) and DON'T hard-disable in that case.
    if(vsRenderEvmConnect(scope, onPick)){ vsClearBuyGate(scope); }
    else { vsClearEvmConnect(scope); vsDisableBuy(scope, VSPAY.reason||('Not enough balance in a supported coin for a $'+ENTRY_USD+' entry.')); }
    return;
  }
  vsClearBuyGate(scope);
  // SOL present but EVM not authorized yet: show the one-tap connect line above the held chips so the user can pull in
  // their ETH/USDC/RVLT. If EVM is authorized (or absent), remove any stale line.
  if(!vsRenderEvmConnect(scope, onPick)) vsClearEvmConnect(scope);
  // keep the selection valid; if the current PAYSRC isn't held, move to the largest-value held asset (first in list).
  if(!show.some(function(o){ return o.key===PAYSRC; })){ PAYSRC=show[0].key; }
  // pin the origin chain for the selected asset so the native symbol + buy use the same chain we display.
  try{ if(ESC && VSPAY.chainByKey[PAYSRC]) ESC._originChain=VSPAY.chainByKey[PAYSRC]; }catch(e){}
  grid.innerHTML=show.map(function(o){ return payChipHTML(o, heldMeta(held[o.key])); }).join('');
  grid.querySelectorAll('.payopt').forEach(function(b){ b.onclick=function(){ PAYSRC=b.getAttribute('data-k'); try{ if(ESC && VSPAY.chainByKey[PAYSRC]) ESC._originChain=VSPAY.chainByKey[PAYSRC]; }catch(e){} grid.querySelectorAll('.payopt').forEach(function(x){ x.classList.toggle('p', x.getAttribute('data-k')===PAYSRC); }); if(onPick) onPick(); }; });
  // stamp this scope's last successful render signature so the render-loop throttle can skip redundant re-reads.
  try{ _PAYGRID_T[scope]={ sig:_payGridSig(), ts:Date.now() }; }catch(e){}
}

// RETIRED: buyDock is unified onto the ONE canonical buy module (fillModuleBody), which now handles BOTH the active

async function connectWith(id){
  var W=window.EmblemWallet; var eip=W&&W.findInjectedEvm&&W.findInjectedEvm(id);
  if(!eip||!eip.request){ toast('Could not open '+(WNAME[id]||id)); return; }
  try{
    var accs=await eip.request({method:'eth_requestAccounts'});
    var addr=accs&&accs[0]; if(!addr){ toast('No address returned'); return; }
    // PIN this exact wallet in the connector so every later escrow sign/buy routes to it (not MetaMask). Silent
    // attach reuses the just-granted accounts (no second popup) and never forces a chain switch.
    try{ if(W.attachEvmSilently) await W.attachEvmSilently(id); }catch(e){}
    // CONNECTING A (possibly different) wallet: if the EVM address changed from what we had, clear the prior wallet's
    // cross-wallet caches (BTC in localStorage) so its data can't bleed into this one; then set the new baseline.
    try{ if(VSPAY._lastEvm && VSPAY._lastEvm.toLowerCase()!==addr.toLowerCase()){ VSPAY.btcAddr=''; VSPAY.btcOwner=''; VSPAY.solAddr=''; VSPAY._lastSol=null; try{ localStorage.removeItem('vs_btc'); localStorage.removeItem('vs_btc_owner'); }catch(e){} } }catch(e){}
    try{ VSPAY._lastEvm=addr; VSPAY.btcMissing=false; }catch(e){}
    // CONNECT = the initial adopt for each available chain. Clear any prior binding first, then adopt EVM as the live
    // authoritative account (sets WALLET/TOKEN/NAME/BOUND.evm; resets VERIFIED so this address proves once below).
    VERIFIED=false; VERIFIED_ADDR=null;
    clearBound(); localStorage.setItem('vs_walletid',id); adoptAccount('evm', addr);
    // EXPLICIT CONNECT ALWAYS establishes the wallet session. adoptAccount only sets TOKEN inside its changed-guard,
    // so a reconnect to the SAME address (WALLET already set from a prior session) would leave TOKEN as the anon guest
    // and the header stuck on "Connect". Force the canonical wallet session here, unconditionally.
    WALLET=addr; TOKEN='w:'+String(addr).toLowerCase(); NAME=shortAddr(addr);
    try{ localStorage.setItem('vs_token',TOKEN); localStorage.setItem('vs_name',NAME); localStorage.setItem('vs_wallet',addr); }catch(e){}
    try{ var _cc=$('#conn'); if(_cc){ _cc.textContent='🔗 '+shortAddr(addr); _cc.classList.remove('p'); } }catch(e){}
    try{ vsWireWalletSwitch(); }catch(e){}   // subscribe to accountsChanged / Solana accountChanged / BTC on the connected providers
    // ITEM A (definitive Solana fix): on Phantom connect ONLY the EVM side is granted; the Solana side is never
    // .connect()-ed, so window.phantom.solana.publicKey stays null, captureSolAddr() returns '' and the SOL chip never
    // shows, even though the SPEND path (resolveRelayOrigin) eagerly connects Solana at buy time. Eagerly connect the
    // Solana side HERE, scoped to Phantom, reusing the exact connector calls the spend path already trusts:
    // attachSolanaSilently first (no popup for returning users), then connectSolana (one-time approval for first-timers).
    // This populates window.phantom.solana.publicKey so the captureSolAddr() below returns the LIVE pubkey. We do NOT
    // restore any cached/bound fallback: captureSolAddr stays live-only and the stale-SOL drop guards are untouched, so
    // the old ghost-balance bug cannot return.
    if(id==='phantom'){
      try{
        var _sok=false;
        try{ if(W.attachSolanaSilently && await W.attachSolanaSilently('phantom')) _sok=true; }catch(e){}
        if(!_sok && W.connectSolana){ try{ await W.connectSolana('phantom'); }catch(e){} }
      }catch(e){}
    }
    // SOLANA: if this wallet has a Solana side (Phantom), adopt its pubkey so display, balances and the SOL buy all use it.
    try{ var _sb=await captureSolAddr(); if(_sb) adoptAccount('sol', _sb); }catch(e){}
    // BITCOIN: if this wallet also exposes a Bitcoin side (Phantom), authorize it now so a BTC holder's BTC chip shows
    // without a second trip. Part of the explicit connect, so a prompt is expected; non-fatal if declined.
    try{ if(id==='phantom' || hasBtcProvider()){ var _bb=await authorizeBtc(); if(_bb) adoptAccount('btc', _bb); } }catch(e){}
    // auto-load + switch to the live Robinhood network so you can play straight after connecting (non-fatal if declined)
    if(ESC.on){ try{ await ensureNetwork(eip, ESC.chainId); }catch(e){} }
    // PROVE CONTROL AT CONNECT (one signature, no transaction). This binds the SESSION to the SEAT: the server marks
    // this token verified, so chat, profile, the paid seat, AND playing it all line up under 'w:'+address. Without it a
    // buyer could end up watching their own paid seat as a spectator (me.inGame resolves off an unproven token). If the
    // signature is declined, play still works via the address fallback once a seat exists, but we nudge them to sign.
    var verified=false;
    try{ var non=await (await fetch('api/siwe/nonce?address='+addr.toLowerCase())).json(); if(non&&non.message){ var sig=await eip.request({method:'personal_sign',params:[non.message,addr]}); var vr=await (await fetch('api/siwe/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,signature:sig})})).json(); _grabSess(vr); verified=!!(vr&&vr.verified); if(verified){VERIFIED=true; VERIFIED_ADDR=addr.toLowerCase();} } }catch(e){}
    api('join',{token:TOKEN,name:NAME,tickets:TICKETS}).then(function(r){ if(r&&r.tickets)setTix(r.tickets); toast(verified?('✅ '+(WNAME[id]||'')+' '+shortAddr(addr)):('🔗 '+shortAddr(addr)+', tap to sign in')); poll(); });
  }catch(e){ toast((e&&/reject|denied|4001/i.test(e.message||''))?'Connect cancelled':'Connect failed'); }
}

function disconnect(){ try{ if(TOKEN) api('logout',{token:TOKEN}); }catch(e){}

  // RECONNECT FIX: the app clears its OWN state above, but the EmblemWallet connector still pins the live EVM/Sol/BTC
  // accounts (and the cached EVM provider/signer). Without resetting them a fresh connectWith reuses the stale connector

// server via /api/escrow/config.chainId; the client only ever transacts on that chain. Mainnet is labelled with
// "real funds" on purpose, it is the public money network, not a throwaway devnet.

// adding it via EIP-3085 if the wallet doesn't know it). Robinhood 4663 is the DESTINATION, never a Relay source.

// Switch the wallet to `chainId`, adding it (EIP-3085) if unknown. Works for the Relay SOURCE chains above, so a buy
// pays from the chain the chosen asset actually lives on (not whatever chain the wallet happens to be sitting on).
async function ensureEvmSrcChain(eip, chainId){
  var hex=chainHex(chainId), p=EVM_SRC_CHAINS[Number(chainId)];
  try{ await eip.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]}); return true; }
  catch(e){
    var unknown = e && (e.code===4902 || (e.data&&e.data.originalError&&e.data.originalError.code===4902) || /unrecogni|not.*add|add.*chain|4902/i.test(e.message||''));
    if(p && unknown){
      await eip.request({method:'wallet_addEthereumChain',params:[{ chainId:hex, chainName:p.chainName, rpcUrls:p.rpcUrls, nativeCurrency:p.nativeCurrency, blockExplorerUrls:p.blockExplorerUrls }]});
      await eip.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]});
      return true;
    }
    throw e;
  }
}

// Add the chain to the wallet if it doesn't know it (EIP-3085), then switch to it (EIP-3326). Returns true on success.
async function ensureNetwork(eip,chainId){
  var n=netByChain(chainId), hex=chainHex(chainId);
  try{ await eip.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]}); return true; }
  catch(e){
    var unknown = e && (e.code===4902 || (e.data&&e.data.originalError&&e.data.originalError.code===4902) || /unrecogni|not.*add|add.*chain|4902/i.test(e.message||''));
    if(n && unknown){
      await eip.request({method:'wallet_addEthereumChain',params:[{ chainId:hex, chainName:n.name, rpcUrls:[n.rpc], nativeCurrency:n.cur }]});
      await eip.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]});
      return true;
    }
    throw e;
  }

/* ---- VERIFY THIS ROUND ---------------------------------------------------------------------------------
   Independently reproduce a settled round from its published proof (GET api/round/:id/proof): the revealed
   seed + every logged pick + the busted-door-per-chamber trail. We recompute the busted door for each chamber
   from the picks (using the SAME seeded PRNG the server used for any absent/auto draw) and confirm it matches
   the proof. When escrow is on we also check keccak256(seed) == the on-chain committed seedHash, proving the
   seed was fixed BEFORE the round played. This is what lets the fairness copy stand. ---- */
// browser twin of the server PRNG: keccak256(toUtf8Bytes(seed:roundId:label:ctr)) -> stream of 48-bit floats.
function vsPrng(seed, roundId, label){
  var ctr=0, base=String(seed)+':'+String(roundId)+':'+String(label), pool=null, off=0;
  function hexToBytes(h){ h=h.slice(2); var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function refill(){ pool=hexToBytes(ethers.keccak256(ethers.toUtf8Bytes(base+':'+(ctr++)))); off=0; }
  return function(){ if(!pool||off+6>pool.length) refill(); var v=0; for(var i=0;i<6;i++){ v=v*256+pool[off+i]; } off+=6; return v/281474976710656; };

async function checkWinnings(){
  if(!ESC.on) return;

  var esc=new ethers.Contract(ESC.address,ESC_ABI,signer);
  toast('Checking your heists…');
  var ids=rs.slice(-12).reverse();
  // READ PHASE, parallel: classify every round at once (settled? / claimable win / refundable void). Reads are
  // free view calls so they fan out; only the actual claim/refund TXS are serialized (nonce ordering).
  var plans=await Promise.all(ids.map(async function(id){
    try{
      if(await esc.settled(id,addr)) return null;
      var r=await esc.rounds(id), status=Number(r[8]);

      else if(p.kind==='refund'){ await (await esc.refund(p.id)).wait(); toast('↩️ Refunded'); did=true; }
    }catch(e){ /* already handled or still locked */ }
  }
  if(!did) toast('Nothing to claim right now'); poll();
}

function weiToRvlt(w){ try{ return Math.round(Number(w)/1e18); }catch(e){ return 0; } }
/* ---- GAS PRE-FLIGHT for the pay-any-token flow ---------------------------------------------------------------
   When a user pays with a NON-RVLT token, the Relay convert delivers RVLT to their 4663 wallet but leaves NO native
   4663 gas, and the very next step is a USER-SIGNED 4663 tx (the auto-play approve, or the single buyIn) that needs
   gas. With no gas, Phantom reports "Failed to simulate / unsafe" and ethers throws "could not coalesce error". We
   VERIFY the user has enough native 4663 gas BEFORE the convert and, if short, deliver a SMALL server-bounded gas
   slice from the SAME origin token (relayDeliverNative) as a separate leg run while that token is still held, so it
   works even when the pay token is the user's only asset. The gas stays in the user's wallet; money-safe and additive.
   This NEVER touches the RVLT amount, the approve bound, the range sig, or settle. */
var GAS_RESERVE_4663_USD=0.25;   // match the server's GAS_RESERVE_USD[4663]; below this we treat the wallet as gas-short
var GAS_SLICE_HINT_WEI='500000000000000';   // 0.0005 native hint; server CLAMPS to its own GAS_SLICE_WEI_4663 (authoritative)
// Read the recipient's native 4663 balance in USD terms is not needed; we need a boolean "has enough gas". Prefer the
// server's rhNativeUsd (already read by pay/balances); fall back to a live eth_getBalance against the escrow chain.
async function has4663Gas(recipient){
  // (1) server-provided USD value (authoritative, no extra RPC) when we have it.
  try{ if(VSPAY&&VSPAY.rhNativeUsd!=null) return Number(VSPAY.rhNativeUsd) >= GAS_RESERVE_4663_USD; }catch(e){}
  // (1b) C5: a FRESH pre-warmed native 4663 read (taken when the pay sheet opened) makes the check determinate even when
  // the server's rhNativeUsd came back null. Only trust it for ~30s so a just-dripped balance isn't read as still-empty.
  try{ if(VSPAY&&VSPAY.rhGasWei!=null && (Date.now()-VSPAY.rhGasTs)<30000) return BigInt(VSPAY.rhGasWei) >= 100000000000000n; }catch(e){}
  // (2) fallback: live native balance read on the escrow chain. Any non-trivial balance clears the bar (the slice is
  // tiny and Robinhood gas is ~$0.002/tx); we treat > ~0.0001 native as "has gas" without needing a price.
  try{
    var eip=escProvider(); if(!eip||!recipient) return null;   // unknown -> caller decides (optimistic / best-effort)
    var hex=await eip.request({ method:'eth_getBalance', params:[recipient, 'latest'] });
    var wei=BigInt(hex||'0x0'); try{ VSPAY.rhGasWei=wei.toString(); VSPAY.rhGasTs=Date.now(); }catch(_){}
    return wei >= 100000000000000n;   // >= 0.0001 native
  }catch(e){ return null; }   // unknown
}
// C5: PRE-WARM the 4663 native gas read when the pay sheet / pop-out opens, so has4663Gas is DETERMINATE at buy time
// (drip-ahead instead of fail-at-signer). Reads the live connected EVM account's native balance on the escrow chain and
// caches it (VSPAY.rhGasWei/rhGasTs). Best-effort + non-blocking: never throws, never prompts, no money logic touched.
async function prewarm4663Gas(){
  try{
    if(!(ESC&&ESC.on&&Number(ESC.chainId)===4663)) return;   // only meaningful on the live mainnet escrow
    if(VSPAY&&VSPAY.rhGasWei!=null && (Date.now()-VSPAY.rhGasTs)<15000) return;   // already fresh
    var eip=escProvider(); if(!eip) return;
    var addr=''; try{ addr=await captureEvmAddr(); }catch(e){ addr=''; }
    if(!/^0x[0-9a-fA-F]{40}$/.test(addr)) return;
    var hex=await eip.request({ method:'eth_getBalance', params:[addr,'latest'] });
    try{ VSPAY.rhGasWei=BigInt(hex||'0x0').toString(); VSPAY.rhGasTs=Date.now(); }catch(_){}
  }catch(e){}
}
// PRIME THE RELAYER GAS DRIP (make it actually land without weakening the server's anti-drain gates). The server's
// /api/gas-drip requires BOTH (a) a SIWE-verified session for THIS recipient and (b) a registered buy-intent (a seat
// candidate for the pending round). In the Relay buy path the gas leg can run before SIWE is minted and before the
// entry-quote has registered the seat candidate, so a too-early drip gets 401 / {ok:false,'no active buy intent'} and
// dead-ends. This establishes BOTH, in order, right before the drip:
//   (1) SIWE — a message signature (NO gas), so even a gasless wallet can mint the session the drip's SIWE gate needs.
//   (2) INTENT — /api/relay/preflight registers a seat candidate (addSeatCandidate on pf.ok) for the pending buy-round,
//       which is exactly what hasActiveBuyIntent() reads. preflight is read-only + idempotent and seating still
//       ultimately requires on-chain ticketsOf>0, so this NEVER seats an unpaid wallet or touches any money amount.
// Returns a zero-arg async primer so ensureRhGasPreflight can run it before the drip AND re-run it once on a retry.
function _primeGasDrip(recipient, tickets, roundId){
  return async function(){
    try{ await ensureSiwe(); }catch(e){}
    try{
      var body={ user:recipient, qty:Math.max(1,Math.min(10,tickets||1)), swap:true };
      if(roundId!=null) body.buyId=String(roundId);
      await fetch('api/relay/preflight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).catch(function(){return null;});
    }catch(e){}
  };
}
// Ensure the recipient can SIGN the next 4663 tx: verify native gas, and if short deliver a tiny gas slice from the
// origin token BEFORE the RVLT convert. originKind/originChainId/originCurrency come from resolveRelayOrigin. Same-chain
// 4663-native pays (ETH on Robinhood) fund gas from the pay itself, so we skip the leg there. Throws a friendly
// .preflight error if gas can't be secured. No-op (returns) when the wallet already has gas or gas is best-effort-unknown.
// `prime` (optional): an async primer (see _primeGasDrip) that establishes SIWE + buy-intent so the server drip lands.
async function ensureRhGasPreflight(src, originChainId, originCurrency, recipient, stage, prime){
  var st=stage||function(){};
  var W=window.EmblemWallet; if(!W) return;
  st('Verifying you have enough gas on each chain…');
  // A same-chain 4663-native pay (ETH on Robinhood) pays its own gas from the ETH it swaps, so no separate leg is needed.
  var originIsRhNative=(Number(originChainId)===4663 && src && src.token==='native' && src.origin!=='sol' && src.origin!=='btc');
  if(originIsRhNative) return;
  var hasGas=await has4663Gas(recipient);
  if(hasGas===true) return;                 // already has gas: skip the leg entirely (EVM gas-funded path unchanged)
  if(hasGas===null) return;                 // could not determine: stay optimistic, don't block (buy-in catch still guides)
  // Short on gas. PRIMARY path: RELAYER GAS DRIP. The server sends a tiny, server-bounded, once-per-wallet native
  // 4663 slice from the relayer (SIWE-gated to this wallet). This is the reliable mechanism: a player already on
  // Robinhood with zero gas cannot be topped up via Relay (a same-chain native send is rejected, and a gasless
  // player can't sign+pay an origin deposit to bridge gas in). The relayDeliverNative path is kept only as a
  // secondary fallback for the (rare) case the drip itself fails and the origin token can still fund a leg.
  // ORDER: establish SIWE + buy-intent (prime) FIRST so the drip clears the server gates, THEN drip.
  st('Adding a little Robinhood Chain gas…');
  if(typeof prime==='function'){ try{ await prime(); }catch(e){} }
  var dripped=await gasDrip4663(recipient);
  // RETRY: if the first drip still failed (a seat-candidate persistence race, or SIWE minted a beat late), re-prime
  // SIWE + intent and drip once more before falling back to the Relay native leg. Amount stays server-authoritative.
  if(dripped==='fail' && typeof prime==='function'){
    try{ await prime(); }catch(e){}
    dripped=await gasDrip4663(recipient);
  }
  if(dripped==='ok' || dripped==='skipped') return;   // drip landed (balance confirmed) or server says already funded
  // Drip genuinely unavailable (relayer issue / already-dripped-and-still-empty): try the Relay leg from the origin
  // token as a last resort before surfacing the manual message. SERVER-BOUNDED amount; the client figure only has to
  // be > 0 to pass relayDeliverNative's guard, the server clamps to GAS_SLICE_WEI_4663.
  try{
    await W.relayDeliverNative(4663, GAS_SLICE_HINT_WEI, recipient, {
      origin:src.origin, originChainId:originChainId, originCurrency:originCurrency,
      onStage:function(m){ st(m); }
    });
  }catch(e){
    var ge=new Error('You need a little Robinhood Chain gas to sign this and the top-up could not complete. Add a little gas, or use MetaMask, Rabby or Rainbow, then try again. Nothing was spent.');
    ge.preflight=true; throw ge;
  }
}
// RELAYER GAS DRIP (client side): ask the server to send a tiny native 4663 slice to `recipient` from the relayer,
// then poll the on-chain native balance until it reflects the drip (bounded ~10s). Returns:
//   'ok'      -> a drip landed and the balance now clears the gas bar
//   'skipped' -> the server found the wallet already had gas (nothing sent); proceed immediately
//   'fail'    -> the drip could not be completed (relayer issue / already-dripped-and-empty / not signed in)
// SIWE: the request carries the x-vs-token session header; the server rejects (401) unless that session is a
// SIWE-verified match for `recipient`. The AMOUNT is fully server-authoritative; we send no amount.
async function gasDrip4663(recipient){
  try{
    var r=await fetch('api/gas-drip',{ method:'POST',
      headers: Object.assign({'Content-Type':'application/json'}, TOKEN?{'x-vs-token':TOKEN}:{}),
      body: JSON.stringify({ user: recipient }) }).then(function(x){ return x.json(); }).catch(function(){ return null; });
    if(!r || r.error || r.ok!==true) return 'fail';
    if(r.skipped) return 'skipped';   // server read the balance and it already has gas: proceed now
    // A drip tx was sent. Poll the user's native 4663 balance until it reflects the top-up (bounded ~10s).
    var eip=escProvider(); if(!eip) return 'ok';   // sent; if we can't read, trust the server's confirmed tx
    for(var i=0;i<12;i++){
      try{
        var hex=await eip.request({ method:'eth_getBalance', params:[recipient,'latest'] });
        if(BigInt(hex||'0x0') >= 100000000000000n) return 'ok';   // >= 0.0001 native: clears the gas bar
      }catch(e){}
      await new Promise(function(res){ setTimeout(res, 800); });
    }
    return 'ok';   // the server confirmed the tx hash; balance read may just be lagging the node
  }catch(e){ return 'fail'; }
}
/* ---- FEATURE 2: CONVERT-ONCE funding for the auto-play budget ------------------------------------------------
   Fund N games by paying in ANY supported token, converting ONCE up front into RVLT delivered to the USER'S OWN EVM
   wallet on chain 4663 (recipient = the connected EVM account, exactly like the single-buy entry-quote). The amount
   is SERVER-AUTHORITATIVE: /api/relay/fund-quote computes total = entry x maxTicketsPerRound x rounds, subtracts the
   wallet's current RVLT, and sizes the convert = shortfall + a 3-5% price-drift buffer. We never invent the amount.
   - If RVLT already covers the budget (sufficient:true) we convert NOTHING and return (today's path downstream).
   - SOLANA CAVEAT: the RVLT, the allowance and the range signature all live on EVM (4663). A Solana payer needs an
     EVM wallet connected to RECEIVE the RVLT and later approve+sign. If the chosen source is Solana but no EVM
     account is live, we stop with an honest message rather than failing opaquely.
   - Unused RVLT (buffer / early stop) stays in the user's wallet — never auto-pulled beyond the signed/approved bound.
   Returns { funded:bool, recipient } on success; throws a user-facing error otherwise. Nothing on the escrow/approve
   path is touched here; this ONLY pre-funds the wallet with RVLT. */
async function fundAutoplay(rounds, maxTicketsPerRound, src, onStage){
  var stage=onStage||function(){};
  var W=window.EmblemWallet; if(!W||!W.relayDeliver) throw new Error('wallet module not ready');
  // RVLT direct (user already chose to pay with RVLT) needs no conversion — the downstream approve uses what they hold.
  if(!src || src.direct || src.key==='rvlt') return { funded:false, recipient:null };
  // The RVLT recipient / signer MUST be a live EVM account (stake + allowance + range sig all live on 4663).
  var recipient=''; try{ recipient=await captureEvmAddr(); }catch(e){ recipient=''; }
  if(!/^0x[0-9a-fA-F]{40}$/.test(recipient)){
    if(src.origin==='sol'){
      // Honest Solana caveat: SOL can fund the RVLT, but an EVM wallet must hold the stake and sign the authorization.
      var se=new Error('Auto-play needs an EVM wallet to hold your ROBINVAULT and sign. Connect MetaMask, Rabby or Rainbow (Robinhood Chain works best in those; Phantom may fail to simulate), then pick SOL to fund it.');
      se.preflight=true; throw se;
    }
    var ne=new Error('Connect an EVM wallet to auto-play (it holds your ROBINVAULT and signs).'); ne.preflight=true; throw ne;
  }
  try{ adoptAccount('evm', recipient); }catch(e){}
  var eip=escProvider(); if(!eip) throw new Error('No wallet to receive ROBINVAULT');
  // Resolve the origin chain + currency for the chosen source (single source of truth, shared with the single-buy path).
  var _o=await resolveRelayOrigin(src, eip); var originChainId=_o.originChainId, originCurrency=_o.originCurrency, fromUser=_o.fromUser||'';
  // SERVER-AUTHORITATIVE quote for the WHOLE budget. We do NOT compute the convert size client-side.
  stage('Checking your balance…');
  var fq=await fetch('api/relay/fund-quote',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ user:recipient, fromUser:fromUser, fromChainId:originChainId, fromCurrency:originCurrency, rounds:rounds, maxTicketsPerRound:maxTicketsPerRound })})
    .then(function(r){return r.json();}).catch(function(){return null;});
  if(!fq||fq.error){ throw new Error((fq&&fq.error)||'could not price the funding'); }
  if(fq.sufficient){ return { funded:false, recipient:recipient }; }   // RVLT already covers the budget: no convert
  if(!fq.deliverWei || !(Number(fq.deliverWei)>0) || !fq.quote){ throw new Error('could not price the funding'); }
  // Final drift guard: deliver to the live EVM account (re-read) so the RVLT never lands on a switched account.
  await assertBoundWallet(src.origin==='sol'?'sol':src.origin==='btc'?'btc':'evm');
  try{ var _lr=await liveEvmAddr(); if(_lr && _lr.toLowerCase()!==String(recipient).toLowerCase()){ adoptAccount('evm', _lr); var rr=new Error('Your wallet switched accounts, re-open auto-play to continue.'); rr.preflight=true; throw rr; } }catch(e){ if(e&&e.preflight) throw e; }
  // GAS PRE-FLIGHT (before the irreversible convert): the downstream approve is a USER-SIGNED 4663 tx that needs native
  // gas. Verify gas and, if short, deliver a tiny slice from the SAME origin token NOW while it is still held (so this
  // works even if the pay token is the only asset). Runs before the convert; throws a friendly .preflight error if gas
  // can't be secured. Does NOT change the RVLT amount below.
  await ensureRhGasPreflight(src, originChainId, originCurrency, recipient, stage, _primeGasDrip(recipient, maxTicketsPerRound, null));
  var needRvlt=weiToRvlt(fq.deliverWei);
  stage('Converting '+src.label+' to ~'+needRvlt.toLocaleString()+' RVLT…');
  // THE CONVERT (irreversible): delivers RVLT to the user's OWN wallet on 4663. relayDeliver reports its sub-stages.
  await W.relayDeliver(fq.chainId, fq.rvlt, fq.deliverWei, recipient, { origin:src.origin, originChainId:originChainId, originCurrency:originCurrency, fromUser:fromUser, onStage:function(m){ stage(relayStageLabel(m, originChainId, src)); } });
  // Confirmed. The downstream armAutobuy re-reads the on-chain RVLT balance before its EXACT bounded approve.
  return { funded:true, recipient:recipient };
}
// The whole auto-buy ceremony: SIWE -> bounded approve(EXACT) -> fetch params -> sign N typed messages -> POST.
async function armAutobuy(rounds, maxTicketsPerRound, onStage){
  rounds=Math.max(1,Math.min(50,rounds|0)); maxTicketsPerRound=Math.max(1,Math.min(100,maxTicketsPerRound|0));
  var stage=onStage||function(){};
  if(!(ESC.on&&ESC.address&&ESC.rvlt&&ESC.entry)) throw new Error('auto-buy is not enabled yet');
  // FIX-1: ensure wallet connected + on the live escrow chain BEFORE anything, then prove against the LIVE account.
  var eip0=escProvider(); if(!eip0) throw new Error('No wallet. Connect one first.');
  stage('Checking your wallet…');
  await eip0.request({method:'eth_requestAccounts'});
  try{ await ensureNetwork(eip0, ESC.chainId); }catch(e){ throw new Error('Switch your wallet to '+activeNet().label+' to continue.'); }
  stage('Sign in to your wallet…'); await siweProve();
  var signer=await escSigner(); await assertChain(signer);
  // Re-read BOTH the live wallet account and the ethers signer address, and require they match. This is the exact
  // guard against "from should be same as current address": if they diverge (account switched between SIWE and now),
  // we ask the user to re-select rather than firing an approve with a stale `from`. liveAccount() also re-syncs.
  var live=await liveAccount();
  var addr=await signer.getAddress();
  if(addr.toLowerCase()!==live.toLowerCase()){
    throw new Error('Wallet account changed. Re-open auto-play so it uses your selected account ('+shortAddr(live)+').');
  }
  // Pin the signer to the asserted account so every approve/sign carries `from`=addr even if index-0 shifts mid-flow
  // (BrowserProvider.getSigner(addr) binds the exact account, eliminating the "from should be same" divergence).
  try{ var eipP=new ethers.BrowserProvider(escProvider()); signer=await eipP.getSigner(addr); }catch(e){}
  var entryWei=String(ESC.entry);
  var totalWei=autobuyTotalWei(entryWei, maxTicketsPerRound, rounds);
  var rv=new ethers.Contract(ESC.rvlt,RV_ABI,signer);
  // balance sanity: when funded via a convert just before this call, the freshly-delivered RVLT may take a moment to
  // reflect on-chain. Re-read a few times (short backoff) before giving up, so the pay-any-token funding path doesn't
  // false-fail on a RPC that hasn't caught up. Still a hard throw if the balance genuinely never covers the budget.
  try{
    var bal=await rv.balanceOf(addr);
    if(bal<totalWei){
      for(var _bi=0; _bi<4 && bal<totalWei; _bi++){ await new Promise(function(r){ setTimeout(r, 1500); }); try{ bal=await rv.balanceOf(addr); }catch(e){} }
    }
    if(bal<totalWei) throw new Error('not enough RVLT for '+weiToRvlt(totalWei).toLocaleString()+' across '+rounds+' heists');
  }catch(e){ if(/not enough/.test(e.message||'')) throw e; }
  // LAST-RESORT GAS GUARD (before the user-signed approve): the approve is a 4663 tx that needs native gas. The
  // pay-any-token path already topped up gas in fundAutoplay; this also protects the RVLT-DIRECT auto-play (no convert
  // ran, so no gas was delivered). Re-check native 4663 gas; if we can determine the wallet is short, STOP with a clear
  // actionable message instead of letting Phantom show "Failed to simulate / unsafe". Unknown -> stay optimistic.
  var _gas=await has4663Gas(addr);
  if(_gas===false){
    // AUTHORITATIVE DRIP (post-SIWE choke point): the earlier ensureRhGasPreflight drip may have run before sign-in
    // (401) or been skipped on an optimistic unknown, so a gasless wallet still reaches here short. SIWE is already
    // proven above (siweProve at the top of armAutobuy), so re-affirm it (no-op/no-gas signature) to guarantee the
    // TOKEN session is verified for `addr`, then drip. Only throw the manual message if the drip truly fails.
    try{ await ensureSiwe(); }catch(e){}
    stage('Adding a little Robinhood Chain gas…');
    var _d=await gasDrip4663(addr);
    if(_d==='fail'){ var gz=new Error('You need a little Robinhood Chain gas to sign this. Add a little gas, or use MetaMask, Rabby or Rainbow, then try again. Nothing was spent.'); gz.preflight=true; throw gz; }
    // 'ok' (drip landed, balance confirmed) or 'skipped' (server says already funded) -> proceed to the approve.
  }
  // NON-BLOCKING advisory: Phantom on Robinhood Chain can fail to SIMULATE the approve (a wallet limitation). Warn in the
  // stage line but never block — a Phantom user with gas can still proceed.
  try{ if(isPhantomConnected() && Number(ESC.chainId)===4663){ stage('Robinhood Chain works best in MetaMask, Rabby or Rainbow; Phantom may fail to simulate this step.'); } }catch(e){}
  // BOUNDED approval: set the allowance to EXACTLY the authorized total (not unlimited). If an older allowance is
  // higher, overwrite it down to the exact bound; if it already covers the bound, skip the tx.
  var cur=0n; try{ cur=await rv.allowance(addr,ESC.address); }catch(e){}
  if(cur<totalWei){
    stage('Approve exactly '+weiToRvlt(totalWei).toLocaleString()+' RVLT…');
    await (await rv.approve(ESC.address, totalWei)).wait();
  } else if(cur>totalWei){
    // tighten an over-broad existing allowance down to the exact bound (defensive, keeps custody minimal)
    stage('Tightening allowance to '+weiToRvlt(totalWei).toLocaleString()+' RVLT…');
    await (await rv.approve(ESC.address, totalWei)).wait();
  }
  // Fetch signing material (on-chain nonce + domain + consecutive suggested rounds).
  stage('Preparing '+rounds+' heist authorization'+(rounds>1?'s':'')+'…');
  var pr=await api('autobuy/params?address='+addr.toLowerCase()+'&rounds='+rounds);
  if(!pr||pr.error) throw new Error((pr&&pr.error)||'could not load auto-buy params');
  var sug=(pr.suggestedRounds||[]); if(!sug.length) throw new Error('no upcoming heists to authorize yet');
  var use=sug.slice(0,rounds);
  var deadline=Math.floor(Date.now()/1000)+7*24*3600;   // authorization expires in 7 days
  // HARDENING: the signed maxEntry is the FULL per-ticket entry, NEVER a holder-discounted amount. The V4 holder
  // discount is applied ON-CHAIN at buy time (entryPriceFor), so buyInFor pulls <= the discounted price while the
  // signed ceiling stays at full entry. Signing the discount here would make the discount a brittle precondition:
  // if the wallet's NFT status changed before the relayer submits, buyInFor would exceed maxEntry and REVERT. By
  // ceiling at full entry, a holder's discount is pure upside and the authorization can never revert on a status
  // flip. Source of truth = the server's on-chain entryWei (pr.entryWei from autobuy/params), full price for all;
  // we fall back to ESC.entry (also full entry) only if the param read omitted it. We NEVER read PRICING here.
  var fullEntryWei=String((pr&&/^\d+$/.test(String(pr.entryWei||''))?pr.entryWei:entryWei));
  var maxEntryWei=fullEntryWei;                          // per-ticket entry ceiling = FULL on-chain entry (not discounted)
  var maxTicketsWei=String(maxTicketsPerRound);
  // V6 PREFERRED: ONE range signature authorizes ALL `rounds` heists (1 approve + 1 signature, no matter how many
  // games). Falls back to the legacy per-round array only if the server didn't serve range material.
  if(pr.range && pr.range.rangeTypes){
    var rg=pr.range;
    var rvalue={ roundStart:String(rg.roundStart), roundCount:String(rounds), player:addr, maxTickets:maxTicketsWei, maxEntry:maxEntryWei, nonce:String(rg.nonce), deadline:String(deadline) };
    stage('Sign one authorization for '+rounds+' heist'+(rounds>1?'s':'')+'…');
    var rsig=await signer.signTypedData(pr.domain, rg.rangeTypes, rvalue);
    stage('Activating auto-buy…');
    var rout=await api('autobuy',{ token:TOKEN, player:addr.toLowerCase(), maxTickets:maxTicketsPerRound, perRound:maxTicketsPerRound, maxEntry:maxEntryWei, deadline:deadline, roundStart:String(rg.roundStart), roundCount:rounds, nonce:rg.nonce, sig:rsig });
    if(!rout||rout.error) throw new Error((rout&&rout.error)||'could not activate auto-buy');
    return { rounds:rounds, totalWei:totalWei, out:rout };
  }
  // LEGACY fallback: sign one bounded AutoBuy per (roundId, nonce). Fields + order come straight from the server.
  var auths=[];
  for(var k=0;k<use.length;k++){
    var ent=use[k];
    var value={ roundId:String(ent.roundId), player:addr, maxTickets:maxTicketsWei, maxEntry:maxEntryWei, nonce:String(ent.nonce), deadline:String(deadline) };
    stage('Sign authorization '+(k+1)+' of '+use.length+'…');
    var sig=await signer.signTypedData(pr.domain, pr.types, value);
    auths.push({ roundId:String(ent.roundId), nonce:ent.nonce, sig:sig });
  }
  stage('Activating auto-buy…');
  var out=await api('autobuy',{ token:TOKEN, player:addr.toLowerCase(), maxTickets:maxTicketsPerRound, perRound:maxTicketsPerRound, maxEntry:maxEntryWei, deadline:deadline, auths:auths });
  if(!out||out.error) throw new Error((out&&out.error)||'could not activate auto-buy');
  return { rounds:use.length, totalWei:totalWei, out:out };
}
async function cancelAutobuy(){ var out=await api('autobuy/cancel',{}); if(!out||out.error) throw new Error((out&&out.error)||'cancel failed'); return out; }
// Revoke the bounded allowance entirely: approve(escrow, 0). Full off (server auth already cancelled separately).
async function revokeApproval(){ var signer=await escSigner(); await assertChain(signer); var rv=new ethers.Contract(ESC.rvlt,RV_ABI,signer); toast('Revoking allowance…'); await (await rv.approve(ESC.address, 0n)).wait(); return true; }
async function getAutobuy(){ try{ return await api('autobuy'); }catch(e){ return {active:false}; } }
async function getAutoplay(){ try{ return await api('autoplay'); }catch(e){ return {on:false,pre:null}; } }

/* ---- WALK-AWAY PLAN: "deposit once, auto-play the next N heists hands-off" ----------------------------------
   This is a thin ORCHESTRATOR over the two existing primitives, nothing new on the money side:
     1) armAutobuy(N, tickets) -> SIWE, EXACT bounded approve(escrow, N*tickets*entry), sign N AutoBuy auths, POST.
     2) api('autoplay', {on:true, routes:[...]}) -> the relayer plays each of those heists for the player.
   Tying them together just means: arm the buys first, then flip auto-play on with a balanced default strategy so
   the heists it buys are actually played. No escrow / settle / claim code is touched here. The approval stays
   EXACT (never unlimited) because it flows entirely through armAutobuy's bounded approve.
*/
// BALANCED DEFAULT STRATEGY (the "walk away and it just works" picks). The live door count shrinks with the field
// (routesFor: 2..5 doors), so a FIXED door index would (a) often exceed the live door count and (b) herd every
// walk-away player onto the same door. Instead we hand the server all-null `pre`: the server resolves each null to
// a per-player, per-chamber seeded draw (drandInt('default:'+id, routes.length)) which is varied, never-herding,
// and always in-range for whatever door count the chamber has. That IS the sensible balanced default.
function balancedDefaultRoutes(maxChambers){ var n=Math.max(1,Math.min(20,(maxChambers|0)||6)); var r=[]; for(var i=0;i<n;i++) r.push(null); return r; }
// Does the player have a custom (non-empty) auto-play strategy saved? If so we keep it instead of clobbering it.
function hasCustomStrategy(ap){ var pre=ap&&ap.pre; return !!(Array.isArray(pre)&&pre.some(function(x){ return x!=null; })); }
// Arm N bounded auto-buys AND enable auto-play, so the next N heists are entered AND played hands-free.
// keepStrategy: if true and the player already has custom picks, leave them; otherwise apply the balanced default.
async function armWalkAway(rounds, maxTicketsPerRound, maxChambers, keepStrategy, onStage, src){
  var stage=onStage||function(){};
  // 0) FEATURE 2: pay-any-token funding. If a non-RVLT source is chosen AND the wallet is short of the budget, convert
  //    ONCE up front into RVLT delivered to the user's own EVM wallet (server-authoritative amount). RVLT-sufficient or
  //    RVLT-direct = no conversion (today's path). This is purely pre-funding; the bounded approve + range sign below
  //    are unchanged. Relay is mainnet-only, so on testnet the selector isn't shown and src is RVLT/absent (no-op).
  if(src && !src.direct && src.key!=='rvlt'){ try{ await fundAutoplay(rounds, maxTicketsPerRound, src, stage); }catch(e){ throw e; } }
  // 1) the EXACT bounded approval + N signed auto-buy authorizations (unchanged primitive).
  var res=await armAutobuy(rounds, maxTicketsPerRound, stage);
  // 2) turn on auto-play so those heists are actually played. Default = balanced (all-auto) unless keeping a custom one.
  stage('Enabling auto-play for every heist…');
  var routes = keepStrategy ? undefined : balancedDefaultRoutes(maxChambers);
  var body={ token:TOKEN, on:true }; if(routes) body.routes=routes;
  var ap=await api('autoplay', body);
  if(!ap||ap.error) throw new Error((ap&&ap.error)||'could not enable auto-play');
  return { rounds:res.rounds, totalWei:res.totalWei, perRound:maxTicketsPerRound };
}
// ONE-TAP CANCEL the whole plan: stop auto-buy, revoke the bounded allowance to 0, and turn auto-play off.
// Each step is defensive (a later step still runs if an earlier one is a no-op), mirroring the existing controls.
async function cancelWalkAway(onStage){
  var stage=onStage||function(){};
  stage('Stopping auto-buy…');     try{ await cancelAutobuy(); }catch(e){}
  // revoke sets allowance to EXACTLY 0 (approve(escrow,0)); it needs a wallet + chain, so surface its error.
  stage('Revoking allowance…');    await revokeApproval();
  stage('Turning auto-play off…'); try{ await api('autoplay', { token:TOKEN, on:false }); }catch(e){}
  return true;
}
// Is a hands-off plan active right now? (auto-buy armed with rounds left.)
function walkAwayActive(ab){ return !!(ab&&ab.active&&(ab.roundsLeft||0)>0); }

/* ---- RESULTS DIGEST: how the auto-played heists went (entered / won / lost / pot), built CLIENT-SIDE from data
   that already exists: the auto-buy record (which rounds the relayer entered, via GET /api/autobuy nonces[].round
   + the locally-tracked vs_esc_rounds), read against the SAME on-chain views checkWinnings() uses
   (rounds(id).status, winShare(id,addr), settled(id,addr)). No new endpoint, no money logic. Each row carries the
   existing Verify link. Status map (ESC contract): 3 = resolved/payable, 4 = voided/refundable, else in-flight. */
async function autoplayDigest(){
  if(!ESC.on) return { rows:[], note:'Real heists are not live yet.' };
  // round ids the plan actually touched: spent auto-buy nonces (authoritative) unioned with locally tracked rounds.
  var ab=await getAutobuy();
  var ids=[];
  try{ (ab&&ab.nonces||[]).forEach(function(x){ if(x&&x.spent&&x.round!=null) ids.push(String(x.round)); }); }catch(e){}
  try{ var ls=JSON.parse(localStorage.getItem('vs_esc_rounds')||'[]'); ls.forEach(function(id){ if(ids.indexOf(String(id))<0) ids.push(String(id)); }); }catch(e){}
  if(!ids.length) return { rows:[], note:'No auto-played heists yet.', ab:ab };
  var signer,addr;
  try{ signer=await escSigner(); await assertChain(signer); addr=await signer.getAddress(); }
  catch(e){ return { rows:[], note:'Connect your wallet to load results.', ab:ab, needWallet:true }; }
  var esc=new ethers.Contract(ESC.address,ESC_ABI,signer);
  ids=ids.filter(function(id){ return Number(id)>=275; }).slice(-20).reverse();   // LAUNCH BASELINE: hide pre-launch (testing) rounds below the first live round (275)
  // read-only, parallel view calls (free): classify each round for THIS wallet. Mirrors checkWinnings' read phase.
  var rows=await Promise.all(ids.map(async function(id){
    var row={ id:id, kind:'pending', pot:0, share:0, claimed:false };
    try{
      var r=await esc.rounds(id); row.pot=weiToRvlt(r[1]); var status=Number(r[8]);
      try{ row.claimed=await esc.settled(id,addr); }catch(e){}
      if(status===3){ var share=0n; try{ share=await esc.winShare(id,addr); }catch(e){} row.share=weiToRvlt(share); row.kind=(share>0n)?'won':'lost'; }
      else if(status===4){ row.kind='void'; }
      else { row.kind='pending'; }
    }catch(e){ row.kind='pending'; }
    return row;
  }));
  return { rows:rows, ab:ab };
}

    var dr=Math.max(1,Math.min(50,parseInt((localStorage.getItem('vs_ab_rounds')||'3'),10)||3));

    h+='<div id="apMath" style="font-family:var(--font-head);font-size:16px;text-align:center;margin:10px 0 2px;color:var(--ink)"></div>';
    h+='<div class="muted" style="font-size:12px;text-align:center;margin-bottom:8px">'+entryRvlt.toLocaleString()+' RVLT per ticket · exact allowance, never unlimited</div>';
    h+='<button class="btn g" id="apArm" style="width:100%">Review &amp; sign</button>';
    h+='<p class="muted" style="font-size:12px;margin:.6em 0 0">Pulled per heist within your signed limit, revocable anytime.</p>';
  }
  h+='</div>';
  // ---------- AUTO-PLAY ----------
  var n=(s&&s.maxChambers)||6; var pre=(ap&&ap.pre)||((s&&s.me&&s.me.pre)||[]);
  var on=!!(ap&&ap.on);
  h+='<div style="border:2.5px solid var(--ink);border-radius:13px;box-shadow:3px 3px 0 var(--ink);background:var(--bg);padding:12px 13px">';
  h+='<div style="font-family:var(--font-head);font-size:19px">🧭 Auto-ticket strategy '+(on?'<span style="color:var(--grn)">● on</span>':'<span class="muted" style="font-size:13px">off</span>')+'</div>';
  h+='<p class="muted" style="margin:.3em 0 .5em">Set a door per chamber for extra tickets and auto-play, or leave it on random.</p>';
  var rows='';
  for(var c=0;c<n;c++){ var v=(pre&&pre[c]!=null)?pre[c]:''; var opts='<option value="">random</option>'; for(var d=0;d<5;d++) opts+='<option value="'+d+'"'+(v===d?' selected':'')+'>door '+(d+1)+'</option>'; rows+='<label>Ch '+(c+1)+'<select data-apc="'+c+'">'+opts+'</select></label>'; }
  h+='<div class="pre">'+rows+'</div>';

function openAutopilot(){
  var s=LASTS||{};
  openSheet('🤖 Auto-pilot', '<div id="apWrap" class="muted">Loading…</div>', function(o){
    Promise.all([getAutobuy(),getAutoplay()]).then(function(r){
      var ab=r[0]||{active:false}, ap=r[1]||{on:false,pre:null};
      var w=o.querySelector('#apWrap'); if(!w)return; w.className=''; w.innerHTML=autopilotBody(s, ab, ap);
      wireAutopilot(o, s, ab, ap);
    }).catch(function(){ var w=o.querySelector('#apWrap'); if(w)w.textContent='Could not load auto-pilot.'; });

}
function wireAutopilot(o, s, ab, ap){
  var conn=o.querySelector('#apConnect'); if(conn)conn.onclick=function(){ closeSheet(); connectWallet(); };
  var entryWei=(s&&s.escrow&&s.escrow.entry)||ESC.entry||'0';
  // --- auto-buy arm controls + live bounded-approval math ---
  var rn=o.querySelector('#apRn'), tn=o.querySelector('#apTn'), math=o.querySelector('#apMath');
  function rounds(){ return Math.max(1,Math.min(50,parseInt(rn?rn.textContent:'1',10)||1)); }
  function tix(){ return Math.max(1,Math.min(3,parseInt(tn?tn.textContent:'1',10)||1)); }
  function paintMath(){ if(!math)return; var tot=autobuyTotalWei(entryWei, tix(), rounds());
    math.textContent='Authorizing up to '+weiToRvlt(tot).toLocaleString()+' RVLT across '+rounds()+' heist'+(rounds()===1?'':'s');
    try{ localStorage.setItem('vs_ab_rounds',rounds()); localStorage.setItem('vs_ab_tix',tix()); }catch(e){}
  }
  var rm=o.querySelector('#apRm'), rp=o.querySelector('#apRp'), tm=o.querySelector('#apTm'), tp=o.querySelector('#apTp');
  if(rm)rm.onclick=function(){ if(rn)rn.textContent=Math.max(1,rounds()-1); paintMath(); };
  if(rp)rp.onclick=function(){ if(rn)rn.textContent=Math.min(50,rounds()+1); paintMath(); };
  if(tm)tm.onclick=function(){ if(tn)tn.textContent=Math.max(1,tix()-1); paintMath(); };
  if(tp)tp.onclick=function(){ if(tn)tn.textContent=Math.min(3,tix()+1); paintMath(); };
  paintMath();
  var arm=o.querySelector('#apArm');
  if(arm)arm.onclick=function(){
    var R=rounds(), T=tix(), tot=autobuyTotalWei(entryWei, T, R);
    // Explicit pre-sign confirmation: the exact RVLT total + round count, before a single signature.
    var cbody='<p style="font-family:var(--font-head);font-size:18px;margin:.2em 0">Authorizing up to '+weiToRvlt(tot).toLocaleString()+' RVLT across '+R+' heist'+(R===1?'':'s')+'.</p>'+
      '<p class="muted" style="margin:.2em 0 .6em">Up to '+T+' ticket'+(T===1?'':'s')+'/heist at '+weiToRvlt(entryWei).toLocaleString()+' RVLT each, exact allowance never unlimited, pulled per heist and revocable anytime.</p>'+
      '<div id="apStage" class="muted" style="font-size:13px;min-height:18px;margin:.3em 0"></div>'+
      '<button class="btn g" id="apGo" style="width:100%">Approve &amp; sign '+R+' heist'+(R===1?'':'s')+'</button>';
    openSheet('🔐 Confirm auto-buy', cbody, function(o2){
      var go=o2.querySelector('#apGo'), st=o2.querySelector('#apStage');
      function stage(m){ if(st)st.textContent=m; }
      go.onclick=function(){ go.disabled=true;
        armAutobuy(R, T, stage).then(function(res){ closeSheet(); toast('🤖 Auto-buy armed for '+res.rounds+' heist'+(res.rounds===1?'':'s')); poll(); })
        .catch(function(e){ stage(''); try{go.disabled=false;}catch(_){ } toast((e&&(e.shortMessage||e.message))||'auto-buy failed'); });
      };
    });
  };
  // --- active controls ---
  var cancel=o.querySelector('#apCancel');
  if(cancel)cancel.onclick=function(){ cancel.disabled=true; cancelAutobuy().then(function(){ toast('Auto-buy stopped'); openAutopilot(); }).catch(function(e){ try{cancel.disabled=false;}catch(_){ } toast((e&&e.message)||'stop failed'); }); };
  var revoke=o.querySelector('#apRevoke');
  if(revoke)revoke.onclick=function(){ revoke.disabled=true; revokeApproval().then(function(){ return cancelAutobuy().catch(function(){}); }).then(function(){ toast('Allowance revoked'); openAutopilot(); }).catch(function(e){ try{revoke.disabled=false;}catch(_){ } toast((e&&(e.shortMessage||e.message))||'revoke failed'); }); };
  // --- auto-play strategy ---
  function collectRoutes(){ var routes=[]; o.querySelectorAll('select[data-apc]').forEach(function(sel){ var c=+sel.getAttribute('data-apc'); routes[c]=sel.value===''?null:+sel.value; }); return routes; }
  var save=o.querySelector('#apPlaySave');
  if(save)save.onclick=function(){ api('autoplay',{ token:TOKEN, on:true, routes:collectRoutes() }).then(function(r){ var m=o.querySelector('#apPlayMsg'); if(m)m.textContent='saved ✓'; if(r&&!r.error){ ap.on=true; ap.pre=r.pre; } openAutopilot(); }).catch(function(){ toast('could not save'); }); };
  var off=o.querySelector('#apPlayOff');
  if(off)off.onclick=function(){ api('autoplay',{ token:TOKEN, on:false }).then(function(){ toast('Auto-play off'); openAutopilot(); }).catch(function(){ toast('could not turn off'); }); };
}

/* ---- WALK-AWAY SHEET: the single "deposit once, auto-play the next N heists" flow. When no plan is active it
   shows the N-heists + tickets steppers, the plain deposit math (RVLT and, on mainnet, the $ equivalent), the
   EXACT/bounded-approval note, and one confirm that arms the bounded auto-buy AND enables balanced auto-play.
   When a plan IS active it shows the plain "you're auto-playing the next N heists" summary, the results digest
   (entered / won / lost / pot, each with its Verify link), and the ONE-TAP cancel that stops everything. ---- */
// $ equivalent for a RVLT amount, shown only where USD pricing is meaningful (mainnet / Relay). Testnet -> ''.
function walkUsd(rvlt){ if(!relayAvailable()) return ''; try{ return ' (about $'+(ENTRY_USD*(rvlt/weiToRvlt(ESC.entry||'1'))).toFixed(0)+')'; }catch(e){ return ''; } }
function openWalkAway(){
  var s=LASTS||{};
  openSheet('🤖 Auto-play heists', '<div id="waWrap" class="muted">Loading…</div>', function(o){
    getAutobuy().then(function(ab){

// SETUP state: pick N + tickets, see the exact deposit, confirm -> armWalkAway (bounded approve + sign + autoplay).
function renderWalkSetup(o, s){
  var w=o.querySelector('#waWrap'); if(!w) return;
  var wc=(TOKEN&&TOKEN.indexOf('w:')===0);
  var escOn=ESC.on&&s&&s.escrow&&s.escrow.on;
  var entryWei=(s&&s.escrow&&s.escrow.entry)||ESC.entry||'0';
  var entryRvlt=weiToRvlt(entryWei);
  var maxch=(s&&s.maxChambers)||6;
  if(!wc){ w.innerHTML='<p class="muted">Connect a wallet to auto-play heists while you are away.</p><button class="btn p" id="waConnect" style="width:100%">🔗 Connect wallet</button>'; var cc=o.querySelector('#waConnect'); if(cc)cc.onclick=function(){ closeSheet(); connectWallet(); }; return; }
  if(!escOn){ w.innerHTML='<p class="muted">Auto-play opens when on-chain heists go live.</p>'; return; }
  // PER-WALLET CAP (same ceiling the single-buy modal enforces): the first auto-played round IS the current buy-round, so
  // its buyInForRange must not push this wallet past the per-wallet cap or the on-chain buyIn reverts. Cap the "Tickets
  // each" max at walletCap minus the tickets this wallet ALREADY holds in the current buy-round (state.me.tickets),
  // floored at 1 so there is always at least one selectable. walletCap comes from state (econ.walletCap or escrow
  // maxTickets); we never hardcode when state provides it (falls back to 3 only if state is silent).
  var walletCap=null;
  try{ walletCap=(s&&s.econ&&s.econ.walletCap!=null)?(s.econ.walletCap|0):((s&&s.escrow&&s.escrow.maxTickets!=null)?(s.escrow.maxTickets|0):null); }catch(e){ walletCap=null; }
  var capN=(walletCap!=null&&walletCap>0)?walletCap:3;
  var heldNow=0; try{ heldNow=(s&&s.me&&s.me.tickets!=null)?Math.max(0,s.me.tickets|0):0; }catch(e){ heldNow=0; }
  var tixMax=Math.max(1, capN-heldNow);   // most tickets the FIRST covered round can take without a cap revert
  var dr=Math.max(1,Math.min(50,parseInt((localStorage.getItem('vs_ab_rounds')||'20'),10)||20));
  var dt=Math.max(1,Math.min(tixMax,parseInt((localStorage.getItem('vs_ab_tix')||'1'),10)||1));
  // SIMPLE, like the buy-in: the two steppers + a "pay with" token selector + one deposit total + confirm.
  var h='';
  h+='<div class="tixrow" style="justify-content:space-between"><span>Heists</span><span><button class="btn" id="waRm">-</button> <span class="txn" id="waRn">'+dr+'</span> <button class="btn" id="waRp">+</button></span></div>';
  h+='<div class="tixrow" style="justify-content:space-between;margin-top:6px"><span>Tickets each</span><span><button class="btn" id="waTm">-</button> <span class="txn" id="waTn">'+dt+'</span> <button class="btn" id="waTp">+</button></span></div>';
  h+='<div class="muted" style="font-size:12px;text-align:right;margin-top:3px">per heist, up to '+tixMax+(heldNow>0?(' (you hold '+heldNow+' this heist)'):'')+'</div>';
  // FEATURE 2: pay-with selector (reuses the single-buy pay grid: fetchHeldPay / PAY_SRCS / payChipHTML). Mainnet only
  // (payRow() returns '' on testnet, where RVLT-direct is the only route). The chosen token funds the WHOLE budget in
  // one convert; if the wallet already holds enough RVLT the convert is skipped.
  var payHtml=payRow();
  if(payHtml) h+='<div style="margin-top:12px">'+payHtml+'</div>';
  h+='<div id="waMath" style="font-family:var(--font-head);font-size:17px;text-align:center;margin:14px 0 12px;color:var(--ink)"></div>';
  // Honest unavailability line (set if the on-chain relayer slot is a known mismatch -> auto-buy can never land).
  h+='<div id="waUnavail" class="muted" style="font-size:12px;text-align:center;margin:-6px 0 10px;color:var(--red,#c0392b);display:none"></div>';
  h+='<button class="btn g" id="waGo" style="width:100%">Review &amp; confirm</button>';
  w.innerHTML=h;
  // Render the held-balance pay chips into the selector (mainnet only); throttled + feasibility-gated server-side.
  if(payHtml){ try{ vsRefreshPayGrid('#waWrap', null, true); }catch(e){} try{ prewarm4663Gas(); }catch(e){} }
  // HONEST CTA GATE: check whether auto-buy is actually available (the on-chain relayer slot is our key). If the server
  // reports autoBuyAvailable:false with relayerSlotOk:false, disable the confirm with a clear message instead of letting
  // the user approve + sign into a path that can never land. A null slot (not proven) stays enabled (optimistic).
  (function(){ try{ api('autobuy/params?rounds=1').then(function(pr){
    if(pr && pr.autoBuyAvailable===false && pr.relayerSlotOk===false){
      var un=o.querySelector('#waUnavail'), g=o.querySelector('#waGo');
      if(un){ un.style.display='block'; un.textContent='Auto-play is temporarily unavailable. Nothing has been spent.'; }
      if(g){ g.setAttribute('disabled','disabled'); g.classList.add('locked'); }
    }
  }).catch(function(){}); }catch(e){} })();
  var rn=o.querySelector('#waRn'), tn=o.querySelector('#waTn'), math=o.querySelector('#waMath');
  function rounds(){ return Math.max(1,Math.min(50,parseInt(rn?rn.textContent:'1',10)||1)); }
  function tix(){ return Math.max(1,Math.min(tixMax,parseInt(tn?tn.textContent:'1',10)||1)); }
  function selectedSrc(){ return PAY_SRCS.filter(function(o){return o.key===PAYSRC;})[0]||PAY_SRCS[0]; }
  function paint(){ if(!math)return; var totUsd=perTicketUsdEff()*tix()*rounds();
    math.textContent='Deposit up to $'+totUsd;

// Normalize the fill object across server shapes. Old shape: {state:'filling'|'armed', seats, cap, threshold, fuseIn}.
// New "rmfill" shape: {state:'filling'|'locking'|'playing'|'ended', seats, ticketsSold, threshold, target, cap, graceIn}
// plus econ:{entryUsd, roundTarget, walletCap}. We fold both into one record the UI can read without branching.
function fillInfo(s){
  var f=s.fill; if(!f) return null;
  var e=s.econ||{};
  // progress numerator/denominator: prefer tickets sold toward the round target, fall back to seats/cap.
  var sold = (f.ticketsSold!=null)?f.ticketsSold : (f.seats!=null?f.seats:0);
  var target = (f.target!=null)?f.target : (f.cap!=null?f.cap:0);
  var thr = (f.threshold!=null)?f.threshold : 0;
  var cap = (f.cap!=null)?f.cap : target;
  // "locking" is the fuse-lit signal. The rmfill engine keeps state==='filling' the WHOLE time and signals the lit
  // fuse ONLY via a positive graceIn (ms remaining to seal) with graceEndsAtMs still null, so gating `locking` on
  // state alone left every fuse-lit UI (the in-header "starts in m:ss" countdown, the big launch countdown, the FUSE
  // LIT label, the green/pulse meter) dead. Treat an active grace/fuse window as locking too, keeping the old state
  // conditions for the fake-fill engine (PLOBBY) which does set state='locking'/'armed'.
  var grace = (f.graceIn!=null)?f.graceIn : (f.fuseIn!=null?f.fuseIn:null);
  var locking = (grace!=null && grace>0) || (f.state==='locking' || f.state==='armed');
  var lob=f.lobby||{};
  var vel=lob.velocity||{};
  var odds=lob.odds||{};
  return {
    state:f.state, locking:locking, seats:(f.seats!=null?f.seats:sold), sold:sold, target:target, threshold:thr, cap:cap,
    grace:grace, pct:(target>0?Math.min(100,Math.round(sold/target*100)):0),
    thrPct:(target>0?Math.min(100,Math.round(thr/target*100)):0),
    entryUsd:(e.entryUsd!=null?e.entryUsd:null), roundTarget:(e.roundTarget!=null?e.roundTarget:null),
    walletCap:(e.walletCap!=null?e.walletCap:null),
    // LIVE LOBBY (read-only, server-derived): seats to arm, fill velocity, rough odds/EV, dynamic-grace window.
    toThreshold:(lob.seatsToThreshold!=null?lob.seatsToThreshold:Math.max(0,thr-sold)),
    rate:(vel.rate!=null?vel.rate:0), fast:!!vel.fast,
    winChance:(odds.winChance!=null?odds.winChance:null), myWinChance:(odds.myWinChance!=null?odds.myWinChance:null),
    myTickets:(odds.myTickets!=null?odds.myTickets:0), potAfterRake:(odds.potAfterRake!=null?odds.potAfterRake:null),
    graceMax:(f.graceMax!=null?f.graceMax:null), graceNow:(f.graceNow!=null?f.graceNow:null),

// renders for the next heist. Returns null only when neither is buyable (the caller then shows the forming guard).
// `_next:true` flags the synthetic next-round shape so the module copy can say "buys the next heist".

/* ---- 1 BIG LAUNCH COUNTDOWN ----------------------------------------------------------------------------------

   smoothly every second even when server snapshots are >1s apart. graceAnchorUpdate() runs from render() on every
   FRESH snapshot (never from our own self-tick repaint); launchGraceLeftMs() reads the interpolated ms remaining;
   launchCountdownHTML() renders the big dial. All read-only off fillInfo (grace/locking already in the payload). */
function graceAnchorUpdate(s){
  try{

    if(!f || !f.locking || f.grace==null){ _graceAnchor=null; return; }
    if(_graceSelfTick) return;                 // our own 1s repaint must not re-anchor (keeps interpolation drift-free)
    var rid=(s.roundId!=null?String(s.roundId):'r');

    // the countdown is server-authoritative, not interpolated off graceIn. Fall back to now+grace for older payloads.
    var absEnd=(s&&s.fill&&s.fill.graceEndsAtMs!=null)?Number(s.fill.graceEndsAtMs):null;

// per-wallet ticket cap (defaults to 5 if the server doesn't send one).
function ticketCap(f){ return (f && f.walletCap!=null) ? Math.max(1,f.walletCap) : 5; }
// FIX B/C: tickets this wallet can STILL buy this heist = cap minus what it already owns (f.myTickets). The stepper,
// the + button and the Buy button must clamp to THIS, not the raw cap, so a buyer who already holds some tickets
// can't click up to a count that reverts on-chain (wallet cap exceeded). Never negative.
function ticketRemaining(f){ var cap=ticketCap(f); var owned=(f&&f.myTickets!=null)?Math.max(0,f.myTickets|0):0; return Math.max(0, cap-owned); }
// FIX (round capacity): seats still open in the live round = target - sold (never negative). Buying past this would
// overfill the round target and invite a failed/phantom on-chain buy (the server preflight already refuses round_full /
// the seat margin; this is the matching client guardrail so the user can't even SELECT more than can fit).
function seatsLeftOf(f){ var target=(f&&f.target!=null)?Math.max(0,f.target|0):0; var sold=(f&&f.sold!=null)?Math.max(0,f.sold|0):0; return target>0?Math.max(0,target-sold):Infinity; }

// seat (target - sold). At 9/10 with 0 owned: min(3,1)=1. Returns {max, limiter} where limiter names the binding
// constraint ('seats' | 'cap' | 'full') so the copy can be honest about WHY. seatsLeft Infinity (no target) -> cap wins.
function ticketBuyable(f){
  var rem=ticketRemaining(f);              // cap - owned
  var seats=seatsLeftOf(f);                // target - sold (Infinity if no target)
  if(seats<=0) return { max:0, limiter:'full' };
  if(seats<rem) return { max:seats, limiter:'seats' };
  return { max:rem, limiter:'cap' };
}

/* ---- LIVE NAMED CREW (client-only, anti-edge) --------------------------------------------------------------
