   per-viewer sources already in the payload are: s.me (you), s.chat[] (real humans who taunted / bought in, each
   with a stable aid + optional avatar override), and ot.finalists (overtime). We derive a de-duped "who is here"
   cluster from those so the room shows WHO is in it (name + avatar) WITHOUT ever revealing anyone's door pick or a
   per-door crowd count. Position is cosmetic; nothing here is door-derived. A true live alive-roster with names is a
   SERVER FOLLOW-UP (buildStatePayload would need to emit {name, aid, av} per alive seat for the choose phase). */
function liveCrewFrom(s,cap){

/* ---- post-breach crowd DISTRIBUTION bars (legibility) -------------------------------------------------------
   Shows, AFTER the breach, how the crowd split across the doors so a player can see WHY they lost ("North Wing
   was packed, busted"). Fed by the reveal-only `revealCounts` the server emits (and the practice sim's local
   tally); it is NEVER rendered during choose/blind because those payloads carry no counts. `names` may be real
   route labels (normal) or null (OT, which uses Door N). `bustIdx` marks the busted door. */
function distribBarsHTML(names,counts,bustIdx,doorsN){
  counts=counts||[]; var n=doorsN||counts.length||(names?names.length:0); if(!n)return '';
  var max=1; for(var i=0;i<n;i++){ var v=counts[i]||0; if(v>max)max=v; }
  var rows='';
  for(var j=0;j<n;j++){
    var c=counts[j]||0, bust=(j===bustIdx), pct=Math.round((c/max)*100);
    var label=names&&names[j]?esc(names[j]):('Door '+(j+1));
    rows+='<div class="drow'+(bust?' bust':'')+'">'+
      '<div class="dnm">'+(bust?'🚨 ':'')+label+'</div>'+
      '<div class="dtrk"><div class="dfill" style="width:'+pct+'%"></div></div>'+
      '<div class="dct">'+c+(bust?' out':'')+'</div></div>';
  }
  var bn=(names&&names[bustIdx])?names[bustIdx]:('Door '+((bustIdx||0)+1));
  var note='<div class="bustnote">'+esc(bn)+' was the most crowded, so it got busted. Pick the quiet door next time.</div>';
  return '<div class="distrib"><div class="dttl">📊 Where the crowd ran</div>'+rows+note+'</div>';
}
/* ---- 3 BREACH STAGE: the breach catches the crowd (reveal-only, anti-edge) ----------------------------------
   The reveal payload carries the AGGREGATE caught/survived counts (reveal.busted / reveal.survived) but NO per-player
   identities, so this animates ANONYMOUS bodies sized to those real counts: the caught group shakes + drops (the
   busted door catching them), the survivors slip through. YOU appear as the gold body in the group matching your fate
   (busted if your pick == the busted door). This is a moment, not a bar. Per-player reveal identities (who exactly was
   caught) would need a new server field and are a SERVER FOLLOW-UP. Counts-only keeps the anti-agent guarantee. */
function breachStageHTML(caught,survived,meCaught,meInRound,players,myAid){
  caught=Math.max(0,caught||0); survived=Math.max(0,survived||0);
  // NAMED BREACH (reveal-only): when the server sends the per-player outcome (reveal.players) we show the REAL caught
  // crowd and REAL survivors by name, with YOU highlighted, instead of anonymous bodies. Anti-edge-safe: picks are
  // locked before reveal, so door identity leaks nothing. Falls back to the anonymous count bodies if the list is absent.
  if(Array.isArray(players) && players.length){
    var capN=16;
    // DEDUPE BY WALLET (cleanup): reveal.players carries one entry per TICKET, so a multi-ticket wallet (and the
    // viewer's own stack) would render a near-duplicate chip per ticket, a scattered pile. Collapse to ONE chip per
    // distinct wallet (keyed on aid, falling back to name), carrying an xN count when that wallet held several
    // tickets. The viewer collapses to a SINGLE "You" chip ("You xN" for a stack) placed in the group matching the
    // viewer's PRIMARY fate (alive -> slipped, caught -> caught), never duplicated across both groups.
    var myTotal=0, myCaughtAny=false, myAv=null;
    for(var m0=0;m0<players.length;m0++){ if(myAid&&players[m0].aid===myAid){ myTotal++; if(players[m0].caught) myCaughtAny=true; if(players[m0].av!=null) myAv=players[m0].av; } }
    // the viewer's shown side: their actual fate this chamber (me.alive wins; fall back to whether every ticket was caught).
    var meSafeSide = meInRound ? (!meCaught) : (myTotal>0 ? !(myCaughtAny && myTotal===1) : false);
    function dedupe(list){
      var map={}, order=[];
      for(var i=0;i<list.length;i++){ var p=list[i]||{}; if(myAid&&p.aid===myAid) continue;   // viewer handled separately (one chip, correct group)
        var key=(p.aid!=null&&p.aid!=='')?('a:'+p.aid):('n:'+(p.name||('t'+i)));
        if(!map[key]){ map[key]={ aid:p.aid, name:p.name, av:p.av, n:0 }; order.push(key); }
        map[key].n++; }
      return order.map(function(k){ return map[k]; });
    }
    function namedBodies(list,cls,injectMe){
      var dl=dedupe(list);
      // the single "You" chip (if the viewer belongs on this side) leads so its highlight is never clipped by the cap.
      if(injectMe && myTotal>0){ dl.unshift({ aid:myAid, name:'You', av:myAv, n:myTotal, me:true }); }
      var h='', shown=Math.min(dl.length,capN);
      for(var i=0;i<shown;i++){ var p=dl[i]; var isMe=!!p.me; var d=(i%6)*0.05;
        var nm=isMe?'You':esc(p.name||'Robber'); var xN=(p.n>1)?(' x'+p.n):'';
        h+='<span class="bb '+cls+(isMe?' me':'')+'" style="animation-delay:'+d.toFixed(2)+'s" title="'+(isMe?'you':esc(p.name||''))+'">'+avatar(p.aid,'',p.av)+'<span class="bbnm">'+nm+xN+'</span></span>'; }
      if(dl.length>shown) h+='<span class="more" style="font-size:12px;opacity:.65;align-self:center">+'+(dl.length-shown)+' more</span>';
      return h;
    }
    var caughtL=[], safeL=[];
    for(var j=0;j<players.length;j++){ (players[j].caught?caughtL:safeL).push(players[j]); }
    // Counts stay TICKET-accurate (the server aggregate), while chips are per-wallet, so the labels never disagree.
    var cCount=(caught||caughtL.length), sCount=(survived||safeL.length);
    // inject the single "You" chip into exactly ONE group (the viewer's primary fate), so it never appears twice.
    var caughtBlock2='<div class="bgroup caught named"><div class="bglbl">🚨 '+cCount+' caught</div><div class="bbodies named">'+namedBodies(caughtL,'c',(myTotal>0 && !meSafeSide))+'</div></div>';
    var safeBlock2=(safeL.length>0||sCount>0||(myTotal>0&&meSafeSide))?'<div class="bgroup safe named"><div class="bglbl">✓ '+sCount+' slip through</div><div class="bbodies named">'+namedBodies(safeL,'s',(myTotal>0 && meSafeSide))+'</div></div>':'';
    return '<div class="breachstage named">'+caughtBlock2+safeBlock2+'</div>';
  }
  var capC=Math.min(caught,18), capS=Math.min(survived,18);
  function bodies(n,cls,extra,meHere){
    var h='';
    for(var i=0;i<n;i++){ var isMe=(meHere&&i===0); var d=(i%6)*0.05; h+='<span class="bb '+cls+(isMe?' me':'')+'" style="animation-delay:'+d.toFixed(2)+'s">'+(isMe?'🫵':'')+'</span>'; }
    if(extra>0) h+='<span class="more" style="font-size:12px;opacity:.65;align-self:center">+'+extra+'</span>';
    return h;
  }
  var caughtBlock='<div class="bgroup caught"><div class="bglbl">🚨 '+caught+' caught</div><div class="bbodies">'+bodies(capC,'c',caught-capC,(meInRound&&meCaught))+'</div></div>';
  var safeBlock=(survived>0)?'<div class="bgroup safe"><div class="bglbl">✓ '+survived+' slip through</div><div class="bbodies">'+bodies(capS,'s',survived-capS,(meInRound&&!meCaught))+'</div></div>':'';
  return '<div class="breachstage">'+caughtBlock+safeBlock+'</div>';
}
/* ---- 3 REVEAL DRAMA: ONE consolidated outcome block (verdict + a single tidy stat row) ----------------------
   Reads only POST-DECISION reveal data (reveal.bust/busted/survived + pot) and the player's OWN locked pick, so it
   leaks nothing about the choose phase. Lead line is the bold personal verdict ("Busted" / "You slipped through,
   N left"), with an honest near-miss note only when the viewer survived AND their door sat immediately beside the
   busted one. Below it, a SINGLE centered stat row folds pot + caught + slipped + the viewer's odds into one clean
   line, replacing the old scattered odds chips so the middle of the screen reads tidy, not like a pile. */
function outcomeBlockHTML(s){
  var me=s&&s.me, rv=s&&s.reveal; if(!me||!rv) return '';
  if(!me.inGame) return '';                             // only a seated player gets the personal outcome block
  var bust=rv.bust, survived=(rv.survived||0), caught=rv.busted||0;
  var meCaught=(me.pick!=null && me.pick===bust);
  var alive=!!me.alive && !meCaught;
  var verdict;
  if(me.pick==null){
    verdict='';                                         // no locked pick -> no personal verdict line (stats still show)
  } else if(meCaught){
    verdict='<div class="ov-verdict caught">Busted<span class="nearmiss">'+esc((s.routes&&s.routes[bust])||('Door '+((bust||0)+1)))+' was packed, and you were on it.</span></div>';
  } else {
    var n=(s.routes||[]).length||0;
    var adjacent=(n>1 && bust!=null && (me.pick===bust-1 || me.pick===bust+1));
    var near=adjacent?'<span class="nearmiss">One door over from the breach. Close.</span>':'';
    var left0=(survived>0?survived:s.alive||0);
    verdict='<div class="ov-verdict safe">You slipped through, '+left0+' left'+near+'</div>';
  }
  // ONE tidy stat row: pot, caught, slipped, and (for a still-alive viewer) the updated odds among survivors.
  var left=(survived>0?survived:(s.alive||0)); if(left<=0) left=1;
  var odds = left<=1 ? 'last one standing' : ('your shot 1 in '+left);
  var oddsChip = alive ? '<span class="ov-chip odds">'+left+' left · '+odds+'</span>' : '';
  var stats='<div class="ov-stats">'
    +'<span class="ov-chip pot">💰 '+fmtK(s.pot||0)+' RVLT</span>'
    +'<span class="ov-chip caught">🚨 '+caught+' caught</span>'
    +'<span class="ov-chip safe">✓ '+survived+' slipped</span>'
    +oddsChip
    +'</div>';
  return '<div class="outcome">'+verdict+stats+'</div>';
}
/* BUSTED SUMMARY (2026-10-17): one clean, centered end-of-round card for the busted/out viewer (me.inGame && !me.alive).
   Replaces the old half-rendered play view (leftover door grid + "Busted" header + chat crammed underneath). It shows a
   bold "Busted", one condensed stat line (reached chamber X, N robbers still inside, your N tickets), and optionally the
   door that caught you, then a single "Back to chat" control that drops the player into the full-size live chat (they
   are in the next round, so the chat/lobby is the right place to land). Reduced-motion safe, no leftover live door grid. */
function bustedSummaryHTML(s){
  var me=s.me||{};
  var ch=((s.chamber||0)+1);
  var inside=(s.alive||0);
  var tix=(me.tickets||1);
  // which door caught you: only when we actually have a reveal with a busted door and the player's locked pick sat on it
  var caughtDoor=null;
  if(s.reveal && s.reveal.bust!=null && me.pick!=null && me.pick===s.reveal.bust){
    caughtDoor=(s.routes&&s.routes[s.reveal.bust])||('Door '+((s.reveal.bust||0)+1));
  }
  var stat='reached chamber '+ch+' · '+inside+' robber'+(inside===1?'':'s')+' still inside · your '+tix+' ticket'+(tix===1?'':'s');
  var caughtLine=caughtDoor?('<div class="bust-caught">'+esc(caughtDoor)+' was packed, and you were on it.</div>'):'';
  return '<div class="bustcard">'
    +'<div class="bust-h">Busted</div>'
    +'<div class="bust-stat">'+esc(stat)+'</div>'
    +caughtLine
    +'<button class="btn" id="bustchat">Back to chat</button>'
    +'<p class="muted" style="margin:.5em 0 0;font-size:12px">You are already in the next heist.</p>'
    +'</div>';
}
/* optimistic instant selection, no waiting for the 1s poll.
   PICK-REVERT FIX (2026-10-17): LOCALPICK is the single source of truth for "the door I just clicked" and it holds the
   LATEST clicked door until the SERVER CONFIRMS that exact door (me.pick===LOCALPICK.i) or the chamber/phase/blind
   changes — there is NO time-based expiry, so a slow or re-sent pick can never revert mid-choose (including after a
   tab blur/return). `sent` tracks whether the current door's pick request is in flight / delivered so a resync can
   re-send the FINAL pick if the server hasn't caught up, without spamming the 5-per-10s rate limit. */
function pickDoor(i){
  LOCALPICK={i:i,ts:Date.now(),sent:false,confirmed:false};
  document.querySelectorAll('.door[data-r]').forEach(function(d){
    var on=(+d.getAttribute('data-r')===i); d.classList.toggle('pick',on);
    // keep the label in sync with the optimistic class so a changed pick never leaves a stale "your pick" on the old
    // door (the stable in-place reconciler only touches labels when the class disagrees, which it won't after this).
    var lb=d.querySelector('.lbl'); if(lb) lb.textContent=on?'your pick':'open';
    var pit=d.querySelector('.pit'), you=pit&&pit.querySelector('.m.you');
    if(on){ if(!you){ var e=document.createElement('span'); e.className='m you'; pit.appendChild(e); } }
    else if(you){ you.remove(); }
  });
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  sendPick(i);
}
// Deliver a pick to the server. Factored out of pickDoor so a visibility-return / resync can RE-SEND the latest
// LOCALPICK if the server has not yet confirmed it (the final pick before lock must always land). Every call sends
// api('pick',route) with the clicked route — no debounce ever skips a 2nd/3rd change; the only guard is the resync
// re-send throttle (_lastPickResend), which never blocks a fresh user click (pickDoor calls this directly).
// A door click is the strongest "I am here, I am playing" signal, so it MUST prove control first. The server resolves
// the acting seat via primarySeatForViewer, which only matches a SIWE-VERIFIED session for the seat-holding address.
// After a wallet switch/reconnect VERIFIED resets, so a bare api('pick') would silently fail ('cannot pick') and the
// player would keep being auto-played. So: ensure SIWE for the CURRENT connected wallet (one signature if needed),
// THEN pick. On a real failure we surface the actual reason and flip the ready control back to an actionable state
// instead of pretending the pick landed. The on-chain seat gate (ticketsOf>0) is unchanged.
function sendPick(i){
  if(LOCALPICK) LOCALPICK.sent=true;
  // A failed pick must NEVER contradict an already-in player. If the viewer is checked in and already has a confirmed
  // pick, we reconcile a transient 'cannot pick' (a lapsed SIWE session) by silently re-proving SIWE and re-sending,
  // WITHOUT any "take control" / "sign in to play" wording and WITHOUT flipping the ready button out of its "you're in"
  // state. We only surface a genuine sign-in prompt when the viewer is not yet in AND the silent re-prove truly fails.
  var meNow=(LASTS&&LASTS.me)||{};
  var alreadyIn=!!(meNow.checkedIn && meNow.pick!=null);
  // retry=true marks the one silent re-send after a lapsed-session re-prove, so we never loop on it.
  var send=function(retry){ return api('pick',{token:TOKEN,route:i}).then(function(r){
    if(r&&r.ok){ poll(); return; }
    // the pick did NOT register server-side: allow a resync re-send and keep the door actionable (re-pick re-tries SIWE).
    if(LOCALPICK && LOCALPICK.i===i) LOCALPICK.sent=false;
    var why=(r&&r.error)||'could not lock your door';
    if(why==='cannot pick'){
      // SIWE lapsed server-side. Re-prove once, silently, and re-send the same pick. This keeps an already-in player's
      // "you're in / your pick / YOU ARE HERE" true instead of flashing a contradictory "sign in to take control".
      if(!retry){
        // one-time, truthful note during the actual re-sign (not a standing "take control" prompt).
        if(typeof isVerified==='function' && !isVerified()) toast('Signing you in to lock your pick…');
        ensureSiwe().then(function(ok){ if(ok){ send(true); }
          else if(!alreadyIn){ toast('Sign in with your wallet to pick'); markReadyActionable(); }
          // alreadyIn + couldn't re-prove: stay quiet; the resync safety net retries and the existing pick still stands.
        }).catch(function(){ if(!alreadyIn){ toast('Sign in with your wallet to pick'); markReadyActionable(); } });
        return;
      }
      // the silent re-prove happened and the re-send still failed: only prompt a not-yet-in player.
      if(!alreadyIn){ toast('Sign in with your wallet to pick'); markReadyActionable(); }
    }
    else { toast(why); if(!alreadyIn) markReadyActionable(); }
  }).catch(function(){ if(LOCALPICK && LOCALPICK.i===i) LOCALPICK.sent=false; toast('Network hiccup, tap your door again'); if(!alreadyIn) markReadyActionable(); }); };
  if(typeof isVerified==='function' && !isVerified()){
    try{ ensureSiwe().then(function(ok){ if(ok){ send(false); } else { if(LOCALPICK && LOCALPICK.i===i) LOCALPICK.sent=false; if(!alreadyIn){ toast('Sign in with your wallet to pick'); markReadyActionable(); } } }).catch(function(){ if(LOCALPICK && LOCALPICK.i===i) LOCALPICK.sent=false; if(!alreadyIn){ toast('Sign in with your wallet to pick'); markReadyActionable(); } }); }
    catch(e){ send(false); }
  } else { send(false); }
}
// Resync safety net: if LOCALPICK shows the player picked a door but the server state still disagrees (me.pick !==
// LOCALPICK.i) during an active choose phase, re-deliver the latest pick so the FINAL choice before lock always lands
// even if an earlier request was dropped (e.g. a rapid change spree brushing the 5-per-10s rate limit, or a request
// lost across a tab blur). Throttled to at most once per ~2.5s so the resend itself never trips the rate limit.
var _lastPickResend=0;
function resyncPick(s){
  try{
    if(!LOCALPICK) return;
    var me=s&&s.me; if(!me) return;
    if(s.phase!=='choose' || s.blind) return;           // only while picks are open (blind/reveal are frozen)
    if(me.pick===LOCALPICK.i){ return; }                 // server already agrees; the render path clears LOCALPICK
    var now=Date.now();
    if(now-_lastPickResend < 2500) return;               // rate-limit-safe throttle
    _lastPickResend=now;
    sendPick(LOCALPICK.i);
  }catch(e){}
}

/* ---- schedule strip (the routine at a glance) ---- */
function stripHTML(s){

  if(inFill(s)) return '';

  if(s.phase!=='choose' && s.phase!=='reveal') return '';

  for(var i=0;i<n;i++){ var st='next'; if(s.phase==='ended')st='done'; else if(s.phase==='choose'||s.phase==='reveal'){ if(i<cur)st='done'; else if(i===cur)st='now'; } var nm=(i===n-1)?'Finale':('Ch '+(i+1)); var t=l?('<div class="ct">'+fmtClock(l[i])+'</div>'):''; cells+='<div class="cell '+st+'"><div class="cn">'+nm+'</div>'+t+'</div>'; }

}

/* ---- OVERTIME render ---- */
// Tracks OT transitions so sounds/FX fire once per edge. otKey = round+phase, so a new round or a choose->reveal
// flip is a distinct moment. LOCALPICK is reused for the optimistic OT door highlight.
var OTST={key:null,round:0,phase:null,enteredAt:0,lastHb:0,lastCd:null};
function otReset(){ OTST={key:null,round:0,phase:null,enteredAt:0,lastHb:0,lastCd:null}; }
// Leave the OT takeover gracefully: drop the takeover class but hold a short ot-exit fade so the dark-red theme
// eases back to the normal board instead of snapping. Self-clears; no rAF. No-op if OT wasn't active.
var _otExitT=null;
function otExitGraceful(){ var b=document.body; if(!b.classList.contains('ot')){ b.classList.remove('ot-exit'); return; } b.classList.remove('ot'); b.classList.add('ot-exit'); if(_otExitT)clearTimeout(_otExitT); _otExitT=setTimeout(function(){ document.body.classList.remove('ot-exit'); _otExitT=null; },620); }
function renderOT(s){
  var ot=s.ot, me=s.me||{}, now=Date.now();
  var rm=matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.body.classList.add('ot'); document.body.classList.remove('deep');
  var potEl=$('#pot'); if(potEl)potEl.style.display='none';
  var key=ot.round+':'+ot.phase;
  var newPhase=(OTST.key!==key);
  if(OTST.key===null){ // first frame of overtime
    flash('red'); shake();
  }
  // optimistic pick reset when a new OT round's choose begins
  if(newPhase && ot.phase==='choose'){ LOCALPICK=null; }
  // PICK-REVERT FIX (OT mirror): hold the LATEST clicked OT door until the server confirms it, no 2.5s timeout.
  var mypick = me.pick;
  if(LOCALPICK && ot.phase==='choose'){
    if(me.pick===LOCALPICK.i){ LOCALPICK=null; }
    else { mypick=LOCALPICK.i; }
  }

  // doors
  var revealing = ot.phase==='reveal' && ot.reveal;
  var doorsHtml='';
  for(var i=0;i<(ot.doors||2);i++){
    var cls='otdoor', lbl='';
    if(ot.phase==='choose'){ if(me.alive&&mypick===i){ cls+=' pick'; lbl='your door'; } }
    else if(revealing){ if(ot.reveal.bust===i){ cls+=' bust'; lbl=ot.reveal.busted+' caught'; } else { cls+=' safe'; lbl='clear'; } }

// FILL loop: climb seats toward the target with a lively, slightly random cadence, grow the pot, and once the
// threshold is crossed light the fuse (a short grace countdown) before launching into the chambers.
function pracLobbyLoop(){
  if(!PLOBBY.on || PLOBBY.stage!=='fill') return;
  var now=Date.now();
  // add a burst of robbers every tick (faster early, easing as it fills), capped at the target.
  if(!PLOBBY.lit){
    var add=Math.max(1, Math.round(1+Math.random()*3));
    PLOBBY.seats=Math.min(PLOBBY.target, PLOBBY.seats+add);
    PLOBBY.pot += add*PLOBBY.entryUsd*100;             // ~100 RVLT per $ of entry, purely cosmetic
    PLOBBY.rate=20+Math.floor(Math.random()*26);
    // feed the SAME chat component the live game uses: a sys buy-in line each burst + occasional robber chatter.
    pracFeedPush('buy'); if(Math.random()<0.4) pracFeedPush('chat');
    if(PLOBBY.seats>=PLOBBY.threshold && !PLOBBY.lit){ PLOBBY.lit=true; PLOBBY.graceMs=5200; PLOBBY.graceEnds=now+PLOBBY.graceMs;
      flash('red'); tcard('🔥 THE FUSE IS LIT','robbers keep piling in'); }
    pracLobbyRender();
    PLOBBY.timer=setTimeout(pracLobbyLoop, PLOBBY.lit?500:(280+Math.random()*260));
    return;
  }
  // fuse lit: keep a few late robbers trickling in while the grace burns down, then launch.
  if(now < PLOBBY.graceEnds){
    if(PLOBBY.seats<PLOBBY.target && Math.random()<0.5){ var a2=1+Math.floor(Math.random()*2); PLOBBY.seats=Math.min(PLOBBY.target,PLOBBY.seats+a2); PLOBBY.pot+=a2*PLOBBY.entryUsd*100; pracFeedPush('buy'); }
    pracLobbyRender();
    PLOBBY.timer=setTimeout(pracLobbyLoop, 520);
    return;

  pracLobbyLaunchChambers();
}

    try{ if(window.unisat&&window.unisat.on&&!window.unisat.__vsBtcWired){ window.unisat.__vsBtcWired=true; window.unisat.on('accountsChanged', _vsOnWalletSwitch); } }catch(e){}
  }catch(e){}
}
try{ vsWireWalletSwitch(); }catch(e){}
// re-attempt wiring shortly after load (providers/EIP-6963 may inject late) and after any connect.
setTimeout(function(){ try{ vsWireWalletSwitch(); }catch(e){} }, 1500);
// POLLING FALLBACK (BTC has no reliable switch event; also catches any provider whose event we missed): while a wallet
// is connected, every 4s re-read the live address per chain and adopt it if it changed. Cheap (local reads, no popups).
setInterval(function(){
  try{
    if(!(TOKEN && TOKEN.indexOf('w:')===0)) return;   // only when a wallet session is active
    (async function(){
      // EVM: silent live read + adopt, PLUS stale-selected-account detection -> one-tap switch prompt (Phantom case).
      try{ await _vsReconcileEvm(); }catch(_){}
      try{ var s=liveSolAddr(); if(s && BOUND.sol!==s) adoptAccount('sol', s); }catch(_){}
      try{ var b=liveBtcAddr(); if(b && BOUND.btc!==b) adoptAccount('btc', b); }catch(_){}
    })();
  }catch(e){}
}, 4000);
// INTERACTION-TRIGGERED RE-CHECK: a 4s poll can feel laggy, so also reconcile the moment the user returns to the tab
// (focus / visibility) and on the first pointerdown after the tab regained focus (throttled). SILENT READS ONLY, never
// a popup: this runs _vsReconcileEvm (eth_accounts + selectedAddress), which at most SHOWS the one-tap switch banner.
// This delivers the "it updates as soon as I click on the page" behavior without a 4s wait.
(function(){
  var _lastRecheck=0;
  function recheck(){ var now=Date.now(); if(now-_lastRecheck<800) return; _lastRecheck=now; try{ _vsReconcileEvm(); }catch(e){} }
  try{ window.addEventListener('focus', recheck); }catch(e){}
  try{ document.addEventListener('visibilitychange', function(){ if(!document.hidden) recheck(); }); }catch(e){}
  try{ document.addEventListener('pointerdown', recheck, true); }catch(e){}   // capture: fires before click handlers
})();
// No login page: everyone lands straight in the live chat as a guest (spectator). Connect a wallet (top-right)
// to chat + buy in. A guest identity self-provisions so the chat/game render immediately.
// CHAT DOCK: mount the persistent floating popup once, and toggle it via ONE document-level delegated click listener so
// it works regardless of the game render path (the old per-render onclick was skipped during the stable live-round path,
// which is why it never opened). The bubble toggles open/closed; the X (or a tap on the backdrop area) closes it.
try{ mountChatDock(); }catch(e){}
document.addEventListener('click', function(e){
  try{
    if(e.target && e.target.closest && e.target.closest('#chatbtn')){ e.preventDefault(); toggleChatDock(); return; }
    if(e.target && e.target.closest && e.target.closest('#chatclose')){ e.preventDefault(); toggleChatDock(false); return; }
  }catch(_){}
});
var _booting=false;
function boot(){ if(_booting)return; _booting=true; api('join', TOKEN?{token:TOKEN,name:NAME}:{name:'Robber '+Math.floor(1000+Math.random()*8999)}).then(function(r){ _booting=false; TOKEN=r.token; NAME=r.name; try{localStorage.setItem('vs_token',TOKEN);localStorage.setItem('vs_name',NAME);}catch(e){} maybePrimer(); poll(); }).catch(function(){ _booting=false; setTimeout(boot,2500); }); }
boot();
// PERF: pause all CSS animation while the tab is backgrounded (zero off-screen CPU; stops the browser's
// "this tab is using extra resources" warning). The vs-hidden class drives animation-play-state:paused.
(function(){ function sync(){ document.body.classList.toggle('vs-hidden', document.hidden); } document.addEventListener('visibilitychange', sync); sync(); })();
// I18N: mount the on-brand language switcher in the header once the engine is ready. The switcher itself is
// flagged data-no-i18n so its native-name options ("Español", "日本語"…) are never run through the translator.
// The engine persists the choice (localStorage vs_lang) and translates the live-rendered DOM in place.
(function(){ try{ if(window.VSI18n && VSI18n.renderLanguageSwitcher){ VSI18n.ready.then(function(){ try{ VSI18n.renderLanguageSwitcher('#langmount'); }catch(e){} }); } }catch(e){} })();
// I18N — SYSTEM FEED RE-TRANSLATE ON LANGUAGE SWITCH: the DOM observer leaves the chat/ticker alone (user content is in
// the skip-list), so system/radio lines are translated at their render chokepoints (T18). When the language changes we
// must re-render those surfaces so lines ALREADY on screen flip into the new language too:
//   • chat dock + inline waiting-room feed  -> renderChat(LASTS.chat) repaints every .msgs box (sys lines re-run T18)
//   • lobby activity ticker                 -> repaint the .fp-tk-track in place from the tagged TICKER entries
// User taunts + usernames are never touched (they carry no sys/xlate flag). en is a no-op (T18 identity).
(function(){
  function repaintTicker(){
    try{
      var track=document.querySelector('.fp-ticker .fp-tk-track'); if(!track) return;
      var items=TICKER.slice(-6); if(!items.length) return;
      track.innerHTML=items.map(function(it){ var txt=it.sys?T18(it.t):it.t; return '<span class="fp-tk-i">'+esc(txt)+'</span>'; }).join('<span class="fp-tk-dot">•</span>');
    }catch(e){}
  }
  window.addEventListener('vs-lang-change', function(){
    try{ renderChat(LASTS&&LASTS.chat); }catch(e){}
    try{ repaintTicker(); }catch(e){}
  });
})();
