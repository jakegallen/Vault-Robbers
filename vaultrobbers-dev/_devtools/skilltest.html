<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault Robbers — Skill Engine v4 Harness</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Space+Mono:wght@700&family=Cinzel:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#050b09;color:#cdead9;font-family:'Chakra Petch',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding:16px}
  h1{font-family:'Cinzel',serif;color:#e8c66a;font-size:20px;letter-spacing:.04em;text-align:center;margin:6px 0 2px}
  .sub{text-align:center;color:#7fae93;font-size:11px;margin-bottom:12px}
  #stage{width:100%;aspect-ratio:1/1;background:#0a1410;border:1px solid rgba(61,255,143,.28);border-radius:14px;display:block;touch-action:none}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  button{flex:1;min-width:72px;cursor:pointer;background:linear-gradient(180deg,#3dff8f,#1c8a52);color:#02140b;border:none;border-radius:10px;padding:11px 8px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px}
  .lvl{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:#9fb4ab}
  input[type=range]{flex:1}
  #out{min-height:22px;text-align:center;font-family:'Space Mono',monospace;font-size:13px;margin-top:8px}
  .win{color:#7dffb2}.lose{color:#ff7a86}
</style></head><body>
<div class="wrap">
  <h1>SKILL ENGINE v4</h1>
  <div class="sub">Renderer harness (dev). Bars: 10 24 40 55 68 74 80 86 91 95</div>
  <canvas id="stage"></canvas>
  <div class="lvl">Chamber <b id="lvlN" style="color:#e8c66a">5</b><input id="lvl" type="range" min="1" max="10" value="5"></div>
  <label class="lvl" style="cursor:pointer"><input type="checkbox" id="live"> <b style="color:#8affbe">Live server (real v4 secure transport)</b></label>
  <div class="row">
    <button data-g="oddone">Odd One Out</button>
    <button data-g="spatial">Spatial Recall</button>
    <button data-g="combo">Mental Combo</button>
  </div>
  <div class="row">
    <button data-g="lineup">Lineup</button>
    <button data-g="shade">Shade Match</button>
    <button data-g="dial">Crack Dial</button>
    <button data-g="rhythm">Rhythm Lock</button>
  </div>
  <div id="out">pick a game</div>
</div>
<script src="skillgames-ui.js"></script>
<script src="skillgames-remote.js"></script>
<script>
  const BAR=[0.10,0.24,0.40,0.55,0.68,0.74,0.80,0.86,0.91,0.95];
  const $=s=>document.querySelector(s); const cv=$('#stage');
  const lvl=$('#lvl'); lvl.oninput=()=>$('#lvlN').textContent=lvl.value;
  const ri=n=>Math.floor(Math.random()*n), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  // DEV-ONLY client challenge gen (mirrors server difficulty). Production feeds server-rendered pixels instead.
  function gen(gameKey, L){ const d=(L-1)/9;
    if(gameKey==='oddone'){ const N=Math.round(2+2*d),K=Math.round(6+10*d),sal=clamp(0.85-0.55*d,0.28,0.85); const odd=[];for(let i=0;i<N;i++)odd.push(ri(K)); return {gameKey,data:{rounds:N,tiles:K,salience:sal},reveal:{odd,salience:sal},accent:'#3dff8f'}; }
    if(gameKey==='spatial'){ const grid=d<0.5?9:16,M=Math.min(grid,Math.round(3+4*d)),flashMs=Math.round(clamp(720-380*d,300,720)); const cells=[];for(let i=0;i<M;i++)cells.push(ri(grid)); return {gameKey,data:{grid,count:M,flashMs},reveal:{cells},accent:'#74e04f'}; }
    if(gameKey==='combo'){ const M=Math.round(2+4*d),flashMs=Math.round(clamp(1100-560*d,460,1100)); const nums=[];for(let i=0;i<M;i++)nums.push(1+ri(9)); const rules=['sum','max','min','sumEven','sumOdd']; const rule=rules[ri(d<0.4?3:5)];
      const ans=rule==='sum'?nums.reduce((a,x)=>a+x,0):rule==='max'?Math.max(...nums):rule==='min'?Math.min(...nums):rule==='sumEven'?nums.filter(x=>x%2===0).reduce((a,x)=>a+x,0):nums.filter(x=>x%2===1).reduce((a,x)=>a+x,0);
      return {gameKey,data:{count:M,rule,flashMs},reveal:{nums},accent:'#ffcf4a',_ans:ans}; }
    if(gameKey==='lineup'){ const M=Math.min(7,Math.round(3+5*d)),palette=10,flashMs=Math.round(clamp(950-560*d,360,950)); const seq=[];for(let i=0;i<M;i++)seq.push(ri(palette)); return {gameKey,data:{count:M,palette,flashMs},reveal:{seq},accent:'#3dff8f'}; }
    if(gameKey==='shade'){ const N=Math.round(1+1.5*d),tol=clamp(0.16-0.07*d,0.06,0.16); const targets=[];for(let i=0;i<N;i++)targets.push(0.12+Math.random()*0.76); return {gameKey,data:{rounds:N,tol},reveal:{targets},accent:'#8affbe'}; }
    if(gameKey==='dial'){ const stops=Math.round(1+1.2*d),speed=1.3+0.9*d,arcW=0.30,start=Math.random()*Math.PI*2; const targets=[];for(let i=0;i<stops;i++)targets.push(Math.random()*Math.PI*2); return {gameKey,data:{stops,speed,arcW,start},reveal:{targets},accent:'#e8c66a'}; }
    if(gameKey==='rhythm'){ const beats=Math.round(4+3*d),tol=clamp(0.19-0.11*d,0.07,0.19); const iv=[];for(let i=0;i<beats-1;i++)iv.push(300+Math.round(Math.random()*500)); return {gameKey,data:{beats,tol},reveal:{iv},accent:'#ff8ad0'}; }
  }
  let busy=false;
  document.querySelectorAll('button[data-g]').forEach(b=>b.onclick=async()=>{
    if(busy)return; busy=true; const L=+lvl.value; $('#out').textContent='playing…'; $('#out').className='';
    try{
      if($('#live').checked){ const g=await window.RTV_SKILL_REMOTE.run(cv,{level:L,gameKey:b.dataset.g});
        $('#out').textContent=(g.pass?'CLEARED':'BUSTED')+'  ·  score '+Math.round(g.score*100)+'%  ·  need '+Math.round(g.bar*100)+'%  ·  [server-graded]';
        $('#out').className=g.pass?'win':'lose';
      } else { const spec=gen(b.dataset.g,L); const res=await window.RTV_SKILL.play(cv,spec);
        let score=res.localScore; if(b.dataset.g==='combo'){ const v=res.events[0]&&res.events[0].value; score=(v===spec._ans)?1:0; }
        const win=score>=BAR[L-1];
        $('#out').textContent=(win?'CLEARED':'BUSTED')+'  ·  score '+Math.round(score*100)+'%  ·  need '+Math.round(BAR[L-1]*100)+'%  ·  [dev]';
        $('#out').className=win?'win':'lose';
      }
    }catch(e){ $('#out').textContent='err: '+e.message; }
    busy=false;
  });
</script></body></html>
