<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Robbers · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--neon:#3dff8f;--gold:#e8c66a;--sky:#9fd0ff;--muted:#5c7a63;--text:#dfeee6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
    radial-gradient(80% 60% at 50% -10%,rgba(31,122,58,.20),transparent 60%),
    radial-gradient(60% 50% at 90% 110%,rgba(217,180,90,.06),transparent 55%),
    #04100a;color:var(--text);font-family:'Space Mono',monospace;padding:28px 16px 70px}
  .wrap{max-width:1060px;margin:0 auto}
  h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(26px,5vw,46px);color:var(--gold);text-align:center;margin:6px 0 2px;text-shadow:0 0 26px rgba(217,180,90,.35)}
  .sub{text-align:center;color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:11px;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .card{background:rgba(6,20,13,.72);border:1px solid rgba(61,255,143,.16);border-radius:14px;padding:16px 18px}
  .card .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .card .v{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(22px,4vw,34px);margin-top:6px;color:var(--text);line-height:1.05}
  .card .v.neon{color:var(--neon)} .card .v.gold{color:var(--gold)} .card .v.sky{color:var(--sky)}
  .card .n{font-size:10px;color:var(--muted);margin-top:5px}
  .sec{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--neon);font-size:13px;margin:34px 0 12px}
  .funnel{background:rgba(6,20,13,.72);border:1px solid rgba(61,255,143,.16);border-radius:14px;padding:18px}
  .frow{display:flex;align-items:center;gap:12px;margin:9px 0}
  .flab{width:96px;font-size:11px;color:var(--muted)} .flab b{color:var(--text)}
  .flab.core b{color:var(--gold)}
  .fbar{flex:1;height:16px;background:rgba(61,255,143,.08);border-radius:8px;overflow:hidden}
  .ffill{height:100%;background:linear-gradient(90deg,#12b45f,#3dff8f);border-radius:8px;transition:width .6s ease;box-shadow:0 0 14px rgba(61,255,143,.4)}
  .ffill.core{background:linear-gradient(90deg,#b5872f,#e8c66a);box-shadow:0 0 14px rgba(217,180,90,.5)}
  .fpct{width:118px;text-align:right;font-size:11px;color:var(--neon)}
  .fpct.core{color:var(--gold)}
  .locked{position:relative;background:rgba(6,20,13,.6);border:1px dashed rgba(217,180,90,.4);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
  .locked .big{font-family:'Cinzel',serif;font-weight:900;font-size:22px;color:var(--gold);margin-bottom:6px}
  .foot{text-align:center;color:var(--muted);font-size:10px;margin-top:32px;opacity:.7}
  a{color:var(--sky)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vault Robbers</h1>
  <div class="sub">Live Heist Statistics</div>

  <div class="grid" id="grid"></div>

  <div class="sec">Chamber funnel — how deep the crews get</div>
  <div class="funnel" id="funnel"><div style="color:var(--muted);font-size:12px">Loading…</div></div>

  <div class="sec">Vault Robbers</div>
  <div class="grid" id="nftgrid"></div>

  <div class="sec">Vault Robber Manager</div>
  <div class="locked" id="manager">
    <div class="big">Locked</div>
    Manage each Robber's SAC (its token-bound wallet): deposit and withdraw the loot inside.<br>
    Unlocks here right after the mint.
  </div>

  <div class="foot" id="foot">testnet · refreshes every 15s</div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const nf = n => (Number(n)||0).toLocaleString(undefined,{maximumFractionDigits:0});
  const nf4 = n => (Number(n)||0).toLocaleString(undefined,{maximumFractionDigits:4});
  function card(k, v, cls, note){ return '<div class="card"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div>'+(note?'<div class="n">'+note+'</div>':'')+'</div>'; }
  async function load(){
    let d; try{ d = await fetch('api/stats/public').then(r=>r.json()); }catch(e){ $('#foot').textContent='Could not reach the server.'; return; }
    if(!d || d.error){ $('#foot').textContent='Stats unavailable.'; return; }
    $('#grid').innerHTML =
      card('Entries', nf(d.entries), 'neon') +
      card('Unique players', nf(d.uniquePlayers), 'sky') +
      card('Unique tries', nf(d.uniqueTries)) +
      card('Vaults cracked', nf(d.robs), 'gold') +
      card('ROBINVAULT paid in', nf(d.rvltPaidToGame), '', 'total game entry fees') +
      card('ROBINVAULT burned', nf(d.rvltBurned), 'neon', 'game entry-fee burn') +
      card('Loot pot', nf(d.potRvlt)+' RVLT', 'gold') +
      card('ETH pot', nf4(d.jackpotEth)+' Ξ', 'sky', 'the prize inside the vault');
    const f = d.funnel||[], levels = d.levels||10;
    $('#funnel').innerHTML = f.map(x => { const core = x.level===levels;
      return '<div class="frow"><div class="flab '+(core?'core':'')+'">'+(core?'The Core ':'Chamber ')+'<b>'+x.level+'</b></div>'+
      '<div class="fbar"><div class="ffill '+(core?'core':'')+'" style="width:'+Math.max(0,Math.min(100,x.pct))+'%"></div></div>'+
      '<div class="fpct '+(core?'core':'')+'">'+x.pct+'% · '+nf(x.reached)+'</div></div>'; }).join('') || '<div style="color:var(--muted)">No runs yet.</div>';
    const n = d.nft||{};
    $('#nftgrid').innerHTML =
      card('Robbers minted', (n.minted==null?'—':nf(n.minted))+' / '+nf(n.supply||1000), 'gold') +
      card('Max per wallet', nf(n.maxPerWallet||2), 'sky') +
      card('Mint proceeds', 'to treasury', '', 'burned or added to the pot at the team’s call');
    $('#foot').textContent = 'testnet · refreshes every 15s · last update '+new Date().toLocaleTimeString();
  }
  load(); setInterval(load, 15000);
</script>
</body>
</html>
