[profile.default]
src = "src"
out = "out"
libs = ["../../oneshot-contracts/lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts-upgradeable/=../../oneshot-contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=../../oneshot-contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../oneshot-contracts/lib/forge-std/src/",
]
