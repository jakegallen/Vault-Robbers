[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api?chainid=4663" }
