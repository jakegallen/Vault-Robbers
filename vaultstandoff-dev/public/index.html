/* ---- VERIFY THIS ROUND ---------------------------------------------------------------------------------
   Independently reproduce a settled round from its published proof (GET api/round/:id/proof): the revealed
   seed + every logged pick + the busted-door-per-chamber trail. We recompute the busted door for each chamber
   from the picks (using the SAME seeded PRNG the server used for any absent/auto draw) and confirm it matches
   the proof. When escrow is on we also check keccak256(seed) == the on-chain committed seedHash, proving the
   seed was fixed BEFORE the round played. This is what lets the fairness copy stand. ---- */
// browser twin of the server PRNG: keccak256(toUtf8Bytes(seed:roundId:label:ctr)) -> stream of 48-bit floats.
function vsPrng(seed, roundId, label){
  var ctr=0, base=String(seed)+':'+String(roundId)+':'+String(label), pool=null, off=0;
  function hexToBytes(h){ h=h.slice(2); var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function refill(){ pool=hexToBytes(ethers.keccak256(ethers.toUtf8Bytes(base+':'+(ctr++)))); off=0; }
  return function(){ if(!pool||off+6>pool.length) refill(); var v=0; for(var i=0;i<6;i++){ v=v*256+pool[off+i]; } off+=6; return v/281474976710656; };
}
// Recompute which door busted a chamber from the proof's logged human picks {th, ch, door}: the most-crowded
// door busts, lowest-index on a tie, matching the server's rule. Returns the recomputed bust door + how many
// human picks were logged for that chamber (n===0 means the room was all-absent/auto, a seeded draw the client
// can only replay with the full roster, so we don't flag those).
function vsRecomputeBust(proof, chamberIdx){
  var inCh=(proof.picks||[]).filter(function(p){ return p.ch===chamberIdx && p.door!=null && p.door>=0; });
  var maxD=1; inCh.forEach(function(p){ if(p.door>maxD) maxD=p.door; });
  var doors=maxD+1, counts=new Array(doors).fill(0); inCh.forEach(function(p){ counts[p.door]++; });
  var mx=0; for(var i=1;i<doors;i++) if(counts[i]>counts[mx]) mx=i;
  return { door:mx, counts:counts, n:inCh.length };
}
async function verifyRound(id){
  var proof; try{ proof=await fetch('api/round/'+encodeURIComponent(id)+'/proof').then(function(r){return r.json();}); }catch(e){ proof=null; }
  if(!proof||proof.error){ return { ok:false, msg:(proof&&proof.error)||T('verify.no_proof') }; }
  var lines=[], ok=true;
  // 1) seed commitment (only when escrow is live and we can read the on-chain hash)
  var computedHash=null; try{ computedHash=ethers.keccak256(proof.seed); }catch(e){}
  lines.push('Revealed seed: '+(proof.seed?proof.seed.slice(0,18)+'…':'(none)'));
  if(computedHash) lines.push('keccak256(seed): '+computedHash.slice(0,18)+'…');
  if(ESC.on){ try{ var signer=await escSigner(); var esc=new ethers.Contract(ESC.address,ESC_ABI,signer); var r=await esc.rounds(id); var onchainHash=r[7];
    var match=onchainHash&&computedHash&&onchainHash.toLowerCase()===computedHash.toLowerCase();
    lines.push((match?'✅':'❌')+' matches on-chain commit '+(onchainHash?String(onchainHash).slice(0,18)+'…':'(unset)')); if(!match) ok=false;
  }catch(e){ lines.push('• on-chain commit unavailable ('+((e&&e.shortMessage)||'read failed')+')'); } }
  // 2) replay each chamber's busted door from the logged picks + proof trail
  var trail=proof.bustedByChamber||[];
  trail.forEach(function(b){
    var re=vsRecomputeBust(proof, b.chamber);
    var agree=(re.n===0) || (re.door===b.door);   // n===0: all-absent/auto chamber, needs the full roster to replay
    lines.push((agree?'✅':'⚠️')+' chamber '+((b.chamber||0)+1)+': busted door '+((b.door||0)+1)+', '+(b.caught||0)+' caught'+(re.n?(' · '+re.n+' logged human picks'):' · no logged human picks'));
  });
  var w=proof.winner||{}; lines.push('Winner: '+(w.none?'nobody walked':(w.name||'unnamed')));
  lines.push('Ticket set: '+((proof.tickets||[]).length)+' non-bot tickets (hashed), picks logged: '+((proof.picks||[]).length));
  return { ok:ok, msg:lines.join('\n'), proof:proof };
}

/* ---- AUTO-PILOT (auto-buy + auto-play): the player pre-signs a BOUNDED, revocable authorization so the
   relayer can enter them into N upcoming heists while they're away. Custody never leaves the wallet: funds are
   pulled per-round only, capped by an EXACT allowance and the signed limits, and revocable at any time.

   BOUNDED APPROVAL MATH (never unlimited): allowance = maxTicketsPerRound * entry(wei) * rounds. We compute the
   exact wei, show the player the exact RVLT total and round count before any signature, and call
   approve(escrow, EXACT). There is NO code path here that approves MaxUint256 / unlimited. "Revoke" = approve(escrow,0).
*/
var VERIFIED=false;   // mirrors server REG[tok].verified for the connected wallet (set by siweProve / state.me.verified)
// Prove control of the connected wallet via SIWE (one-time nonce signature, authorizes NO transaction). Idempotent:
// returns true if already verified. Reuses the same nonce/verify endpoints the connect flow uses.
async function siweProve(){
  if(!(TOKEN&&TOKEN.indexOf('w:')===0)) throw new Error(T('wallet.connect_first'));
  var eip=escProvider(); if(!eip) throw new Error('No wallet');
  // FIX-1: always prove against the LIVE selected account (not a cached WALLET). liveAccount() re-syncs identity +
  // clears VERIFIED when the account changed, so a mid-session account switch forces a fresh SIWE on the new address.
  var addr=await liveAccount();
  if(VERIFIED) return true;
  var non=await (await fetch('api/siwe/nonce?address='+addr.toLowerCase())).json();
  if(!non||!non.message) throw new Error('could not start sign-in');
  // personal_sign `from` MUST be the live account, or the wallet rejects with "from should be same as current address".
  var sig=await eip.request({method:'personal_sign',params:[non.message,addr]});
  var vr=await (await fetch('api/siwe/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,signature:sig,token:TOKEN})})).json();
  VERIFIED=!!(vr&&vr.verified); if(!VERIFIED) throw new Error('sign-in failed'); return true;
}
// Exact RVLT total (string, whole-token) for a bounded authorization: maxTickets/round * entry * rounds.
function autobuyTotalWei(entryWei, maxTicketsPerRound, rounds){
  return BigInt(entryWei)*BigInt(maxTicketsPerRound)*BigInt(rounds);

function weiToRvlt(w){ try{ return Math.round(Number(w)/1e18); }catch(e){ return 0; } }

async function armAutobuy(rounds, maxTicketsPerRound, onStage){

  var stage=onStage||function(){};
  if(!(ESC.on&&ESC.address&&ESC.rvlt&&ESC.entry)) throw new Error('auto-buy is not enabled yet');
  // FIX-1: ensure wallet connected + on the live escrow chain BEFORE anything, then prove against the LIVE account.
  var eip0=escProvider(); if(!eip0) throw new Error('No wallet. Connect one first.');
  stage(T('stage.checking_wallet'));

  try{ await ensureNetwork(eip0, ESC.chainId); }catch(e){ throw new Error('Switch your wallet to '+activeNet().label+' to continue.'); }
  stage(T('stage.sign_in')); await siweProve();
  var signer=await escSigner(); await assertChain(signer);
  // Re-read BOTH the live wallet account and the ethers signer address, and require they match. This is the exact
  // guard against "from should be same as current address": if they diverge (account switched between SIWE and now),
  // we ask the user to re-select rather than firing an approve with a stale `from`. liveAccount() also re-syncs.
  var live=await liveAccount();
  var addr=await signer.getAddress();
  if(addr.toLowerCase()!==live.toLowerCase()){
    throw new Error('Wallet account changed. Re-open auto-play so it uses your selected account ('+shortAddr(live)+').');
  }
  // Pin the signer to the asserted account so every approve/sign carries `from`=addr even if index-0 shifts mid-flow
  // (BrowserProvider.getSigner(addr) binds the exact account, eliminating the "from should be same" divergence).
  try{ var eipP=new ethers.BrowserProvider(escProvider()); signer=await eipP.getSigner(addr); }catch(e){}
  var entryWei=String(ESC.entry);
  var totalWei=autobuyTotalWei(entryWei, maxTicketsPerRound, rounds);
  var rv=new ethers.Contract(ESC.rvlt,RV_ABI,signer);

  // BOUNDED approval: set the allowance to EXACTLY the authorized total (not unlimited). If an older allowance is
  // higher, overwrite it down to the exact bound; if it already covers the bound, skip the tx.
  var cur=0n; try{ cur=await rv.allowance(addr,ESC.address); }catch(e){}

  }

  stage(Tn(rounds,'stage.preparing_one','stage.preparing_other',{n:rounds}));
  var pr=await api('autobuy/params?address='+addr.toLowerCase()+'&rounds='+rounds);
  if(!pr||pr.error) throw new Error((pr&&pr.error)||'could not load auto-buy params');
  var sug=(pr.suggestedRounds||[]); if(!sug.length) throw new Error('no upcoming heists to authorize yet');
  var use=sug.slice(0,rounds);
  var deadline=Math.floor(Date.now()/1000)+7*24*3600;   // authorization expires in 7 days
  // HARDENING: the signed maxEntry is the FULL per-ticket entry, NEVER a holder-discounted amount. The V4 holder
  // discount is applied ON-CHAIN at buy time (entryPriceFor), so buyInFor pulls <= the discounted price while the
  // signed ceiling stays at full entry. Signing the discount here would make the discount a brittle precondition:
  // if the wallet's NFT status changed before the relayer submits, buyInFor would exceed maxEntry and REVERT. By
  // ceiling at full entry, a holder's discount is pure upside and the authorization can never revert on a status
  // flip. Source of truth = the server's on-chain entryWei (pr.entryWei from autobuy/params), full price for all;
  // we fall back to ESC.entry (also full entry) only if the param read omitted it. We NEVER read PRICING here.
  var fullEntryWei=String((pr&&/^\d+$/.test(String(pr.entryWei||''))?pr.entryWei:entryWei));
  var maxEntryWei=fullEntryWei;                          // per-ticket entry ceiling = FULL on-chain entry (not discounted)
  var maxTicketsWei=String(maxTicketsPerRound);
  // V6 PREFERRED: ONE range signature authorizes ALL `rounds` heists (1 approve + 1 signature, no matter how many
  // games). Falls back to the legacy per-round array only if the server didn't serve range material.
  if(pr.range && pr.range.rangeTypes){
    var rg=pr.range;
    var rvalue={ roundStart:String(rg.roundStart), roundCount:String(rounds), player:addr, maxTickets:maxTicketsWei, maxEntry:maxEntryWei, nonce:String(rg.nonce), deadline:String(deadline) };
    stage(Tn(rounds,'stage.sign_range_one','stage.sign_range_other',{n:rounds}));
    var rsig=await signer.signTypedData(pr.domain, rg.rangeTypes, rvalue);
    stage(T('stage.activating'));
    var rout=await api('autobuy',{ token:TOKEN, player:addr.toLowerCase(), maxTickets:maxTicketsPerRound, perRound:maxTicketsPerRound, maxEntry:maxEntryWei, deadline:deadline, roundStart:String(rg.roundStart), roundCount:rounds, nonce:rg.nonce, sig:rsig });
    if(!rout||rout.error) throw new Error((rout&&rout.error)||'could not activate auto-buy');
    return { rounds:rounds, totalWei:totalWei, out:rout };
  }
  // LEGACY fallback: sign one bounded AutoBuy per (roundId, nonce). Fields + order come straight from the server.
  var auths=[];
  for(var k=0;k<use.length;k++){
    var ent=use[k];
    var value={ roundId:String(ent.roundId), player:addr, maxTickets:maxTicketsWei, maxEntry:maxEntryWei, nonce:String(ent.nonce), deadline:String(deadline) };
    stage(T('stage.sign_k',{k:(k+1),total:use.length}));
    var sig=await signer.signTypedData(pr.domain, pr.types, value);
    auths.push({ roundId:String(ent.roundId), nonce:ent.nonce, sig:sig });
  }
  stage(T('stage.activating'));
  var out=await api('autobuy',{ token:TOKEN, player:addr.toLowerCase(), maxTickets:maxTicketsPerRound, perRound:maxTicketsPerRound, maxEntry:maxEntryWei, deadline:deadline, auths:auths });
  if(!out||out.error) throw new Error((out&&out.error)||'could not activate auto-buy');
  return { rounds:use.length, totalWei:totalWei, out:out };
}
async function cancelAutobuy(){ var out=await api('autobuy/cancel',{}); if(!out||out.error) throw new Error((out&&out.error)||'cancel failed'); return out; }
// Revoke the bounded allowance entirely: approve(escrow, 0). Full off (server auth already cancelled separately).
async function revokeApproval(){ var signer=await escSigner(); await assertChain(signer); var rv=new ethers.Contract(ESC.rvlt,RV_ABI,signer); toast(T('stage.revoking')); await (await rv.approve(ESC.address, 0n)).wait(); return true; }
async function getAutobuy(){ try{ return await api('autobuy'); }catch(e){ return {active:false}; } }

/* ---- WALK-AWAY PLAN: "deposit once, auto-play the next N heists hands-off" ----------------------------------
   This is a thin ORCHESTRATOR over the two existing primitives, nothing new on the money side:
     1) armAutobuy(N, tickets) -> SIWE, EXACT bounded approve(escrow, N*tickets*entry), sign N AutoBuy auths, POST.
     2) api('autoplay', {on:true, routes:[...]}) -> the relayer plays each of those heists for the player.
   Tying them together just means: arm the buys first, then flip auto-play on with a balanced default strategy so
   the heists it buys are actually played. No escrow / settle / claim code is touched here. The approval stays
   EXACT (never unlimited) because it flows entirely through armAutobuy's bounded approve.
*/
// BALANCED DEFAULT STRATEGY (the "walk away and it just works" picks). The live door count shrinks with the field
// (routesFor: 2..5 doors), so a FIXED door index would (a) often exceed the live door count and (b) herd every
// walk-away player onto the same door. Instead we hand the server all-null `pre`: the server resolves each null to
// a per-player, per-chamber seeded draw (drandInt('default:'+id, routes.length)) which is varied, never-herding,
// and always in-range for whatever door count the chamber has. That IS the sensible balanced default.
function balancedDefaultRoutes(maxChambers){ var n=Math.max(1,Math.min(20,(maxChambers|0)||6)); var r=[]; for(var i=0;i<n;i++) r.push(null); return r; }
// Does the player have a custom (non-empty) auto-play strategy saved? If so we keep it instead of clobbering it.
function hasCustomStrategy(ap){ var pre=ap&&ap.pre; return !!(Array.isArray(pre)&&pre.some(function(x){ return x!=null; })); }
// Arm N bounded auto-buys AND enable auto-play, so the next N heists are entered AND played hands-free.
// keepStrategy: if true and the player already has custom picks, leave them; otherwise apply the balanced default.
async function armWalkAway(rounds, maxTicketsPerRound, maxChambers, keepStrategy, onStage){
  var stage=onStage||function(){};
  // 1) the EXACT bounded approval + N signed auto-buy authorizations (unchanged primitive).
  var res=await armAutobuy(rounds, maxTicketsPerRound, stage);
  // 2) turn on auto-play so those heists are actually played. Default = balanced (all-auto) unless keeping a custom one.
  stage(T('stage.enabling_play'));
  var routes = keepStrategy ? undefined : balancedDefaultRoutes(maxChambers);
  var body={ token:TOKEN, on:true }; if(routes) body.routes=routes;
  var ap=await api('autoplay', body);
  if(!ap||ap.error) throw new Error((ap&&ap.error)||'could not enable auto-play');
  return { rounds:res.rounds, totalWei:res.totalWei, perRound:maxTicketsPerRound };
}
// ONE-TAP CANCEL the whole plan: stop auto-buy, revoke the bounded allowance to 0, and turn auto-play off.
// Each step is defensive (a later step still runs if an earlier one is a no-op), mirroring the existing controls.
async function cancelWalkAway(onStage){
  var stage=onStage||function(){};
  stage(T('stage.stopping'));     try{ await cancelAutobuy(); }catch(e){}
  // revoke sets allowance to EXACTLY 0 (approve(escrow,0)); it needs a wallet + chain, so surface its error.
  stage(T('stage.revoking'));    await revokeApproval();
  stage(T('stage.turning_off')); try{ await api('autoplay', { token:TOKEN, on:false }); }catch(e){}
  return true;
}
// Is a hands-off plan active right now? (auto-buy armed with rounds left.)
function walkAwayActive(ab){ return !!(ab&&ab.active&&(ab.roundsLeft||0)>0); }

/* ---- RESULTS DIGEST: how the auto-played heists went (entered / won / lost / pot), built CLIENT-SIDE from data
   that already exists: the auto-buy record (which rounds the relayer entered, via GET /api/autobuy nonces[].round
   + the locally-tracked vs_esc_rounds), read against the SAME on-chain views checkWinnings() uses
   (rounds(id).status, winShare(id,addr), settled(id,addr)). No new endpoint, no money logic. Each row carries the
   existing Verify link. Status map (ESC contract): 3 = resolved/payable, 4 = voided/refundable, else in-flight. */
async function autoplayDigest(){
  if(!ESC.on) return { rows:[], note:T('digest.not_live') };
  // round ids the plan actually touched: spent auto-buy nonces (authoritative) unioned with locally tracked rounds.
  var ab=await getAutobuy();
  var ids=[];
  try{ (ab&&ab.nonces||[]).forEach(function(x){ if(x&&x.spent&&x.round!=null) ids.push(String(x.round)); }); }catch(e){}
  try{ var ls=JSON.parse(localStorage.getItem('vs_esc_rounds')||'[]'); ls.forEach(function(id){ if(ids.indexOf(String(id))<0) ids.push(String(id)); }); }catch(e){}
  if(!ids.length) return { rows:[], note:T('digest.no_autoplayed'), ab:ab };
  var signer,addr;
  try{ signer=await escSigner(); await assertChain(signer); addr=await signer.getAddress(); }
  catch(e){ return { rows:[], note:T('digest.connect_results'), ab:ab, needWallet:true }; }
  var esc=new ethers.Contract(ESC.address,ESC_ABI,signer);
  ids=ids.slice(-20).reverse();
  // read-only, parallel view calls (free): classify each round for THIS wallet. Mirrors checkWinnings' read phase.
  var rows=await Promise.all(ids.map(async function(id){
    var row={ id:id, kind:'pending', pot:0, share:0, claimed:false };
    try{
      var r=await esc.rounds(id); row.pot=weiToRvlt(r[1]); var status=Number(r[8]);
      try{ row.claimed=await esc.settled(id,addr); }catch(e){}
      if(status===3){ var share=0n; try{ share=await esc.winShare(id,addr); }catch(e){} row.share=weiToRvlt(share); row.kind=(share>0n)?'won':'lost'; }
      else if(status===4){ row.kind='void'; }
      else { row.kind='pending'; }
    }catch(e){ row.kind='pending'; }
    return row;
  }));
  return { rows:rows, ab:ab };
}

function fmtClock(ms){ var d=new Date(ms); function z(n){return (n<10?'0':'')+n;} return z(d.getHours())+':'+z(d.getMinutes()); }
function mmss(ms){ if(ms==null)return''; var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60); s=s%60; return m+':'+(s<10?'0':'')+s; }
function schedBar(s){

    else { ph=T('sched.filling'); cd=''; }
    return '<div class="sched"><span class="ph">'+ph+'</span>'+(cd?'<span class="cd">'+cd+'</span>':'')+'</div>';
  }
  if(s.phase==='lobby'){ ph=T('sched.lobby'); cd=Math.ceil(s.lobbyEndsIn/1000)+'s'; }
  else if(s.phase==='choose'){ ph=s.blind?T('sched.locked'):T('sched.pick'); cd=s.lockIn+'s'; var tp=s.blind?100:Math.round(s.lockIn/((s.chooseWindow||19))*100); var urg=(!s.blind&&s.lockIn<=5)?' urg':''; bar='<div class="timer'+(s.blind?' blind':'')+urg+'"><i style="width:'+tp+'%"></i></div>'; }
  else if(s.phase==='reveal'){ ph=T('sched.breach'); }

  return '<div class="sched"><span class="ph">'+ph+'</span>'+(cd?'<span class="cd">'+cd+'</span>':'')+'</div>'+bar;

// Normalize the fill object across server shapes. Old shape: {state:'filling'|'armed', seats, cap, threshold, fuseIn}.
// New "rmfill" shape: {state:'filling'|'locking'|'playing'|'ended', seats, ticketsSold, threshold, target, cap, graceIn}
// plus econ:{entryUsd, roundTarget, walletCap}. We fold both into one record the UI can read without branching.
function fillInfo(s){
  var f=s.fill; if(!f) return null;
  var e=s.econ||{};
  // progress numerator/denominator: prefer tickets sold toward the round target, fall back to seats/cap.
  var sold = (f.ticketsSold!=null)?f.ticketsSold : (f.seats!=null?f.seats:0);
  var target = (f.target!=null)?f.target : (f.cap!=null?f.cap:0);
  var thr = (f.threshold!=null)?f.threshold : 0;
  var cap = (f.cap!=null)?f.cap : target;
  // "locking" is the new name for the old "armed" grace window; grace countdown is graceIn (new) or fuseIn (old).
  var locking = (f.state==='locking' || f.state==='armed');
  var grace = (f.graceIn!=null)?f.graceIn : (f.fuseIn!=null?f.fuseIn:null);
  var lob=f.lobby||{};
  var vel=lob.velocity||{};
  var odds=lob.odds||{};
  return {
    state:f.state, locking:locking, seats:(f.seats!=null?f.seats:sold), sold:sold, target:target, threshold:thr, cap:cap,
    grace:grace, pct:(target>0?Math.min(100,Math.round(sold/target*100)):0),
    thrPct:(target>0?Math.min(100,Math.round(thr/target*100)):0),
    entryUsd:(e.entryUsd!=null?e.entryUsd:null), roundTarget:(e.roundTarget!=null?e.roundTarget:null),
    walletCap:(e.walletCap!=null?e.walletCap:null),
    // LIVE LOBBY (read-only, server-derived): seats to arm, fill velocity, rough odds/EV, dynamic-grace window.
    toThreshold:(lob.seatsToThreshold!=null?lob.seatsToThreshold:Math.max(0,thr-sold)),
    rate:(vel.rate!=null?vel.rate:0), fast:!!vel.fast,
    winChance:(odds.winChance!=null?odds.winChance:null), myWinChance:(odds.myWinChance!=null?odds.myWinChance:null),
    myTickets:(odds.myTickets!=null?odds.myTickets:0), potAfterRake:(odds.potAfterRake!=null?odds.potAfterRake:null),
    graceMax:(f.graceMax!=null?f.graceMax:null), graceNow:(f.graceNow!=null?f.graceNow:null)
  };
}

/* ---- PvP PRESENCE (aggregate only) --------------------------------------------------------------------------
   Surfaces the FEELING of a crowded room from aggregate numbers alone: how many robbers are still inside, and how
   many have locked a door so far. It NEVER encodes which door anyone chose (the only per-player bit used is ME,
   so the player can see themself in the room). Safe to show during choose/blind. `alive` = field still inside,
   `committed` = how many have locked in, `meName` = you (nullable), `locked` = whether you've committed. */
function presenceHTML(alive,committed,blind){
  alive=alive||0; committed=Math.min(committed||0,alive);
  var pct=alive>0?Math.round((committed/alive)*100):0;
  var lockLine=blind?T('presence.all_sealed'):T('presence.locked_in',{committed:committed,alive:alive});
  return '<div class="presence" id="presence">'
    +'<div class="pbox field"><div class="pnum" id="prAlive">'+alive+'</div><div class="plbl">'+T('presence.inside')+'</div></div>'
    +'<div class="pbox"><div class="pnum lock" id="prLocked">'+committed+'</div><div class="plbl" id="prLockLbl">'+lockLine+'</div>'
      +'<div class="pbar"><i id="prBar" style="width:'+pct+'%"></i></div></div>'
    +'</div>';
}
/* Wrap the aggregate crowd (presence counters + roster) so the final sealed beat can blank it as one unit behind the
   vault-dark veil. During the beat the room reads as hidden, which also means zero crowd signal escapes, aggregate
   or otherwise, so the anti-bot guarantee holds through the blind window. */
function crowdWrap(inner,blind){ return '<div class="crowdzone'+(blind?' crowdblind':'')+'" id="crowdzone">'+inner+'</div>'; }
/* A chip cluster sized to the field so the room reads as POPULATED. Chips are shuffled from a stable seed and carry
   no door data (position is cosmetic). The first `committed` chips read "locked", the rest "open"; YOU is always a
   gold chip. Capped so the row never overflows; an overflow count stands in for the remainder. */
function rosterHTML(alive,committed,meName,youLocked){
  alive=Math.max(0,alive||0); committed=Math.min(committed||0,alive);
  var cap=Math.min(alive,22), chips='';
  // player chip first so it is always visible; then fill the room with anonymous robbers.
  var othersLocked=Math.max(0,committed-(youLocked?1:0));
  for(var i=0;i<cap;i++){
    if(i===0 && meName!=null){ chips+='<span class="rc me '+(youLocked?'locked':'open')+'" title="you">'+AV_EMO[hashStr(meName)%AV_EMO.length]+'</span>'; continue; }
    var isLocked=((meName!=null?i-1:i)<othersLocked);
    chips+='<span class="rc '+(isLocked?'locked':'open')+'" style="animation-delay:'+((i%7)*0.12).toFixed(2)+'s">'+AV_EMO[(i*7+3)%AV_EMO.length]+'</span>';
  }
  if(alive>cap) chips+='<span class="more">+'+(alive-cap)+'</span>';
  return '<div class="roster" id="roster">'+chips+'</div>';
}
/* in-place presence update (no DOM rebuild): called every tick while the chamber stays stable, so the counters and
   the roster tick without flicker. Numbers only, nothing door-specific. */
function updatePresence(alive,committed,blind,meName,youLocked){
  alive=alive||0; committed=Math.min(committed||0,alive);
  var a=$('#prAlive'); if(a && a.textContent!==String(alive)) a.textContent=alive;
  var l=$('#prLocked'); if(l && l.textContent!==String(committed)){ l.textContent=committed; l.classList.remove('bump'); void l.offsetWidth; l.classList.add('bump'); }
  var ll=$('#prLockLbl'); if(ll){ var txt=blind?T('presence.all_sealed'):T('presence.locked_in',{committed:committed,alive:alive}); if(ll.textContent!==txt) ll.textContent=txt; }
  var b=$('#prBar'); if(b){ var pct=alive>0?Math.round((Math.min(committed,alive)/alive)*100):0; b.style.width=pct+'%'; }
  // roster: only rebuild its chips when the locked/alive counts actually move (cheap, no full-view teardown). On an
  // INCREASE in committed, pop the chips that just locked in so the room visibly fills as robbers commit. The pop
  // is positional only (position is cosmetic, seeded, never door-derived), so it leaks nothing about any door.
  var r=$('#roster'); if(r){ var sig=alive+':'+committed+':'+(youLocked?1:0);
    if(r.getAttribute('data-sig')!==sig){
      var prevC=parseInt(r.getAttribute('data-locked')||'0',10);
      r.outerHTML=rosterHTML(alive,committed,meName,youLocked);
      var r2=$('#roster');
      if(r2){ r2.setAttribute('data-sig',sig); r2.setAttribute('data-locked',String(committed));
        var rm=matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
        if(!rm && committed>prevC){ var chips=r2.querySelectorAll('.rc.locked'); for(var ci=prevC;ci<committed && ci<chips.length;ci++){ (function(el){ el.classList.add('lockpop'); setTimeout(function(){ el.classList.remove('lockpop'); },420); })(chips[ci]); } }
      }
    }
  }
}

/* ---- OVERTIME render ---- */
// Tracks OT transitions so sounds/FX fire once per edge. otKey = round+phase, so a new round or a choose->reveal
// flip is a distinct moment. LOCALPICK is reused for the optimistic OT door highlight.
var OTST={key:null,round:0,phase:null,enteredAt:0,lastHb:0,lastCd:null};
function otReset(){ OTST={key:null,round:0,phase:null,enteredAt:0,lastHb:0,lastCd:null}; }
// Leave the OT takeover gracefully: drop the takeover class but hold a short ot-exit fade so the dark-red theme
// eases back to the normal board instead of snapping. Self-clears; no rAF. No-op if OT wasn't active.
var _otExitT=null;
function otExitGraceful(){ var b=document.body; if(!b.classList.contains('ot')){ b.classList.remove('ot-exit'); return; } b.classList.remove('ot'); b.classList.add('ot-exit'); if(_otExitT)clearTimeout(_otExitT); _otExitT=setTimeout(function(){ document.body.classList.remove('ot-exit'); _otExitT=null; },620); }
function renderOT(s){
  var ot=s.ot, me=s.me||{}, now=Date.now();
  var rm=matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.body.classList.add('ot'); document.body.classList.remove('deep');
  var potEl=$('#pot'); if(potEl)potEl.style.display='none';
  var key=ot.round+':'+ot.phase;
  var newPhase=(OTST.key!==key);
  if(OTST.key===null){ // first frame of overtime
    if(SND){ try{stopAmbient();otDroneStart();}catch(e){} }
    flash('red'); shake();
  }
  // optimistic pick reset when a new OT round's choose begins
  if(newPhase && ot.phase==='choose'){ LOCALPICK=null; }
  var mypick = me.pick;
  if(LOCALPICK && ot.phase==='choose'){ if(me.pick===LOCALPICK.i){ LOCALPICK=null; } else if(now-LOCALPICK.ts<2500){ mypick=LOCALPICK.i; } else { LOCALPICK=null; } }

  // doors
  var revealing = ot.phase==='reveal' && ot.reveal;
  var doorsHtml='';
  for(var i=0;i<(ot.doors||2);i++){
    var cls='otdoor', lbl='';
    if(ot.phase==='choose'){ if(me.alive&&mypick===i){ cls+=' pick'; lbl=T('ot.your_door'); } }
    else if(revealing){ if(ot.reveal.bust===i){ cls+=' bust'; lbl=T('ot.caught',{n:ot.reveal.busted}); } else { cls+=' safe'; lbl=T('ot.clear'); } }
    if(!(me.alive&&ot.phase==='choose')) cls+=' dead';
    doorsHtml+='<div class="'+cls+'" data-otr="'+i+'"><div class="otn">'+T('door.n',{n:(i+1)})+'</div><div class="otl">'+lbl+'</div></div>';
  }
  // finalists
  var fin=(ot.finalists||[]).map(function(f){ return '<div class="otfin'+(f.you?' me':'')+'">'+avatar(f.name)+'<div class="fn">'+esc(f.name)+(f.you?T('ot.you_suffix'):'')+'</div></div>'; }).join('');
  // clock + heartbeat (choose only)
  var cd=ot.countdown!=null?ot.countdown:0;
  var urg=(ot.phase==='choose'&&cd<=3)?' urg':'';
  var hbWin=Math.max(1,Math.round((ot.chooseMs||8000)/1000));
  var hb=(ot.phase==='choose')?Math.max(.42, .42+(cd/hbWin)*.9).toFixed(2):'1';   // quickens as the clock runs down
  var clockBlock = ot.phase==='choose'
    ? '<div class="otheart" style="--hb:'+hb+'s">🫀</div><div class="otclock'+urg+'">'+cd+'</div>'
    : (revealing ? '' : '<div class="otclock">…</div>');
  // headline / spotlight line
  var head, spot;
  if(ot.phase==='choose'){
    head=T('ot.sudden_death'); spot = me.alive ? T('ot.pick_prompt') : T('ot.watching');
  } else if(revealing){
    head=T('ot.breach'); spot=T('ot.breach_line',{n:((ot.reveal.bust||0)+1),caught:ot.reveal.busted,survived:ot.reveal.survived});
  } else { head=T('ot.sudden_death'); spot=T('ot.resetting'); }

  // REVEAL-ONLY crowd distribution for OT (same guard as normal: revealCounts is sent only in the OT reveal payload)
  var otDistrib=(revealing && ot.reveal.revealCounts)
    ? distribBarsHTML(null, ot.reveal.revealCounts, ot.reveal.bust, ot.doors) : '';
  var body='<div class="otwrap">'
    +spectatingBadge(s)
    +'<div class="otbanner">'+head+'</div>'
    +'<div class="otsub">'+T('ot.subtitle')+'</div>'
    +'<div class="otround">'+T('ot.round_left',{round:ot.round,count:ot.finalistCount})+'</div>'
    +'<div class="otfinalists">'+fin+'</div>'
    + clockBlock
    +'<div class="otdoors">'+doorsHtml+'</div>'
    + otDistrib
    +'<div class="otspot">'+esc(spot)+'</div>'
    +'</div>';

  // preserve chat input across re-render (OT has no chat dock, but keep the pattern safe)
  $('#app').innerHTML=body;
  // wire door clicks (choose + alive only)
  if(me.alive && ot.phase==='choose'){
    document.querySelectorAll('.otdoor[data-otr]').forEach(function(d){ if(d.classList.contains('dead'))return; d.onclick=function(){ otPick(+d.getAttribute('data-otr')); }; });
  }
  // --- sound/FX edges ---
  if(newPhase){
    if(ot.phase==='choose'){ sysline(T('ot.sysline_sudden',{round:ot.round,count:ot.finalistCount})); OTST.lastHb=0; }
    if(revealing){
      var mineBust = me.inGame && !me.alive;   // if the requester just got caught, make it punchy
      if(SND)otBust();
      flash('red'); shake(); alarmSweep();
      tcard(T('ot.tcard_caught',{n:ot.reveal.busted}),T('door.n',{n:((ot.reveal.bust||0)+1)}));
      sysline(T('ot.sysline_blown',{n:((ot.reveal.bust||0)+1),caught:ot.reveal.busted,survived:ot.reveal.survived}));
    }
  }
  // heartbeat cadence during choose: a self-scheduling timer (independent of the 1s poll) so the thumps actually
  // quicken between polls. Interval is recomputed each beat from the live countdown held on OTST.
  OTST.hbIntense=(cd<=3);
  if(ot.phase==='choose' && SND){ startOtHeartLoop(); } else { stopOtHeartLoop(); }
  // big tick sound on the last 3 seconds
  if(ot.phase==='choose' && cd<=3 && cd>=1 && OTST.lastCd!==cd){ if(SND)beep(520+(3-cd)*120,.1,.07,'square'); if(!rm)bignum(cd); }
  OTST.lastCd=(ot.phase==='choose')?cd:null;
  OTST.key=key; OTST.round=ot.round; OTST.phase=ot.phase;
}
function otPick(i){
  var s=LASTS; if(!s||!s.ot||s.ot.phase!=='choose'||!(s.me&&s.me.alive))return;
  LOCALPICK={i:i,ts:Date.now()};

  api('pick',{token:TOKEN,route:i}).catch(function(){});

  document.querySelectorAll('.otdoor[data-otr]').forEach(function(d){ d.classList.toggle('pick', +d.getAttribute('data-otr')===i); });

/* ---- PRACTICE (FREE) client-driven training simulation ---------------------------------------------------
   A one-click, free heist against bots with a FAKE pot. No wallet, no buy-in, no escrow, no on-chain anything,
   and NO server game endpoint is ever called, so a practice player is structurally isolated from the live
   fill/rmfill rounds because practice runs entirely in the browser. It reuses the EXACT live rules (fetched
   once from GET api/practice/config, which is display-only): doors scale with the field (routesFor), the
   MOST-CROWDED door busts with a low-index tie-break, the crowd stays HIDDEN during the pick window, the field
   narrows each chamber, and if more than one robber survives all chambers it goes to real sudden-death OVERTIME
   (low door count -> converges to one). Outcomes use Math.random here (this is a toy, nothing is at stake and
   nothing is verified), but every RULE matches the server so the lesson transfers. When the heist ends we show a
   prominent "Play for real" CTA (the onboarding funnel) plus "Practice again". ---- */
var PRAC=null;        // active practice game state (null when not practicing)
var PRAC_CFG=null;    // cached rules from api/practice/config
var PRAC_TIMER=null;

function pracRoutesFor(n){ var t=(PRAC_CFG&&PRAC_CFG.routeThresholds)||[5,12,24]; return n>t[2]?5:n>t[1]?4:n>t[0]?3:2; }
function pracEnd(){ if(PRAC_TIMER){ clearTimeout(PRAC_TIMER); PRAC_TIMER=null; } PRAC=null; pracLobbyClear(); document.body.classList.remove('ot','deep'); try{normTensionStop();stopOtHeartLoop();otDroneStop();if(SND)startAmbient();}catch(e){} otReset(); if(window.VS_FREE_ONLY){ startPractice(); } else { poll(); } }
// Load rules once, then start a fresh practice heist from the FILLING LOBBY (fake robbers piling in, pot growing,
// the fuse lighting) which hands off into the chambers -> overtime -> ceremony. Full client-only simulated arc.
function startPractice(){

  var go=function(){ pracLobbyStart(); };

         ot:false, otRound:0, otDoors:Math.max(2,cfg.otDoors||2), otBust:null, otCaught:0, otSurv:0,
         pot:(cfg.fakePot|| (50*(cfg.entryUsd||10))), chooseMs:9000, revealMs:3500, otChooseMs:8000, otRevealMs:3500,

function pracAlive(){ return PRAC.players.filter(function(p){return p.alive;}); }
// Resolve a scheduled chamber with the SAME rules as the server resolve(): absent picks fall to a random door,
// most-crowded busts (low-index tie-break), force-one-if-none, spare-one-if-all-caught. Fake random is fine here.
function pracResolveChamber(){
  var av=pracAlive(), doors=PRAC.routes.length;
  av.forEach(function(p){ if(p.pick==null||p.pick>=doors){ if(p.bot){ p.pick=Math.floor(Math.random()*doors); } else { p.pick=Math.floor(Math.random()*doors); } } });
  var cnt=new Array(doors).fill(0); av.forEach(function(p){ cnt[p.pick]++; });
  var mx=0; for(var i=1;i<doors;i++){ if(cnt[i]>cnt[mx]) mx=i; }
  var caught=av.filter(function(p){return p.pick===mx;}), n=caught.length;
  if(n===0 && av.length>1){ caught=[av[Math.floor(Math.random()*av.length)]]; n=1; }         // force one
  if(n>0 && caught.length===av.length){ caught.pop(); n--; }                                  // spare one (never wipe field)
  caught.forEach(function(p){ p.alive=false; });

// Bots pick during the choose window, leaning slightly toward the LEAST crowded door (same spirit as botPicks()).
function pracBotPicks(){
  var av=pracAlive(), doors=PRAC.routes.length, cnt=new Array(doors).fill(0);
  av.forEach(function(p){ if(p.pick!=null&&p.pick<doors) cnt[p.pick]++; });
  var cold=0; for(var i=1;i<doors;i++){ if(cnt[i]<cnt[cold]) cold=i; }
  av.forEach(function(p){ if(p.bot && (p.pick==null || Math.random()<0.3)){ p.pick = (Math.random()<0.4)?cold:Math.floor(Math.random()*doors); } });

// Sudden-death OT round: identical rails, low door count, convergence to a single champion.
function pracResolveOT(){
  var av=pracAlive(), OT=PRAC.otDoors, cnt=new Array(OT).fill(0);
  av.forEach(function(p){ if(p.pick==null||p.pick>=OT) p.pick=Math.floor(Math.random()*OT); cnt[p.pick]++; });
  var mx=0; for(var i=1;i<OT;i++){ if(cnt[i]>cnt[mx]) mx=i; }
  var caught=av.filter(function(p){return p.pick===mx;});
  if(caught.length===av.length){ caught.pop(); }                 // spare one
  if(caught.length===0){ caught=[av[Math.floor(Math.random()*av.length)]]; }   // force one
  caught.forEach(function(p){ p.alive=false; });

// The practice loop: a timed intro -> per-chamber choose/reveal -> overtime (if >1 left) -> ended. Self-driven.
function pracLoop(){
  if(!PRAC) return;
  var now=Date.now();
  if(now < PRAC.phaseEnds){ pracRender(); PRAC_TIMER=setTimeout(pracLoop, 120); return; }
  // advance phase
  if(PRAC.phase==='intro'){ pracEnterChamber(0); }
  else if(PRAC.phase==='choose'){
    pracBotPicks(); pracResolveChamber(); PRAC.phase='reveal'; PRAC.phaseEnds=now+PRAC.revealMs;
  }
  else if(PRAC.phase==='reveal'){
    if(!PRAC.you.alive){ PRAC.done=true; PRAC.phase='ended'; }                 // player busted -> end (watch-to-the-end kept short)
    else if(pracAlive().length<=1){ PRAC.done=true; PRAC.champ=pracAlive()[0]||null; PRAC.phase='ended'; }
    else if(PRAC.chamber>=PRAC.maxch-1){ PRAC.ot=true; PRAC.otRound=0; pracEnterOT(); }
    else { pracEnterChamber(PRAC.chamber+1); }
  }
  else if(PRAC.phase==='otchoose'){
    pracOTBotPicks(); pracResolveOT(); PRAC.phase='otreveal'; PRAC.phaseEnds=now+PRAC.otRevealMs;
  }
  else if(PRAC.phase==='otreveal'){
    if(pracAlive().length<=1 || !PRAC.you.alive){ PRAC.done=true; PRAC.champ=pracAlive()[0]||null; PRAC.phase='ended'; }
    else { PRAC.otRound++; pracEnterOT(); }

function pracEnterChamber(c){ PRAC.chamber=c; PRAC.routes=(PRAC_CFG&&PRAC_CFG.rooms?PRAC_CFG.rooms:R).slice(0,pracRoutesFor(pracAlive().length)); PRAC.players.forEach(function(p){ p.pick=null; }); LOCALPICK=null; PRAC.busted=null; PRAC.bustN=0; PRAC.phase='choose'; PRAC.phaseEnds=Date.now()+PRAC.chooseMs; }
function pracEnterOT(){ PRAC.otBust=null; PRAC.otCaught=0; PRAC.players.forEach(function(p){ p.pick=null; }); LOCALPICK=null; PRAC.routes=(PRAC_CFG&&PRAC_CFG.rooms?PRAC_CFG.rooms:R).slice(0,PRAC.otDoors); PRAC.phase='otchoose'; PRAC.phaseEnds=Date.now()+PRAC.otChooseMs; }

/* ======================================================================================================
   PRACTICE LOBBY (the FRONT of a Practice session): a client-only, end-to-end SIMULATION of a whole heist so the
   full arc can be played solo. It runs a simulated FILLING lobby in front of the practice chamber engine: seats
   climb 0 -> threshold -> toward full as fake robbers buy in, the pot grows, the fuse lights, then "THE HEIST IS
   ON" hands off into the chamber UI (PRAC owns chambers/overtime/ceremony, rules identical to the server). The
   lobby touches NO escrow / buy-in / chain path and makes NO server call (no /api/join, /api/pick, no on-chain
   anything) -- the same isolation discipline the chamber sim already uses. This is reached ONLY from the Practice
   button; there is no mode toggle. ====================================================================================== */
var PLOBBY={on:false, timer:null, seats:0, target:0, threshold:0, cap:0, entryUsd:10, pot:0, rate:0, joined:false, startedAt:0};
var PLOBBY_FAKES=null;   // last server-shaped fill state, so the practice-lobby buy pop-out can reuse the module verbatim
function pracLobbyClear(){ if(PLOBBY.timer){ clearTimeout(PLOBBY.timer); PLOBBY.timer=null; } PLOBBY.on=false; PLOBBY.stage=null; PLOBBY_FAKES=null; var hb=$('#hdrbuy'); if(hb) hb.style.display='none'; }
// Begin (or restart) a full practice heist from the filling lobby. No wallet, no chain, no server call.
function pracLobbyStart(){
  closeSheet(); var mp=document.querySelector('.menupop'); if(mp) mp.remove();
  if(PLOBBY.timer){ clearTimeout(PLOBBY.timer); PLOBBY.timer=null; }
  if(PRAC){ if(PRAC_TIMER){ clearTimeout(PRAC_TIMER); PRAC_TIMER=null; } PRAC=null; }
  document.body.classList.remove('ot','deep'); try{ normTensionStop(); }catch(e){}
  // a believable lobby shape (mirrors the server econ: ~$10 entry, a threshold to light the fuse, a round target).
  PLOBBY.on=true; PLOBBY.stage='fill'; PLOBBY.entryUsd=(ENTRY_USD||10);
  PLOBBY.threshold=12; PLOBBY.target=50; PLOBBY.cap=10; PLOBBY.seats=0; PLOBBY.pot=0; PLOBBY.rate=0; PLOBBY.joined=false; PLOBBY.startedAt=Date.now();
  PLOBBY.graceMs=0; PLOBBY.graceEnds=0; PLOBBY.lit=false;
  // ensure practice rules are loaded for the chamber hand-off; then run the fill loop.
  var go=function(){ pracLobbyLoop(); };
  if(PRAC_CFG){ go(); } else { fetch('api/practice/config').then(function(r){return r.json();}).then(function(c){ PRAC_CFG=c||{}; go(); }).catch(function(){ PRAC_CFG={}; go(); }); }
}
// FILL loop: climb seats toward the target with a lively, slightly random cadence, grow the pot, and once the
// threshold is crossed light the fuse (a short grace countdown) before launching into the chambers.
function pracLobbyLoop(){
  if(!PLOBBY.on || PLOBBY.stage!=='fill') return;
  var now=Date.now();
  // add a burst of robbers every tick (faster early, easing as it fills), capped at the target.
  if(!PLOBBY.lit){
    var add=Math.max(1, Math.round(1+Math.random()*3));
    PLOBBY.seats=Math.min(PLOBBY.target, PLOBBY.seats+add);
    PLOBBY.pot += add*PLOBBY.entryUsd*100;             // ~100 RVLT per $ of entry, purely cosmetic
    PLOBBY.rate=20+Math.floor(Math.random()*26);
    // drop a lively buy-in line into the ticker so the lobby reads like a real crowd
    pushTicker(T('plobby.bought_in',{pot:fmtK(PLOBBY.pot)+' RVLT'}));
    if(PLOBBY.seats>=PLOBBY.threshold && !PLOBBY.lit){ PLOBBY.lit=true; PLOBBY.graceMs=5200; PLOBBY.graceEnds=now+PLOBBY.graceMs;
      if(SND){ try{ fuseAlarm(); }catch(e){} } flash('red'); tcard(T('plobby.fuse_lit_t'),T('plobby.fuse_lit_s')); }
    pracLobbyRender();
    PLOBBY.timer=setTimeout(pracLobbyLoop, PLOBBY.lit?500:(280+Math.random()*260));
    return;
  }
  // fuse lit: keep a few late robbers trickling in while the grace burns down, then launch.
  if(now < PLOBBY.graceEnds){
    if(PLOBBY.seats<PLOBBY.target && Math.random()<0.5){ var a2=1+Math.floor(Math.random()*2); PLOBBY.seats=Math.min(PLOBBY.target,PLOBBY.seats+a2); PLOBBY.pot+=a2*PLOBBY.entryUsd*100; pushTicker(T('plobby.bought_in',{pot:fmtK(PLOBBY.pot)+' RVLT'})); }
    pracLobbyRender();
    PLOBBY.timer=setTimeout(pracLobbyLoop, 520);
    return;
  }
  // THE HEIST IS ON: hand the simulation to the practice chamber engine for chambers / overtime / ceremony.
  pracLobbyLaunchChambers();
}
// Build a server-shaped state so we can reuse the CONSOLIDATED fill module verbatim, then render it. No real
// escrow object is ever truthy here (escrow.on reads from a fabricated, clearly-fake block) so no live path runs.
function pracLobbyRender(){
  if(!PLOBBY.on || PLOBBY.stage!=='fill') return;
  var graceIn = PLOBBY.lit ? Math.max(0, PLOBBY.graceEnds-Date.now()) : null;
  var winChance = PLOBBY.seats>0 ? (1/PLOBBY.seats) : null;
  var fakeS={
    pot:PLOBBY.pot, total:PLOBBY.seats, nextGameIn:0,
    // a FAKE escrow block: on+buyOpen so the module shows a live-looking "Buy in" CTA, but every click is routed to
    // the practice-lobby join handler below (never openSheet / never a chain call).
    escrow:{on:true, buyOpen:true, live:false, entry:'0', id:'practice'},
    econ:{entryUsd:PLOBBY.entryUsd, roundTarget:PLOBBY.target, walletCap:PLOBBY.cap},
    fill:{ state:(PLOBBY.lit?'locking':'filling'), seats:PLOBBY.seats, ticketsSold:PLOBBY.seats, target:PLOBBY.target,
           threshold:PLOBBY.threshold, cap:PLOBBY.cap, graceIn:graceIn, graceMax:PLOBBY.graceMs, graceNow:graceIn,
           lobby:{ seatsToThreshold:Math.max(0,PLOBBY.threshold-PLOBBY.seats), velocity:{rate:PLOBBY.rate, fast:PLOBBY.rate>=30},
                   odds:{ winChance:winChance, myWinChance:(PLOBBY.joined&&PLOBBY.seats>0)?(1/PLOBBY.seats):null, myTickets:(PLOBBY.joined?1:0),
                          potAfterRake:Math.round(PLOBBY.pot*0.95) } } }
  };
  // ESC.on is read by fillPanel for the holder badge path only; keep the lobby module clean (no badge) via the
  // module's own onchain check which reads fakeS.escrow, not the global ESC. Render the consolidated module + feed.
  var statusHead='<div class="cstat"><span class="cs-l">'+T('plobby.practice_heist')+'</span><span class="cs-r" id="plobbyStat">'+T('plobby.in_pot',{n:PLOBBY.seats,pot:fmtK(PLOBBY.pot)+' RVLT'})+'</span></div>';
  // STABLE FILL: rebuild the module only when its SHAPE changes (lit/joined/grace-second). On a plain seat/pot
  // tick, patch the module's numbers + the status line + the feed in place, so the lobby doesn't flash each tick.
  var graceSec=(graceIn!=null)?Math.ceil(graceIn/1000):-1;
  var dSig='P|'+(PLOBBY.lit?1:0)+'|'+(PLOBBY.joined?1:0)+'|g'+graceSec;
  var dMount=document.querySelector('.stack[data-plobbysig]');
  if(dMount && dMount.getAttribute('data-plobbysig')===dSig && $('#msgs')){
    var ds=$('#plobbyStat'); if(ds) ds.textContent=T('plobby.in_pot',{n:PLOBBY.seats,pot:fmtK(PLOBBY.pot)+' RVLT'});
    try{ pracLobbyPatchFill(fakeS); }catch(e){}
    pracLobbyPaintFeed();
    pracBadge();
    return;
  }
  PLOBBY_FAKES=fakeS;   // stash so the lobby buy pop-out can reuse the same module verbatim (no chain, no server)
  var module=fillPanel(fakeS, true);
  $('#app').innerHTML='<div class="stack" data-plobbysig="'+dSig+'">'+module+'<div class="chat tall">'+statusHead+'<div class="msgs pracfeed" id="msgs"></div></div></div>';
  // repaint a simulated crowd feed into the chat column so the lobby has chatter even with no server.
  pracLobbyPaintFeed();
  // the slim body strip's link opens the lobby buy pop-out (fake-chip view); the header Buy button mirrors it.
  var fso=$('#fsopen'); if(fso) fso.onclick=pracLobbyOpenPopout;
  pracLobbyPaintHeaderBuy(fakeS);
  pracBadge();
}

/* ---- round-end ceremony (win payout / loss reframing / void refund) ----
   Reads the REAL economics straight from s.ended (server-computed from the on-chain pot + rake snapshot). It does
   NOT compute money itself and does NOT call settle/claim/refund directly: the Collect and Refund buttons wire to
   the existing collectWin()/refundRound() wrappers, which in turn hit the same claim/refund paths as the menu. */
var LASTS=null, LASTBREACH=null;
function depthPips(n, max){ var o=''; for(var i=0;i<max;i++){ o+='<div class="dp'+(i<n?' on':'')+'"></div>'; } return o; }
function ceremonyHTML(s){
  var e=s.ended; if(!e) return '';
  var practice = !e.realMoney;   // fake-chip / practice win: celebrate, but nothing to collect
  if(e.kind==='win'){
    // payout rows: only show rake/take when the server knew the rake rate (rakeBps != null); otherwise pot-only.
    var rows='<div class="prow"><span class="pl">'+T('cerem.pot')+'</span><span class="pv">'+fmtK(e.pot)+' RVLT</span></div>';
    if(e.rake!=null){ rows+='<div class="prow"><span class="pl">'+T('cerem.rake',{pct:((e.rakeBps/100)||0)})+'</span><span class="pv">'+fmtK(Math.round(e.rake))+' RVLT</span></div>'; }
    var takeVal = (e.take!=null) ? e.take : (e.payout!=null ? e.payout : e.pot);
    rows+='<div class="prow take"><span class="pl">'+T('cerem.you_take')+'</span><span class="pv">'+fmtK(Math.round(takeVal))+' RVLT</span></div>';
    var cta = practice
      ? '<p class="nudge">'+T('cerem.prac_win_note')+'</p><button class="btn p" id="cwreal" style="width:100%;max-width:360px;margin:12px auto 0;display:block;padding:14px;font-size:18px">'+T('cerem.play_real')+'</button>'
      : '<button class="btn g collect" id="collectbtn">'+T('cerem.collect',{amt:fmtK(Math.round(takeVal))+' RVLT'})+'</button><p class="nudge">'+T('cerem.collect_note')+'</p>';
    return '<div class="cerem win"><div class="goldflash"></div>'
      +'<div class="trophy">🏆</div>'
      +'<div class="ctitle">'+T('cerem.win_title')+'</div>'
      +'<div class="payout">'+rows+'</div>'
      +cta
      +streakLine()
      +'<button class="btn" id="cwshare" style="width:100%;max-width:360px;margin:9px auto 0;display:block">'+T('cerem.share_win')+'</button>'
      +verifyLink(e.roundId)
      +'</div>';
  }
  if(e.kind==='void'){
    var vcta = practice ? '' : '<button class="btn p refund" id="refundbtn">'+T('cerem.refund')+'</button><p class="nudge">'+T('cerem.refund_note')+'</p>';
    return '<div class="cerem void">'
      +'<div class="ctitle">'+T('cerem.void_title')+'</div>'
      +'<div class="csub">'+T('cerem.void_sub')+'</div>'
      +vcta
      +streakLine()
      +verifyLink(e.roundId)
      +'</div>';
  }
  // LOSS (local player had a ticket and busted). Reframe: why + how far + near-miss + back next heist.
  var cracked = e.chambersCracked||0, max=e.maxChambers||6;
  var deep = e.wasOvertime || cracked>=5;      // a deep run (chamber 5+ or overtime) = a near-miss with flourish
  var why = LASTBREACH ? T('cerem.loss_why_door',{door:esc(LASTBREACH.door)}) : T('cerem.loss_why_generic');
  var title = deep ? T('cerem.so_close') : T('cerem.busted');
  var sub = e.wasOvertime
    ? T('cerem.loss_ot')
    : (deep ? T('cerem.loss_deep',{n:cracked,max:max}) : T('cerem.loss_plain',{n:cracked,max:max}));
  var buyCta = (ESC.on && s.escrow && s.escrow.on)
    ? '<button class="btn p" id="lossbuy">'+T('cerem.buy_next')+'</button>'
    : '';
  return '<div class="cerem loss'+(deep?' near':'')+'">'
    +(deep?'<div style="font-size:40px;line-height:1">😤</div>':'')
    +'<div class="ctitle">'+title+'</div>'
    +'<div class="csub">'+esc(sub)+'</div>'
    +'<div class="depth">'+depthPips(cracked,max)+'</div>'
    +'<div class="why">'+why+'</div>'
    +'<div class="cbtns">'+buyCta+'<button class="btn" id="losspractice">'+T('cerem.practice')+'</button></div>'
    +'<p class="nudge">'+T('cerem.queued')+'</p>'
    +streakLine()
    +verifyLink(e.roundId)
    +'</div>';
}
// Wire the ceremony buttons after the ended screen paints. Idempotent: called every render, re-binds live nodes.
function wireCeremony(s){
  var e=s&&s.ended; if(!e) return;
  var cb=$('#collectbtn'); if(cb) cb.onclick=function(){ collectWin(cb); };
  var rb=$('#refundbtn'); if(rb) rb.onclick=function(){ refundRound(e.roundId, rb); };
  var sh=$('#cwshare'); if(sh) sh.onclick=function(){ var txt=T('share.win_text',{link:location.origin+location.pathname}); try{navigator.clipboard.writeText(txt);}catch(e){} toast(T('share.flex')); };
  var pr=$('#cwreal'); if(pr) pr.onclick=function(){ if(ESC.on && LASTS && LASTS.escrow && LASTS.escrow.on){ openSheet(T('buy.title'), buyDock(LASTS), function(){ wireBuySheet(); }); } else { toast(T('toast.real_launch')); } };
  var lb=$('#lossbuy'); if(lb) lb.onclick=function(){ openSheet(T('buy.title'), buyDock(LASTS), function(){ wireBuySheet(); }); };
  var lp=$('#losspractice'); if(lp) lp.onclick=startPractice;
}

/* ---- render ---- */
function render(s){
  // While a practice heist is running (lobby fill or chambers), the client simulation owns the screen, so ignore
  // live-state renders: the real round can never paint over the sim (and the sim never touches the real round).
  if(pracActive()){ LASTS=s; return; }
  pracBadgeHide();
  LASTS=s;
  // LIVE SUDDEN-DEATH OVERTIME takes over the whole screen (distinct, darker, red/gold). Clears on any other phase.
  if(s.ot){ try{ normTensionStop(); }catch(e){} try{ renderOT(s); }catch(e){ if(window.console)console.warn('ot',e); } prev={phase:'overtime',chamber:null,blind:false,alive:s.alive,lockIn:s.lockIn,pot:s.pot,ot:true}; return; }
  if(prev.ot){ otExitGraceful(); try{stopOtHeartLoop(); otDroneStop(); if(SND)startAmbient();}catch(e){} otReset(); }
  try{ updateEscBar(s); }catch(e){}
  var potEl=$('#pot'); if(potEl){ potEl.style.display='inline-block'; potEl.textContent='🔥 '+fmtK(s.pot)+' RVLT'; if(s.pot>(prev.pot||0)){ potEl.classList.remove('bump'); void potEl.offsetWidth; potEl.classList.add('bump'); } }
  // FUSE-LIT MOMENT + ARMING MASK (client theater; neither changes any on-chain timing):
  //  * fuse arms the instant the server starts reporting a grace countdown (threshold crossed) -> loud stinger.
  //  * 'locking' is the brief lockRound->commit gap -> a dramatic SEALING THE VAULT mask so the gap reads as theater.
  //    The mask is purely keyed off the phase the server already reports; it clears the moment play begins.
  (function(){
    var fl=inFill(s)?fillInfo(s):null;
    var fuseNow=!!(fl && fl.locking);
    if(fuseNow && !_fuseArmed){
      _fuseArmed=true;
      if(SND){ try{ fuseAlarm(); }catch(e){} }
      flash('red'); tcard(T('tcard.heist_on'),T('tcard.fuse_lit'));
    } else if(!fuseNow && _fuseArmed && s.phase!=='locking'){ _fuseArmed=false; }
    // SEALING mask only during the explicit on-chain locking gap (rmfill 'locking'); drop it the instant play starts.
    if(s.phase==='locking'){ showSealMask(); }
    else { hideSealMask(); }
  })();
  var dropped = prev.alive!=null && s.alive<prev.alive && s.phase==='reveal';
  if(s.phase==='choose' && s.lockIn!==prev.lockIn && s.lockIn>=1 && s.lockIn<=3) bignum(s.lockIn);
  var rmot=matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(s.phase!==prev.phase || s.chamber!==prev.chamber){
    if(s.phase==='choose' && s.chamber!==prev.chamber){
      // CINEMATIC CHOOSE: the heist descends into the next chamber. Start the OT-grade tension bed (low drone +
      // quickening heartbeat) for the whole pick window, so every chamber carries the same suspense overtime has.
      if(prev.chamber!=null) tcard(T('tcard.chamber',{n:(s.chamber+1)}), T('tcard.robbers_left',{n:s.alive}));
      sysline(T('sys.chamber',{n:(s.chamber+1)}));
      normTensionStart(s.lockIn);
    }
    if(s.phase==='reveal' && s.reveal){
      // BREACH: the big moment. Tear down the tension bed and fire the SAME descending breach stinger overtime
      // uses (otBust), plus the red flash / shake / alarm-sweep / "N CAUGHT" card. The busted door highlights via
      // .bust and survivors via .safe (door render). Punchier than the old flat alarm, same reveal timer.
      normTensionStop();
      // remember the breach that caught players this chamber so the ENDED ceremony can say WHY you busted
      // ("North Wing was packed, you were on it") even after reveal rolls into the ended phase.

    document.body.appendChild(el);
    var pr=el.querySelector('#lgPrac'); if(pr) pr.onclick=function(){ el.style.display='none'; try{ doMenu('practice'); }catch(e){} };
  }
  el.style.display='flex'; el._atMs=Number(L.atMs);
  var mintEl=el.querySelector('#lgMint');
  if(mintEl){ mintEl.textContent=(L.mint && L.mint.minted!=null)
    ? T('lg.minted',{minted:L.mint.minted,max:L.mint.max})
    : T('lg.mint_fallback'); }
  function tick(){
    var e2=document.getElementById('launchGate'); if(!e2){ if(_lgTimer){clearInterval(_lgTimer);_lgTimer=null;} return; }
    var ms=Math.max(0, (e2._atMs||0)-Date.now()), t=Math.floor(ms/1000);
    var d=Math.floor(t/86400), h=Math.floor(t%86400/3600), m=Math.floor(t%3600/60), ss=t%60;
    var c=e2.querySelector('#lgCount'); if(c) c.textContent=[d,h,m,ss].map(function(n){return (n<10?'0':'')+n;}).join(' : ');
  }
  tick(); if(!_lgTimer) _lgTimer=setInterval(tick,1000);
}

function paintAwayPill(s){

/* ---- real-time push (WebSocket) with poll fallback ----
   WS rides the SAME origin/port the page is served from, under the artifact's /pub/main/vaultstandoff-dev/ path
   (built from location so it inherits wss: on https and the proxy prefix). The viewer token is sent in the
   {type:'hello'} message after onopen (never on the query string); the vs_gate cookie rides the upgrade automatically.
   When the socket is healthy we DROP the hot 1s poll to a slow 10s safety-net heartbeat; on any close/error we
   immediately restore the full 1s poll and keep retrying the socket with capped backoff. If WS never works, the
   experience is exactly the legacy 1s poll - nothing breaks. */
var WS=null, WS_OK=false, WS_RETRY=0, POLL_TIMER=null, _wsLastMsg=0, _wsTok=null;
// M-1: the viewer token is NO LONGER in the WS URL (it would leak into proxy/access logs). The upgrade carries
// the vs_gate cookie automatically (that's what authenticates the socket); the per-viewer token is sent as the
// first {type:'hello'} message after onopen, and re-sent on every reconnect.
function wsUrl(){ var base=location.pathname.replace(/\/[^/]*$/,''); var proto=location.protocol==='https:'?'wss:':'ws:'; return proto+'//'+location.host+base+'/socket'; }
function setPollCadence(ms){ if(POLL_TIMER)clearInterval(POLL_TIMER); POLL_TIMER=setInterval(function(){ if(!TOKEN)return; // safety net: if WS went quiet for >8s even while "open", poll anyway
    if(WS_OK && (Date.now()-_wsLastMsg)<8000) return; poll(); }, ms); }
function connectWS(){
  if(!TOKEN){ setTimeout(connectWS,500); return; }
  _wsTok=TOKEN;
  try{ WS=new WebSocket(wsUrl()); }catch(e){ WS=null; scheduleWSRetry(); return; }
  WS.onopen=function(){ WS_OK=true; WS_RETRY=0; _wsLastMsg=Date.now(); try{WS.send(JSON.stringify({type:'hello', token: TOKEN}));}catch(e){} setPollCadence(10000); };
  WS.onmessage=function(ev){ _wsLastMsg=Date.now(); var m=null; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m&&m.type==='state'&&m.state){ applyState(m.state); }
    /* {type:'tick'} is a lightweight keepalive/countdown nudge; the client already self-animates timers from the
       last snapshot via its own heartbeats, so a tick just refreshes liveness - no re-render needed. */ };
  WS.onclose=function(){ WS_OK=false; WS=null; setPollCadence(1000); scheduleWSRetry(); };
  WS.onerror=function(){ try{WS&&WS.close();}catch(e){} };
}
function scheduleWSRetry(){ WS_RETRY=Math.min(WS_RETRY+1,6); var delay=Math.min(1000*Math.pow(2,WS_RETRY-1),30000); setTimeout(connectWS,delay); }
// If the viewer identity changes after the socket opened (guest -> wallet, name/token swap), the per-viewer
// fields (me / mine / you) would be stale, so reconnect the WS under the new token. Cheap drift check each 2s.
setInterval(function(){ if(WS_OK && WS && _wsTok!==TOKEN){ try{WS.close();}catch(e){} } },2000);
// Start on the resilient 1s poll immediately (works with or without WS), then upgrade to the push layer.
setPollCadence(1000);
connectWS();

/* ---- boot ---- */
// ambient drifting embers behind everything
(function(){ var a=document.getElementById('amb'); if(!a)return; for(var i=0;i<20;i++){ var d=document.createElement('span'); d.className='d'; var sz=3+Math.random()*4; d.style.width=sz+'px'; d.style.height=sz+'px'; d.style.left=(Math.random()*100)+'%'; var dur=9+Math.random()*11; d.style.animationDuration=dur+'s'; d.style.animationDelay=(-Math.random()*dur)+'s'; d.style.opacity=(0.15+Math.random()*0.35); a.appendChild(d); } })();
/* ⋯ menu merged into the wallet dropdown (connClick); the standalone #menu button was removed. */
(function(){ var hb=document.getElementById('hdrbuy'); if(hb) hb.onclick=function(){ if(PLOBBY.on){ if(PLOBBY_FAKES) pracLobbyOpenPopout(); return; } if(!LASTS){ return; } if(inFill(LASTS)){ openFillPopout(); } else if(ESC.on&&LASTS.escrow&&LASTS.escrow.on){ openSheet(T('buy.title'), buyDock(LASTS), function(){ wireBuySheet(); }); } else { toast(T('toast.buyin_launch')); } }; })();
(function(){ var bb=document.getElementById('buybtn'); if(bb) bb.onclick=function(){ if(!LASTS)return; if(!(ESC.on&&LASTS.escrow&&LASTS.escrow.on)){ toast(T('toast.buyin_launch')); return; } openSheet(T('buy.title'), buyDock(LASTS), function(){ wireBuySheet(); }); }; })();
function wireBuySheet(){
  var m=$('#bxm'),p=$('#bxp'),g=$('#bxgo'), s=LASTS, onchain=ESC.on&&s&&s.escrow&&s.escrow.on&&s.escrow.buyOpen;
  function paintPrice(){ var px=$('#bxpx'); if(px)px.innerHTML=pricePill(TICKETS); var bd=$('#bxbadge'); if(bd)bd.innerHTML=holderBadge(); if(onchain&&g){ g.textContent=((s.escrow&&s.escrow.live)?T('buy.buy_next_total',{total:totalLabel(TICKETS)}):T('buy.buy_in_total',{total:totalLabel(TICKETS)})); } }
  function refresh(){ var n=$('#bxn'); if(n)n.textContent=TICKETS; paintPrice(); }
  function paintPay(){ document.querySelectorAll('.payopt').forEach(function(b){ b.classList.toggle('p', b.getAttribute('data-k')===PAYSRC); }); }
  document.querySelectorAll('.payopt').forEach(function(b){ b.onclick=function(){ PAYSRC=b.getAttribute('data-k'); paintPay(); }; });
  if(onchain) fetchPricing(TICKETS, paintPrice);
  if(m)m.onclick=function(){ setTix(TICKETS-1); refresh(); if(onchain) fetchPricing(TICKETS, paintPrice); };
  if(p)p.onclick=function(){ setTix(TICKETS+1); refresh(); if(onchain) fetchPricing(TICKETS, paintPrice); };
  if(g)g.onclick=function(){ if(!onchain){ toast(T('buy.opens_next_forms')); return; }
    var st=$('#bxstatus'); function stage(m){ if(st)st.textContent=m; }
    g.disabled=true;
    buySubmit(s.escrow.id,s.escrow.entry,TICKETS,stage).then(function(){ stage(T('stage.youre_in')); setTimeout(closeSheet,700); })
      .catch(function(e){
        // Pre-flight block (nothing spent) and the kept-RVLT net both carry an honest, actionable sentence.
        var msg=(e&&(e.preflight||e.keptRvlt))?e.message:((e&&(e.shortMessage||e.message))||T('toast.buyin_failed'));
        stage(msg); toast(msg);
      })
      .finally(function(){ try{g.disabled=false;}catch(_){ } }); };
}
// desktop: number keys 1-5 pick a door while choosing (ignored when typing)
document.addEventListener('keydown',function(e){ if(!LASTS)return; var ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return; var s=LASTS; if(s.me&&s.me.alive&&s.phase==='choose'&&!s.blind){ var n=parseInt(e.key,10); if(n>=1&&n<=(s.routes||[]).length) pickDoor(n-1); } });
var _cc=$('#conn'); if(_cc) _cc.onclick=connClick;
// No login page: everyone lands straight in the live chat as a guest (spectator). Connect a wallet (top-right)

function boot(){ if(_booting)return; _booting=true; api('join', TOKEN?{token:TOKEN,name:NAME}:{name:'Robber '+Math.floor(1000+Math.random()*8999)}).then(function(r){ _booting=false; TOKEN=r.token; NAME=r.name; try{localStorage.setItem('vs_token',TOKEN);localStorage.setItem('vs_name',NAME);}catch(e){} maybePrimer(); poll(); }).catch(function(){ _booting=false; setTimeout(boot,2500); }); }
// FREE archive boot: no /api/join, no live poll, no wallet. Strip the money/wallet toolbar and drop the player

function freeBoot(){

/* ───────────────────────── VAULT ROBBERS - OWNER / AIRDROP PANEL ─────────────────────────
   Your robbers, each robber's live RVLT stash (loot airdropped to its 6551 TBA), one-click claim,
   the most-loaded-robbers leaderboard, and the "who slipped out with a cut" feed. Reuses the page's
   wallet infra (escProvider/ensureNetwork/ethers). Robbers + RVLT live on Robinhood MAINNET 4663, so
   this panel always targets 4663 regardless of which chain the escrow runs on. Inert (zeros) until the
   escrow is armed via setRobberConfig. */
(function(){
  var ROB_CHAIN=4663, cfg=null, _busy=false;
  var st=document.createElement('style'); st.textContent=
    '#rob-fab{position:fixed;left:12px;bottom:12px;z-index:9000;background:#141008;color:#fbe7b0;border:1px solid var(--gold,#d4af37);'
    +'border-radius:999px;padding:9px 14px;font:700 13px/1 var(--font-head,system-ui),system-ui;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}'
    +'#rob-ov{position:fixed;inset:0;z-index:9001;background:rgba(6,5,3,.92);display:none;overflow:auto;padding:22px 14px 60px}'
    +'#rob-ov.on{display:block}#rob-wrap{max-width:760px;margin:0 auto;color:#efe6d2;font-family:system-ui,\'Hiragino Sans\',\'Yu Gothic\',\'PingFang SC\',\'Microsoft YaHei\',\'Noto Sans CJK SC\',\'Malgun Gothic\',sans-serif;position:relative}'
    +'#rob-ov h2{font-family:var(--font-head,system-ui);font-size:26px;margin:0 0 2px;color:#fbe7b0;letter-spacing:.5px}'
    +'#rob-ov .sub{color:#b9ad92;font-size:13px;margin-bottom:16px}'
    +'#rob-x{position:absolute;top:0;right:2px;font-size:28px;color:#b9ad92;cursor:pointer;line-height:1}'
    +'.rob-banner{background:#2a2110;border:1px solid #5c4a1e;color:#f0d79a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}'
    +'.rob-sec{margin:20px 0 8px;font-weight:800;color:#d4af37;font-size:12px;text-transform:uppercase;letter-spacing:1px}'
    +'.rob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}'
    +'.rob-card{background:#11100b;border:1px solid #2a2619;border-radius:12px;padding:12px}'
    +'.rob-id{font-weight:800;color:#fbe7b0;font-size:15px}.rob-tba{font-size:10px;color:#7d745f;word-break:break-all;margin:3px 0 7px}'
    +'.rob-stash{font-size:18px;font-weight:800;color:#2f8f4e;font-variant-numeric:tabular-nums}.rob-stash.z{color:#6b6350}'
    +'.rob-claim{margin-top:8px;width:100%;background:var(--gold,#d4af37);color:#17130d;border:0;border-radius:8px;padding:8px;font-weight:800;cursor:pointer}'
    +'.rob-claim[disabled]{background:#3a3524;color:#7d745f;cursor:default}'
    +'.rob-row{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px solid #1e1b12;font-size:13px}'
    +'.rob-row b{color:#fbe7b0}.rob-amt{color:#2f8f4e;font-weight:700;font-variant-numeric:tabular-nums}'
    +'.rob-empty{color:#7d745f;font-size:13px;padding:8px 2px}';
  document.head.appendChild(st);
  var fab=document.createElement('div'); fab.id='rob-fab'; fab.setAttribute('data-i18n','rob.fab'); fab.textContent=T('rob.fab');
  var ov=document.createElement('div'); ov.id='rob-ov';
  ov.innerHTML='<div id="rob-wrap"><span id="rob-x">×</span>'
    +'<h2 data-i18n="rob.title">'+T('rob.title')+'</h2><div class="sub" data-i18n="rob.sub">'+T('rob.sub')+'</div>'
    +'<div id="rob-body"><div class="rob-empty">'+T('rob.connect_see')+'</div></div>'
    +'<div class="rob-sec" data-i18n="rob.most_loaded">'+T('rob.most_loaded')+'</div><div id="rob-lb"><div class="rob-empty">'+T('rob.loading')+'</div></div>'
    +'<div class="rob-sec" data-i18n="rob.recent_getaways">'+T('rob.recent_getaways')+'</div><div id="rob-feed"><div class="rob-empty">'+T('rob.loading')+'</div></div>'
    +'</div>';
  document.body.appendChild(fab); document.body.appendChild(ov);
  function $x(id){ return document.getElementById(id); }
  function money(n){ n=Number(n||0); return (n>=1000?Math.round(n).toLocaleString():n.toFixed(n<1?2:0))+' RVLT'; }
  function short(a){ a=String(a||''); return a.slice(0,6)+'…'+a.slice(-4); }
  async function getCfg(){ if(cfg) return cfg; try{ cfg=await (await fetch('api/robbers/config')).json(); }catch(e){ cfg={}; } return cfg; }
  function robberWallet(){ try{ var eip=(typeof escProvider==='function'&&escProvider())||window.ethereum||null; return eip; }catch(e){ return null; } }
  async function connectRobber(){
    var eip=robberWallet();
    if(!eip){ if(typeof toast==='function') toast(T('rob.open_wallet')); throw new Error('no wallet'); }
    var accs=await eip.request({method:'eth_requestAccounts'}); var addr=accs&&accs[0];
    try{ if(typeof ensureNetwork==='function') await ensureNetwork(eip, ROB_CHAIN); }catch(e){}
    return addr;
  }
  async function loadOwned(){
    var body=$x('rob-body'); var addr=''; try{ addr=(typeof connectedEvmAddr==='function'&&connectedEvmAddr())||''; }catch(e){}
    if(!addr){ body.innerHTML='<button class="rob-claim" id="rob-conn" style="width:auto;padding:8px 16px">'+T('rob.connect_wallet')+'</button>'; var b=$x('rob-conn'); if(b) b.onclick=function(){ connectRobber().then(loadOwned).catch(function(){}); }; return; }
    body.innerHTML='<div class="rob-empty">'+T('rob.reading')+'</div>';
    try{
      var d=await (typeof api==='function'? api('robbers/owned?address='+addr) : fetch('api/robbers/owned?address='+addr).then(function(r){return r.json();}));
      if(!d.robbers||!d.robbers.length){ body.innerHTML='<div class="rob-empty">'+T('rob.none')+'</div>'; return; }
      var banner = d.armed? '' : '<div class="rob-banner">'+T('rob.banner')+'</div>';
      body.innerHTML=banner+'<div class="rob-grid">'+d.robbers.map(function(r){
        var loaded=Number(r.stash)>0;
        return '<div class="rob-card"><div class="rob-id">'+T('rob.robber_n',{id:r.tokenId})+'</div><div class="rob-tba">'+short(r.tba)+'</div>'
          +'<div class="rob-stash'+(loaded?'':' z')+'">'+money(r.stash)+'</div>'
          +'<button class="rob-claim" data-id="'+r.tokenId+'"'+(loaded?'':' disabled')+'>'+(loaded?T('rob.claim'):T('rob.empty'))+'</button></div>';
      }).join('')+'</div>';
      Array.prototype.forEach.call(body.querySelectorAll('.rob-claim[data-id]'), function(btn){ btn.onclick=function(){ claim(parseInt(btn.getAttribute('data-id'),10)); }; });
    }catch(e){ body.innerHTML='<div class="rob-empty">'+T('rob.could_not_read')+'</div>'; }
  }
  async function loadLb(){
    var el=$x('rob-lb');
    try{ var d=await fetch('api/robbers/leaderboard?limit=10').then(function(r){return r.json();});
      if(!d.armed){ el.innerHTML='<div class="rob-empty">'+T('rob.lb_arms')+'</div>'; return; }
      if(!d.rows.length){ el.innerHTML='<div class="rob-empty">'+T('rob.lb_none')+'</div>'; return; }
      el.innerHTML=d.rows.map(function(r,i){ return '<div class="rob-row"><span><b>#'+(i+1)+'</b> &nbsp; '+T('rob.robber_n',{id:r.tokenId})+'</span><span class="rob-amt">'+money(r.stash)+'</span></div>'; }).join('');
    }catch(e){ el.innerHTML='<div class="rob-empty">'+T('rob.lb_unavail')+'</div>'; }
  }
  async function loadFeed(){
    var el=$x('rob-feed');
    try{ var d=await fetch('api/robbers/feed?limit=12').then(function(r){return r.json();});
      if(!d.rows||!d.rows.length){ el.innerHTML='<div class="rob-empty">'+T('rob.feed_none')+'</div>'; return; }
      el.innerHTML=d.rows.map(function(r){ return '<div class="rob-row"><span>'+T('rob.slipped',{id:r.tokenId})+'</span><span class="rob-amt">'+money(r.amount)+'</span></div>'; }).join('');
    }catch(e){ el.innerHTML='<div class="rob-empty">'+T('rob.feed_unavail')+'</div>'; }
  }
  async function claim(tokenId){
    if(_busy) return; _busy=true;
    try{
      var addr=await connectRobber();
      var hdr={'Content-Type':'application/json'}; try{ if(typeof TOKEN!=='undefined'&&TOKEN) hdr['x-vs-token']=TOKEN; }catch(e){}
      var plan=await fetch('api/robbers/claim-plan',{method:'POST',headers:hdr,body:JSON.stringify({tokenId:tokenId,address:addr})}).then(function(r){return r.json();});
      if(plan.error) throw new Error(plan.error);
      if(!plan.steps||!plan.steps.length){ if(typeof toast==='function') toast(T('rob.nothing_claim',{id:tokenId})); _busy=false; return; }
      var eip=robberWallet(); var bp=new ethers.BrowserProvider(eip); var signer=await bp.getSigner();
      for(var i=0;i<plan.steps.length;i++){ var s=plan.steps[i]; if(typeof toast==='function') toast(s.label+'…'); var tx=await signer.sendTransaction({to:s.to,data:s.data,value:0n}); await tx.wait(); }
      if(typeof toast==='function') toast(T('rob.claimed'));
      loadOwned();
    }catch(e){ if(typeof toast==='function') toast(String(e&&e.message||T('rob.claim_failed')).slice(0,90)); }
    _busy=false;
  }
  function open(){ getCfg(); ov.classList.add('on'); loadOwned(); loadLb(); loadFeed(); }
  function close(){ ov.classList.remove('on'); }
  fab.onclick=open; $x('rob-x').onclick=close;
  ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
})();
